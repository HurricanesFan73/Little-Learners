about a month","Name or draw at least three phases: new moon (dark), half moon, and full moon","State that the pattern repeats — the Moon goes through the same shapes again and again"],"pre":[["mt_PiWZA8Z0ZJ","Must know the Moon is a sky object before observing its phases","h"]]},{"id":"mt_XlyF294bPR","s":"Science","d":"Space Exploration","n":"Our Solar System","desc":"Know that there are other planets besides Earth and that our group of planets orbiting the Sun is called the solar system — and that space is the vast area beyond Earth's sky","a":[5,7],"ev":["State that Earth is a planet and there are other planets too","Use the term 'solar system' to describe the Sun and the planets that orbit it","Explain that space is the area beyond the Earth's sky, where the planets and stars are"],"pre":[["mt_PiWZA8Z0ZJ","Must know the Sun and stars before learning about planets and the solar system","h"]]},{"id":"mt_BVpB5wyijZ","s":"Science","d":"Space Exploration","n":"Spotting Constellations","desc":"Recognise a few star patterns (constellations) in the night sky, starting with the Big Dipper (the Plough), and understand that the North Star (Polaris) can be found using the Big Dipper","a":[5,7],"ev":["Identify or draw the Big Dipper (the Plough) as a pattern of seven stars","Explain that the two end stars of the Big Dipper's bowl point towards the North Star","State that constellations are patterns of stars that people have named"],"pre":[["mt_PiWZA8Z0ZJ","Must know stars are sky objects before recognising patterns among them","h"]]},{"id":"mt_PiWZA8Z0ZJ","s":"Science","d":"Space Exploration","n":"Sun, Moon & Stars","desc":"Identify the Sun, Moon, and stars as objects in the sky and describe basic differences: the Sun gives light and heat during the day, stars are tiny points of light at night, and the Moon can appear in both the day and night sky","a":[5,7],"ev":["Name the Sun, Moon, and stars as objects in the sky","State that the Sun appears during the day and gives us light and heat","State that stars appear at night and the Moon can sometimes be seen during the day too"],"pre":[["mt_K0mZxY2AM8","Curriculum daylight/seasons observation supports exploratory Sun/Moon/stars identification","s"]]},{"id":"mt_oiqsIP97V3","s":"Science","d":"Space Exploration","n":"What Astronauts Do","desc":"Know that astronauts are people who travel to space in rockets, that humans have walked on the Moon (Apollo missions), and that astronauts today live and work on the International Space Station","a":[5,7],"ev":["Define an astronaut as a person who travels to space","State that humans landed on the Moon during the Apollo missions","Describe the International Space Station as a place where astronauts live and work in orbit around Earth"],"pre":[["mt_XlyF294bPR","Knowing about space and planets provides context for understanding astronauts","s"]]},{"id":"mt_EHuU1ZeUFA","s":"Science","d":"Space Systems & Earth's History","n":"Naming the Planets","desc":"Name the planets in our solar system in order from the Sun and use vocabulary for space — planet, star, sun, moon, satellite, orbit, solar system, galaxy, universe, asteroid, comet — applying these correctly when describing the structure of the solar system and objects we see in the sky","a":[5,8],"ev":["Name the eight planets in order from the Sun without prompting","Use 'orbit' correctly to describe the movement of planets around the Sun and moons around planets","Distinguish between a planet, a moon, a star, and an asteroid using the correct vocabulary"],"pre":[]},{"id":"mt_K0mZxY2AM8","s":"Science","d":"Space Systems & Earth's History","n":"Why seasons change","desc":"Make observations at different times of year to relate the amount of daylight to the time of year, noticing longer days in summer and shorter days in winter","a":[5,7],"ev":["Describe the pattern: more daylight hours in summer, fewer in winter","Compare sunrise/sunset times at different points in the year","Relate amount of daylight to seasonal changes in weather and nature"],"pre":[["mt_EHuU1ZeUFA","Relating daylight length to time of year draws on orbit and solar system vocabulary","s"],["mt_go5i87u2b9","Seasonal changes observation supports daylight pattern recognition","s"]]},{"id":"mt_cxJRc15osy","s":"Science","d":"The Human Body","n":"Basic Body Needs","desc":"Know that the body needs food for energy, water to stay hydrated, sleep to rest and grow, and exercise to keep muscles and the heart strong — and that these are basic needs every human body has","a":[5,7],"ev":["List the four basic needs: food (energy), water (hydration), sleep (rest and growth), exercise (strength)","Explain that food gives the body energy to move, think, and grow","Describe what happens if one need isn't met (e.g. feeling tired without sleep, thirsty without water)"],"pre":[["mt_lp1eTsQen7","Basic needs (exercise keeps heart strong) connects to knowing the heart pumps blood","s"],["mt_tiPyEkm4cU","Basic needs (body needs air) connects to knowing about breathing and lungs","s"]]},{"id":"mt_SdIWVjzopp","s":"Science","d":"The Human Body","n":"Bones & Muscles","desc":"Know that the body has a skeleton made of bones inside it that gives the body its shape and protects important organs like the brain (skull) and heart (ribcage), and that muscles attached to bones allow the body to move","a":[5,7],"ev":["State that bones give the body shape, support, and protection","Name at least three bones or bone groups (e.g. skull, ribcage, spine, leg bones)","Explain that muscles pull on bones to make the body move"],"pre":[]},{"id":"mt_tiPyEkm4cU","s":"Science","d":"The Human Body","n":"How Breathing Works","desc":"Know that we breathe air into our lungs through the nose and mouth, that our lungs take in oxygen from the air which our body needs to stay alive, and that we breathe out carbon dioxide as waste","a":[5,7],"ev":["Trace the path of air: nose/mouth → windpipe → lungs","State that lungs take oxygen from the air, which the body needs","State that we breathe out carbon dioxide, which the body doesn't need"],"pre":[]},{"id":"mt_pJ5zsocdNx","s":"Science","d":"The Human Body","n":"The Brain Controls the Body","desc":"Understand that the brain is the body’s control centre: it receives messages from the senses, thinks and makes decisions, and sends messages through nerves to tell muscles what to do","a":[5,7],"ev":["State that the brain is inside the skull and controls the whole body","Describe the basic loop: senses send information to the brain, the brain decides what to do, and sends messages to muscles","Give an example (e.g. eyes see a ball coming, brain decides to catch it, nerves tell hands to move)"],"pre":[]},{"id":"mt_nwSWPTENmv","s":"Science","d":"The Human Body","n":"The Five Senses","desc":"Explore the five senses in detail: sight uses eyes to detect light, hearing uses ears to detect sound, touch uses skin to feel pressure and temperature, taste uses the tongue to detect flavours, and smell uses the nose to detect odours","a":[5,7],"ev":["Name all five senses and match each to the correct body part","Describe what each sense detects (e.g. eyes detect light, ears detect sound waves)","Give an example of using each sense in everyday life (e.g. smelling food cooking, feeling hot water)"],"pre":[["mt_83gRQ9OPkc","Exploratory five senses in detail complements curriculum body parts and senses topic (GB Y1)","s"],["mt_pJ5zsocdNx","Senses send messages to brain; understanding senses helps understand why brain receives signals","s"]]},{"id":"mt_lp1eTsQen7","s":"Science","d":"The Human Body","n":"The Heart & Blood","desc":"Understand that the heart is a muscle that pumps blood around the body through tubes called blood vessels, and that we can feel our heartbeat by placing a hand on our chest or fingers on our wrist","a":[5,7],"ev":["Locate their own heartbeat by touch (chest or pulse point)","State that the heart pumps blood through the body continuously","Describe blood vessels as tubes that carry blood to every part of the body"],"pre":[]},{"id":"mt_uUa6cgv8zV","s":"Science","d":"Volcanoes & Earthquakes","n":"Earth Is Made of Rock","desc":"Understand that Earth is made of rock and other solid materials","a":[5,7],"ev":["State that the ground beneath us is made of rock","Identify rocks and stones as pieces of the Earth","Explain that Earth is solid and made of natural materials"],"pre":[]},{"id":"mt__pMF-Xb0TE","s":"Science","d":"Volcanoes & Earthquakes","n":"Earthquake Safety","desc":"Know basic earthquake safety: drop, cover, and hold on; move away from windows; tell a trusted adult","a":[5,7],"ev":["Demonstrate the drop, cover, and hold on procedure","Explain why to move away from windows and shelves during shaking","Name a trusted adult to tell if they feel an earthquake"],"pre":[["mt_e29VrLfmYt","Earthquake safety benefits from knowing what an earthquake is","s"]]},{"id":"mt_adpdEaKEBC","s":"Science","d":"Volcanoes & Earthquakes","n":"Fast & Slow Earth Changes","desc":"Understand that Earth's surface changes: some changes are quick (eruptions, earthquakes) and some are slow (wind, water wearing away rock)","a":[5,7],"ev":["Give an example of a quick change to Earth's surface like a volcanic eruption","Give an example of a slow change to Earth's surface like erosion by wind or water","Compare quick and slow changes and explain the difference"],"pre":[["mt_e29VrLfmYt","Quick/slow changes concept benefits from earthquake as example of quick change","s"],["mt_S9SKah-yi_","Quick/slow changes concept benefits from volcano as example of quick change","s"]]},{"id":"mt_BLQ2_OXPod","s":"Science","d":"Volcanoes & Earthquakes","n":"Power of Eruptions","desc":"Appreciate that volcanic eruptions are powerful events that can change the landscape","a":[5,7],"ev":["Describe an eruption as a powerful, dramatic event","Give examples of how an eruption changes the area around a volcano","Compare the landscape before and after an eruption using pictures"],"pre":[["mt_S9SKah-yi_","Appreciating eruption power benefits from knowing what a volcano is","s"]]},{"id":"mt_e29VrLfmYt","s":"Science","d":"Volcanoes & Earthquakes","n":"What Is an Earthquake","desc":"Know what an earthquake is: a sudden shaking of the ground that can be strong or weak","a":[5,7],"ev":["Describe an earthquake as the ground shaking suddenly","Explain that earthquakes vary in strength from barely noticeable to very strong","Describe what it might feel like during an earthquake"],"pre":[]},{"id":"mt_S9SKah-yi_","s":"Science","d":"Volcanoes & Earthquakes","n":"What Is a Volcano","desc":"Know what a volcano is: an opening in Earth's surface where hot melted rock (lava) comes out","a":[5,7],"ev":["Describe a volcano as a place where hot material comes out of the Earth","Explain that lava is rock so hot it has melted","Point to a volcano in a picture and describe what is happening"],"pre":[]},{"id":"mt_Dj2xr8CoI0","s":"Science","d":"Weather & Climate","n":"Dressing for the Weather","desc":"Choose appropriate clothing and equipment for different weather conditions — coat and umbrella for rain, sun hat and sunscreen for hot sun, warm layers for cold — understanding that weather affects what we do and how we prepare each day","a":[5,7],"ev":["Select appropriate clothing for at least three different weather conditions","Explain why certain clothes or equipment are needed for specific weather","Describe how weather affects daily activities like playtime, walking to school, or outdoor events"],"pre":[["mt_jc9k_HJQGd","Dressing for weather benefits from knowing weather types","s"],["mt_PrWc-HZzDl","Clothing choices benefit from understanding temperature","s"]]},{"id":"mt_TlLE4cZgOr","s":"Science","d":"Weather & Climate","n":"Rain & Puddles","desc":"Know that rain falls from clouds in the sky, that puddles disappear because water goes back into the air, and that this is part of how water moves around — up into the sky and back down again","a":[5,7],"ev":["State that rain falls from clouds","Explain that puddles disappear because the water goes into the air","Describe the basic idea that water goes up and comes back down in a repeating process"],"pre":[["mt_jc9k_HJQGd","Rain concept benefits from knowing rain as a weather type","s"]]},{"id":"mt_fI-8iqf_Id","s":"Science","d":"Weather & Climate","n":"Seasons & Weather Patterns","desc":"Know that weather changes with the seasons — spring brings rain and new growth, summer is warmest with long days, autumn brings cooling and falling leaves, winter is coldest with short days — and that this pattern repeats every year","a":[5,7],"ev":["Name the four seasons and describe typical weather for each","Explain that days are longer in summer and shorter in winter","State that the seasonal pattern repeats every year"],"pre":[["mt_go5i87u2b9","Seasons/weather patterns parallels curriculum four seasons topic","s"],["mt_jc9k_HJQGd","Seasons benefit from weather vocabulary","s"]]},{"id":"mt_4pLvMN8uzL","s":"Science","d":"Weather & Climate","n":"Storm Safety","desc":"Know basic storm safety: during thunder and lightning, go indoors or into a car, stay away from trees and water; understand that storms can be frightening but there are ways to stay safe","a":[5,7],"ev":["State at least two safety rules for thunderstorms","Explain why going indoors is the safest option during lightning","Describe that storms are natural events and there are ways to stay safe"],"pre":[["mt_jc9k_HJQGd","Storm safety benefits from knowing what storms are","s"]]},{"id":"mt_PrWc-HZzDl","s":"Science","d":"Weather & Climate","n":"Temperature & Thermometers","desc":"Understand temperature as how hot or cold something is, that a thermometer measures temperature, and use words like hot, warm, cool, and cold to describe how the air feels on different days","a":[5,7],"ev":["Explain that temperature describes how hot or cold something is","Identify a thermometer as the tool used to measure temperature","Use words like hot, warm, cool, and cold appropriately to describe air temperature"],"pre":[]},{"id":"mt_jc9k_HJQGd","s":"Science","d":"Weather & Climate","n":"Types of Weather","desc":"Identify and describe different types of weather — sunny, rainy, windy, snowy, cloudy, foggy, stormy — and describe what the weather is like today using simple vocabulary","a":[5,7],"ev":["Name at least five types of weather","Describe today's weather accurately using appropriate vocabulary","Match weather types to simple pictures or symbols"],"pre":[]},{"id":"mt_URezjbU-6f","s":"Science","d":"Weather & Climate","n":"Weather Forecasting & Safety","desc":"Ask questions to obtain information about the purpose of weather forecasting and how people prepare for and respond to severe weather","a":[5,6],"ev":["Explain that weather forecasts help people plan and stay safe","Describe how people prepare for at least two types of severe weather (storm, flood, heat wave, blizzard)","Ask relevant questions about weather hazards and find answers from appropriate sources"],"pre":[["mt_go5i87u2b9","Must observe weather and seasons before understanding weather forecasting purpose","h"]]},{"id":"mt_j7cj9eWN7w","s":"Science","d":"Weather & Climate","n":"What Is Wind?","desc":"Know that wind is moving air, that it can be gentle (a breeze) or very strong (a gale), and that wind can move things like leaves, kites, flags, and even push people","a":[5,7],"ev":["Define wind as air that is moving","Describe the difference between a gentle breeze and a strong wind","Give examples of things that wind can move or affect"],"pre":[]},{"id":"mt_k7GOtslF-x","s":"Science","d":"Forces & Motion","n":"Drawing Force Diagrams","desc":"Draw and interpret force diagrams showing forces as labelled arrows — where the arrow's length represents the force's magnitude and its direction shows which way the force acts; show multiple forces on one object; identify from the diagram whether forces are balanced (equal arrows in opposite directions, no resultant) or unbalanced (arrows of different sizes, producing a resultant); represent the resultant with a single arrow","a":[7,12],"ev":["Draw a force diagram with labelled arrows showing direction and relative size for at least two forces acting on an object","Use their diagram to explain whether forces are balanced or unbalanced and what will happen to the object","Add a resultant force arrow to a diagram and explain how they calculated it"],"pre":[]},{"id":"mt_32B7xjUPwF","s":"Learning to Learn","d":"Learning to Learn","n":"Connecting New & Old Ideas","desc":"Look for connections between new ideas and things you already know — how does this fit with what I've learned before?","a":[7,8],"ev":["elaborative encoding","schema theory (Bartlett, Rumelhart)"],"pre":[]},{"id":"mt_U_8iVFZuHH","s":"English","d":"English Thinking","n":"Reviewing Own Writing","desc":"Evaluate whether your own writing achieves the effect you intended on a reader — go beyond checking for correctness to asking whether it actually works","a":[8,10],"ev":["writing self-evaluation research grades 3-5","metacognitive awareness of writing (Frontiers 2025)"],"pre":[]},{"id":"mt_klyw-tdlhP","s":"Learning to Learn","d":"Learning to Learn","n":"Feeling of not understanding","desc":"Notice the feeling of not understanding — recognise when something is confusing rather than reading or listening past it","a":[6,7],"ev":["comprehension monitoring research","Flavell metacognitive monitoring"],"pre":[]},{"id":"mt_GugVunb2lI","s":"English","d":"English Thinking","n":"Monitoring Comprehension","desc":"Notice the difference between decoding words and actually understanding them — recognise when you've read the words but not grasped the meaning, and do something about it","a":[6,8],"ev":["comprehension monitoring research","Metacognitive Monitoring in Reading Comprehension (MDPI 2024)"],"pre":[]},{"id":"mt_LE7nFEwS12","s":"Learning to Learn","d":"Learning to Learn","n":"Thinking Before Starting","desc":"Before starting something new, stop and think: what do I already know about this topic?","a":[6,7],"ev":["prior knowledge activation research","Ausubel meaningful learning"],"pre":[]},{"id":"mt_V-ldQp56bF","s":"English","d":"Phonics & Word Reading","n":"Reading with Expression and Accuracy","desc":"Read aloud with accuracy, appropriate rate, and expression (prosody), re-reading familiar texts to build fluency and confidence, and using context to self-correct","a":[6,10],"ev":["Read a grade-level passage aloud with expression and appropriate pacing","Self-correct miscues during oral reading by re-reading or using context cues","Re-read a familiar book demonstrating increased fluency and confidence"],"pre":[]},{"id":"mt_wvcFlwOrDl","s":"Learning to Learn","d":"Learning to Learn","n":"Spotting Patterns","desc":"Spot patterns and recurring structures — in numbers, words, nature, sounds, or events — and use them to make sense of new information","a":[7,8],"ev":["Spot a pattern in a set of numbers, shapes, or facts without being told to look for one","Use a pattern they noticed to make a prediction — e.g. 'The next one should be 16 because it's doubling each time'","Explain the pattern they found and why they think it works"],"pre":[]},{"id":"mt_Hw70LI5xza","s":"Science","d":"Scientific Inquiry","n":"Observation vs Interpretation","desc":"Notice the difference between what you observed and what you think it means — 'the ice melted' is an observation; 'the ice melted because of the heat' is an interpretation","a":[6,7],"ev":["observation vs interpretation in primary science","BERA: children's observation skills in nature"],"pre":[]}],"acts":[{"t":"mt_WcfaSfVT33","e":"🍎","title":"Touch and Count","min":5,"sup":"Big blocks, toy cars, or stuffed animals","small":"Line up 3 big blocks. Touch each one as you say “one… two… three!” Let him tap along. Words aren’t required — he’s watching and hearing the rhythm.","big":"Let him do the tapping: one touch for each number. Try up to 5, then ask “How many?” and see if he repeats the last number.","say":"“One… two… three!”"},{"t":"mt_KJeEeTutJI","e":"🔺","title":"Shape Hunt","min":10,"sup":"Paper, scissors, a tray","small":"Point out circles as you go through the day: plate, ball, clock. Just say “circle!” each time.","big":"Go on a hunt for circles, squares, and triangles around the house. Cut matching paper shapes and let him lay them on top of the real objects.","say":"“Round like a ball. That’s a circle!”"},{"t":"mt_Qcp2d_kuta","e":"📦","title":"Ball, Box, Can","min":10,"sup":"A ball, a box, a can, a block","small":"Roll a ball, then try to roll a box. Let him feel the difference with his hands. Name each one.","big":"Sort household objects into “rolls” and “doesn’t roll.” Name the shapes: ball, cube, can.","say":"“The ball rolls! The box doesn’t.”"},{"t":"mt_qeZYF6HZ4o","e":"⬆️","title":"In, On, Under","min":10,"sup":"A basket, a blanket, a teddy","small":"Hide a toy in a basket or under a blanket and narrate: “in the basket!” “under the blanket!” Then let him find it.","big":"Give one-step directions: “Put the bear on the chair.” “Put the car under the table.” Then switch — he gives you directions.","say":"“Teddy is under the blanket!”"},{"t":"mt_NtJYlJdUe9","e":"📏","title":"Big, Small, Heavy, Light","min":10,"sup":"Two balls (one big, one small), a few household objects","small":"Hold a big ball and a small ball. Say “big ball, small ball.” Let him hold both and feel the weight.","big":"Fill a bag with mystery objects. Pull one out and ask: is it heavy or light? Soft or hard? Big or small?","say":"“This one is heavy. This one is light.”"},{"t":"mt_uhuxX8sg9f","e":"🧱","title":"Tall Tower, Short Tower","min":10,"sup":"Blocks or stacking cups","small":"Build a tower, say “tall!” together, and knock it down. Repeat until the giggles run out.","big":"Build a tall tower and a short tower. Line up toys from shortest to tallest. Who is taller — Daddy or the teddy?","say":"“Taller! Shorter!”"},{"t":"mt_zkFbMLpu3U","e":"🛁","title":"Full and Empty","min":15,"sup":"Cups, a bin of water or sand (supervised)","small":"Scoop and pour in the tub or a water bin. Say “full!” when it’s full and “empty!” when it’s poured out.","big":"Ask which cup holds more. Fill the small cup and pour it into the big one to see. Predict first, then check.","say":"“Full… empty! Let’s fill it again.”"},{"t":"mt__h7hvT4tEb","e":"🧸","title":"More or Fewer","min":5,"sup":"Stuffed animals or toy cars","small":"Show 1 teddy next to 3 teddies. Say “more!” and point to the bigger group.","big":"Make two piles of cars. Line them up in pairs, one-to-one, to see which pile has more left over. Say “more” or “fewer.”","say":"“Which one has more?”"},{"t":"mt_-vvVxpOHG2","e":"🌅","title":"First, Then","min":5,"sup":"Nothing — just your daily routine","small":"Use routine words naturally: “First shoes, then outside.” “First bath, then book.”","big":"Make 3–4 simple picture cards (breakfast, bath, book, bed). Let him put them in order and tell you the day’s story.","say":"“First… then… and last…”"},{"t":"mt_TcG90kS8nu","e":"⏳","title":"Quick and Slow","min":5,"sup":"A toy car, a song","small":"Push a toy car fast, then slow. Say “zoom!” and “sloooow.” Let him copy the speeds.","big":"Hop until a song ends. Then ask: which took longer — brushing teeth or clapping 3 times? Try a sand timer if you have one.","say":"“That was quick! That was slow.”"},{"t":"mt_4GiE83rJF_","e":"🎵","title":"Rhyme Time","min":5,"sup":"Nursery rhymes","small":"Sing familiar rhymes and pause before the last word so he can fill it in with a sound or a gesture.","big":"Play with word pairs: cat–hat, dog–log. Ask “Does cat rhyme with bat?” Make up silly rhymes together.","say":"“Cat, hat, bat — they sound alike!”"},{"t":"mt_1KCwbGvm1F","e":"📖","title":"Book Detective","min":10,"sup":"Any picture book","small":"Let him hold the board book, turn pages (even many at once!), and point to pictures. Name what he points at.","big":"Run your finger under the words as you read. Ask: “Where do I start reading? Which way do we turn the page?”","say":"“These squiggles are words. They tell the story.”"},{"t":"mt_mB7DVai-Uf","e":"👂","title":"Listening Game","min":5,"sup":"A ball, a teddy","small":"Give one-step requests: “Give me the ball.” “Hug the teddy.” Cheer when he does it.","big":"Try two steps: “Pat your head, then clap.” Take turns being the leader.","say":"“Listen… then do it!”"},{"t":"mt_WBfj79OqXz","e":"✏️","title":"Strong Little Hands","min":10,"sup":"Playdough, tongs, chunky crayons","small":"Squish and squeeze playdough or a sponge. Offer a chunky crayon and let him scribble however he likes.","big":"Pinch and roll playdough, use tongs to move pom-poms, then scribble lines and circles with a fat crayon.","say":"“Squeeze, squeeze, squeeze!”"},{"t":"mt_frDIaXzWbx","e":"🔤","title":"Letter of the Day","min":5,"sup":"Magnetic letters, a tray of flour or salt","small":"Sing the alphabet song with magnet letters. Show him the first letter of his name.","big":"Hunt for his first letter on cereal boxes and signs. Trace it with a finger in a flour or salt tray.","say":"“B! B for Ben… B for ball!”"},{"t":"mt_4A7FYmvVhA","e":"💬","title":"Tell Me About It","min":5,"sup":"Any toy or picture","small":"Name the thing, then add one word: “ball… red ball!” Expand whatever he says by one word.","big":"Describe a toy in 2–3 words: color, size, what it does. Try I-spy: “I spy something round and red.”","say":"“Tell me about your truck!”"},{"t":"mt_8-POYyg7GJ","e":"🔮","title":"What Happens Next?","min":5,"sup":"A familiar book","small":"Pause in a familiar book or song and let him anticipate what comes next. Peekaboo counts too!","big":"Stop mid-story: “What will the bear do now?” Or experiment: “What will happen if we pour water on the sponge?”","say":"“What do you think will happen?”"},{"t":"mt_f8n4txtLej","e":"❓","title":"Wondering Out Loud","min":5,"sup":"A picture book","small":"Model questions: “Where is the cat?” “What’s that?” Pause and give him time to point or answer.","big":"Take turns asking questions about a picture. Celebrate every “what’s that?” — that’s the skill growing.","say":"“I wonder… what is that?”"},{"t":"mt_83gRQ9OPkc","e":"👃","title":"Body and Senses Tour","min":10,"sup":"A cloth bag with mystery objects","small":"Sing “Head, Shoulders, Knees and Toes.” Ask “Where’s your nose?” and tickle each part as you name it.","big":"Do a sense walk: what can we hear, smell, touch, see? Try a mystery bag — feel inside and guess.","say":"“We smell with our nose!”"},{"t":"mt_zVLOm6U7bh","e":"🐶","title":"Animal Sounds","min":10,"sup":"Toy animals or animal picture cards","small":"Hold up toy animals and make their sounds. Wait for him to join in on the sound.","big":"Sort toy animals into “farm” and “zoo” groups. Ask: which animal says moo? Which one has a long neck?","say":"“The cow says moo!”"},{"t":"mt_ZAJvTcroFO","e":"🪵","title":"Feel the Material","min":10,"sup":"Spoon (wood), cup (plastic), cloth, metal lid","small":"Touch different things together: soft blanket, smooth plastic cup, rough wood spoon. Describe each feel.","big":"Name materials — wood, metal, plastic, cloth — and sort objects into groups by what they’re made of.","say":"“This spoon is wood. It feels rough.”"},{"t":"mt_B3W5EfimJw","e":"🛒","title":"Push and Pull","min":10,"sup":"A wagon or toy truck, a string toy, a ramp","small":"Push a toy truck. Pull a wagon or string toy. Say “push!” and “pull!” with each movement.","big":"Ask “push or pull?” as you open a drawer, roll a ball, tug a door. Try a ramp: what happens with a big push?","say":"“Push… or pull?”"},{"t":"mt_go5i87u2b9","e":"🍂","title":"Weather Window","min":5,"sup":"A window or yard","small":"Go outside and feel the sun, wind, or rain. Say “sunny!” “windy!” “wet!”","big":"Each morning, look out the window and name the weather. Choose clothes to match. Notice changes in leaves as the seasons shift.","say":"“What’s the weather today?”"},{"t":"mt_j7cer_Nmor","e":"🌳","title":"Tree and Flower Walk","min":15,"sup":"A bag for treasures","small":"Touch bark, leaves, and grass. Say “tree!” “leaf!” “flower!” Smell flowers together.","big":"Collect leaves and compare them: big and small, smooth and bumpy. Name tree, flower, grass, bush.","say":"“This is a leaf. This is a tree.”"},{"t":"mt_LhkP_KKIRS","e":"😊","title":"Feelings Faces","min":5,"sup":"A mirror or a picture book","small":"Make happy, sad, and surprised faces in a mirror. Let him copy. Point out faces in books.","big":"Name feelings in book characters: “He looks sad. Why?” Take turns saying “I feel happy when…”","say":"“You look happy! I feel happy too.”"},{"t":"mt_FwI7q7DSIx","e":"🤝","title":"My Turn, Your Turn","min":10,"sup":"A ball","small":"Sit across from each other and roll a ball back and forth. Say “my turn… your turn!”","big":"Take turns with a toy or game. Try sharing a snack between brothers: “One for you, one for your brother.”","say":"“Your turn! My turn!”"},{"t":"mt_Iwg2diBSyW","e":"🌬️","title":"Smell the Flower, Blow the Candle","min":5,"sup":"Bubbles (optional)","small":"Blow bubbles together. Slow breaths make bigger bubbles! Practice when calm, not mid-meltdown.","big":"“Smell the flower” (breathe in) and “blow out the candle” (breathe out) — three times. Use it again when big feelings come.","say":"“Smell the flower… blow the candle.”"},{"t":"mt_nNDX_jZ-cb","e":"⏱️","title":"Wait for It","min":5,"sup":"A song or a snack","small":"Very short waits: “One, two, three… then bubbles!” Celebrate when he waits.","big":"Wait for a short song to finish before a treat. Say “Waiting is hard — and you did it!”","say":"“Wait… wait… now!”"},{"t":"mt_lAvS72LOUO","e":"💛","title":"Gentle Hands, Kind Hearts","min":10,"sup":"A doll or stuffed animal","small":"Give gentle pats to a stuffed animal. Say “gentle.” Show him how to hug softly.","big":"Care for a baby doll: feed, rock, tuck in. Notice when someone is sad: “What could we do to help?”","say":"“Gentle hands. Kind hearts.”"},{"t":"mt_mvXufozy2s","e":"🙋","title":"Help, Please!","min":5,"sup":"A jar or toy he can’t quite open","small":"Teach a simple sign or word for “help” or “more.” Model it when he’s stuck, and respond right away.","big":"Set up a toy just out of reach or a lid that sticks. Wait, then prompt: “You can say ‘Help please!’”","say":"“Help, please!”"},{"t":"mt_S4G6GLKr1-","e":"💪","title":"Try Again","min":10,"sup":"Stacking cups or a chunky puzzle","small":"Stacking cups or simple puzzles: cheer for trying, not just for succeeding.","big":"Try a harder puzzle. Model out loud: “That’s tricky. Let’s try again!” Praise the effort.","say":"“It’s hard — let’s try again!”"},{"t":"mt_q3vRl4dddK","e":"🚦","title":"Red Light, Green Light","min":10,"sup":"Nothing needed","small":"Practice “stop” and “go” in a fun chase. Say “hot!” and “stop!” as a safety word in real life.","big":"Play red light, green light. Practice holding hands in a parking lot and stopping at curbs.","say":"“Red means stop. Green means go.”"}]};
var TOPICS = DATA.topics, ACTS = DATA.acts;
var BYID = {}; TOPICS.forEach(function(t){BYID[t.id]=t;});
var ACT_BY_TOPIC = {}; ACTS.forEach(function(a){ACT_BY_TOPIC[a.t]=a;});
var UNLOCKS = {};
TOPICS.forEach(function(t){t.pre.forEach(function(p){(UNLOCKS[p[0]]=UNLOCKS[p[0]]||[]).push(t.id);});});

var SUBJ_ICON = {"Mathematics":"🔢","English":"📚","Science":"🔬","Personal & Social Development":"💛","Learning to Learn":"🌱","Life Skills":"🧺","History":"🏛️","Computing":"💻"};
function subjOf(a){return BYID[a.t].s;}

/* ---------- storage (safe) ---------- */
var mem = {};
function load(){try{var v=localStorage.getItem("ll_progress");if(v)return JSON.parse(v);}catch(e){}return mem.p||{older:{},younger:{}};}
function save(p){mem.p=p;try{localStorage.setItem("ll_progress",JSON.stringify(p));}catch(e){}}
var progress = load();
if(!progress.older)progress.older={}; if(!progress.younger)progress.younger={}; if(!progress.ts)progress.ts={};
function bump(c,id,val){progress[c][id]=val;progress.ts[c+"|"+id]=Date.now();}

/* ---------- state ---------- */
var S = {tab:"today", child:"older", shuffle:0, subj:"All", q:"", detail:null, foundOnly:false, aSubj:"All"};
var CH = {older:{label:"Javi",age:"2½"}, younger:{label:"Davi",age:"1½"}};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ---------- seeded pick ---------- */
function hash(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){var s=seed||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function todayPicks(){
  var d=new Date();var key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+"-"+S.child+"-"+S.shuffle;
  var r=rng(hash(key));var done=progress[S.child];
  var pool=ACTS.slice().map(function(a){return {a:a,k:(done[a.t]||0)+r()*0.99};}).sort(function(x,y){return x.k-y.k;}).map(function(x){return x.a;});
  var out=[],seen={};
  pool.forEach(function(a){if(out.length<3&&!seen[subjOf(a)]){out.push(a);seen[subjOf(a)]=1;}});
  return out;
}

/* ---------- views ---------- */
function childToggle(){
  return '<div class="seg">'+["older","younger"].map(function(k){
    return '<button data-act="child" data-v="'+k+'" class="'+(S.child===k?"on":"")+'">'+CH[k].label+'<small>about '+CH[k].age+' years</small></button>';
  }).join("")+'</div>';
}
function actCard(a,open){
  var t=BYID[a.t];var me=S.child==="older"?"big":"small";var other=S.child==="older"?"small":"big";
  var n=progress[S.child][a.t]||0;
  var h='<div class="card"><div class="row"><div class="emo">'+a.e+'</div><div style="flex:1"><div class="ttl">'+esc(a.title)+'</div>'+
    '<div class="meta"><span class="pill">'+esc(t.s==="Personal & Social Development"?"Social & Emotional":t.s)+'</span>~'+a.min+' min</div></div></div>';
  h+='<div class="for"><b>For '+CH[S.child].label+' (~'+CH[S.child].age+')</b>'+esc(a[me])+'</div>';
  h+='<details><summary>Version for '+(S.child==="older"?"Davi (~1½)":"Javi (~2½)")+'</summary><p>'+esc(a[other])+'</p></details>';
  h+='<div class="say">Try saying: '+esc(a.say)+'</div>';
  h+='<div class="meta">You’ll need: '+esc(a.sup)+'</div>';
  h+='<div class="btns"><button class="btn'+(n?" done":"")+'" data-act="done" data-v="'+a.t+'">'+(n?"✓ Done "+n+"×  (tap for another)":"Mark as done")+'</button>'+
     '<button class="btn ghost" data-act="topic" data-v="'+a.t+'">Skill behind it</button></div></div>';
  return h;
}
function viewToday(){
  var picks=todayPicks();
  var h='<h1>Today’s play</h1><p class="sub">Three short activities, picked for variety.</p>'+childToggle();
  picks.forEach(function(a){h+=actCard(a);});
  h+='<div class="btns" style="margin-bottom:6px"><button class="btn ghost" data-act="shuffle">🔀 Give me different ones</button></div>';
  var tot=ACTS.length,tried=ACTS.filter(function(a){return progress[S.child][a.t];}).length;
  h+='<div class="card"><div class="ttl">Tried so far ('+CH[S.child].label+')</div><div class="bar"><i style="width:'+Math.round(tried/tot*100)+'%"></i></div><div class="meta">'+tried+' of '+tot+' activities</div></div>';
  h+='<p class="note">Stay close and supervise. For children under 3, skip small items (coins, buttons, dry beans) and use large, safe objects. Water play always needs an adult within arm’s reach.</p>';
  return h;
}
function subjectChips(sel,act){
  var subs=["All"].concat(Object.keys(SUBJ_ICON).filter(function(s){return TOPICS.some(function(t){return t.s===s;});}));
  return '<div class="chips">'+subs.map(function(s){return '<button class="chip'+(sel===s?" on":"")+'" data-act="'+act+'" data-v="'+esc(s)+'">'+(SUBJ_ICON[s]||"")+" "+esc(s==="Personal & Social Development"?"Social & Emotional":s)+'</button>';}).join("")+'</div>';
}
function viewActs(){
  var h='<h1>All activities</h1><p class="sub">'+ACTS.length+' ideas. Each has a version for both ages.</p>'+childToggle();
  var subs=["All"].concat(Object.keys(SUBJ_ICON).filter(function(s){return ACTS.some(function(a){return subjOf(a)===s;});}));
  h+='<div class="chips">'+subs.map(function(s){return '<button class="chip'+(S.aSubj===s?" on":"")+'" data-act="asubj" data-v="'+esc(s)+'">'+(SUBJ_ICON[s]||"")+" "+esc(s==="Personal & Social Development"?"Social & Emotional":s)+'</button>';}).join("")+'</div>';
  var list=ACTS.filter(function(a){return S.aSubj==="All"||subjOf(a)===S.aSubj;});
  list.forEach(function(a){h+=actCard(a);});
  return h;
}
function topicLine(id){var t=BYID[id];return '<div class="tl" data-act="topic" data-v="'+id+'"><div class="n">'+esc(t.n)+'</div><div class="meta">'+esc(t.s)+' · '+esc(t.d)+' · ages '+t.a[0]+'–'+t.a[1]+(ACT_BY_TOPIC[id]?' · <b style="color:var(--accent)">toddler activity</b>':'')+'</div></div>';}
function viewExplore(){
  if(S.detail)return viewDetail(S.detail);
  var q=S.q.trim().toLowerCase();
  var list=TOPICS.filter(function(t){
    if(S.subj!=="All"&&t.s!==S.subj)return false;
    if(S.foundOnly&&t.pre.length)return false;
    if(q&&(t.n+" "+t.d+" "+t.desc).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return a.a[0]-b.a[0]||a.n.localeCompare(b.n);});
  var h='<h1>Explore the data</h1><p class="sub">The Marble Skill Taxonomy covers what children learn from about age 4. Here are the earliest topics — the foundations your boys are building toward.</p>';
  h+='<input type="search" id="q" placeholder="Search topics (e.g. shapes, feelings, rhyme)" value="'+esc(S.q)+'">';
  h+=subjectChips(S.subj,"subj");
  h+='<div class="chips" style="padding-top:0"><button class="chip'+(S.foundOnly?" on":"")+'" data-act="found">🌱 Starting points only (no prerequisites)</button></div>';
  h+='<p class="hl">'+list.length+' topics</p><div class="card" style="padding:4px 14px">';
  h+=list.length?list.slice(0,80).map(function(t){return topicLine(t.id);}).join(""):'<div class="empty">No topics match.</div>';
  h+='</div>';
  if(list.length>80)h+='<p class="note">Showing the first 80. Narrow with search or a subject.</p>';
  h+='<p class="note">Data: Marble Skill Taxonomy (v1) · © Generative Spark, Inc. (Marble) · withmarble.com · licensed under ODbL 1.0 (database) and CC BY-SA 4.0 (content). Toddler activities in this app were written separately for this page.</p>';
  return h;
}
function viewDetail(id){
  var t=BYID[id];var a=ACT_BY_TOPIC[id];
  var h='<button class="back" data-act="back">← Back</button><div class="card"><div class="meta"><span class="pill">'+esc(t.s)+'</span>'+esc(t.d)+' · ages '+t.a[0]+'–'+t.a[1]+'</div><h1 style="margin-top:6px">'+esc(t.n)+'</h1><p style="margin:6px 0">'+esc(t.desc)+'</p>';
  if(t.ev&&t.ev.length){h+='<div class="meta" style="margin-top:10px"><b>What mastery looks like (later, around age '+t.a[0]+'+)</b></div><ul>'+t.ev.map(function(e){return '<li>'+esc(e)+'</li>';}).join("")+'</ul>';}
  h+='</div>';
  if(a){h+='<div class="meta" style="margin:0 0 6px"><b>Toddler on-ramp</b></div>'+actCard(a);}
  else{h+='<div class="card"><div class="meta">No toddler activity written for this one yet — it’s a skill that comes later.</div></div>';}
  var pre=t.pre.filter(function(p){return BYID[p[0]];});
  if(pre.length){h+='<div class="card"><div class="ttl">Builds on</div><p class="hl">Ideas to learn first</p>'+pre.map(function(p){return '<div class="tl" data-act="topic" data-v="'+p[0]+'"><div class="n">'+esc(BYID[p[0]].n)+'</div><div class="meta">'+esc(p[1])+'</div></div>';}).join("")+'</div>';}
  else{h+='<div class="card"><div class="meta">🌱 A starting point — it doesn’t depend on other topics in this set.</div></div>';}
  var un=(UNLOCKS[id]||[]);
  if(un.length){h+='<div class="card"><div class="ttl">Leads to</div>'+un.slice(0,12).map(function(u){return topicLine(u);}).join("")+'</div>';}
  return h;
}
function viewProgress(){
  var h='<h1>Progress</h1><p class="sub">Saved on this device only.</p>'+childToggle();
  var subs=Object.keys(SUBJ_ICON).filter(function(s){return ACTS.some(function(a){return subjOf(a)===s;});});
  subs.forEach(function(s){
    var l=ACTS.filter(function(a){return subjOf(a)===s;});var d=l.filter(function(a){return progress[S.child][a.t];}).length;
    h+='<div class="card"><div class="row"><div class="emo">'+SUBJ_ICON[s]+'</div><div style="flex:1"><div class="ttl">'+esc(s==="Personal & Social Development"?"Social & Emotional":s)+'</div><div class="bar"><i style="width:'+Math.round(d/l.length*100)+'%"></i></div><div class="meta">'+d+' of '+l.length+' tried</div></div></div></div>';
  });
  h+='<div class="btns"><button class="btn ghost" data-act="reset">Reset '+CH[S.child].label+'’s progress</button></div>';
  return h;
}

/* ---------- weekly plan ---------- */
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function loadW(){try{var v=localStorage.getItem("ll_weeks");if(v)return JSON.parse(v);}catch(e){}return mem.w||{};}
var WEEKS=loadW();
function saveW(){mem.w=WEEKS;try{localStorage.setItem("ll_weeks",JSON.stringify(WEEKS));}catch(e){}}
function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function ymd(x){return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate();}
function weekLabel(x){var e=new Date(x.getFullYear(),x.getMonth(),x.getDate()+6);return MON[x.getMonth()]+" "+x.getDate()+"–"+(x.getMonth()===e.getMonth()?"":MON[e.getMonth()]+" ")+e.getDate();}
function cnt(id){return (progress.older[id]||0)+(progress.younger[id]||0);}
function genWeek(k,n,size){size=size||6;
  var r=rng(hash(k+"-"+n));
  var pool=ACTS.slice().map(function(a){return {a:a,k:cnt(a.t)+r()*0.99};}).sort(function(x,y){return x.k-y.k;}).map(function(x){return x.a;});
  var out=[],seen={};
  pool.forEach(function(a){if(out.length<size&&!seen[subjOf(a)]){out.push(a.t);seen[subjOf(a)]=1;}});
  pool.forEach(function(a){if(out.length<size&&out.indexOf(a.t)<0)out.push(a.t);});
  return out;
}
function curWeek(){var ws=weekStart(new Date());var k=ymd(ws);if(!WEEKS[k]){WEEKS[k]={ids:genWeek(k,0,6),done:{},n:0};saveW();}return {k:k,ws:ws,w:WEEKS[k]};}
function viewPick(){
  var c=curWeek(),w=c.w;
  var h='<button class="back" data-act="ppick">← Back to plan</button><h1>Pick your own</h1><p class="sub">'+w.ids.length+' in this week’s plan (1–12 allowed). Tap to add or remove.</p>';
  var subs=["All"].concat(Object.keys(SUBJ_ICON).filter(function(s){return ACTS.some(function(a){return subjOf(a)===s;});}));
  var cur=S.pSubj||"All";
  h+='<div class="chips">'+subs.map(function(s){return '<button class="chip'+(cur===s?" on":"")+'" data-act="psubj" data-v="'+esc(s)+'">'+(SUBJ_ICON[s]||"")+" "+esc(s==="Personal & Social Development"?"Social & Emotional":s)+'</button>';}).join("")+'</div>';
  h+='<div class="card" style="padding:4px 14px">';
  ACTS.filter(function(a){return cur==="All"||subjOf(a)===cur;}).forEach(function(a){
    var inn=w.ids.indexOf(a.t)>=0,x=w.done[a.t]||{},locked=inn&&(x.older||x.younger);
    h+='<div class="pk"><div class="emo" style="width:38px;height:38px;font-size:24px">'+a.e+'</div><div style="flex:1"><div class="ttl" style="font-size:15px">'+esc(a.title)+'</div><div class="meta">'+esc(subjOf(a)==="Personal & Social Development"?"Social & Emotional":subjOf(a))+' · ~'+a.min+' min</div></div>';
    h+=locked?'<span class="meta">Ticked ✓</span>':'<button class="btn'+(inn?" done":" ghost")+'" data-act="padd" data-v="'+a.t+'">'+(inn?"✓ In plan":"+ Add")+'</button>';
    h+='</div>';
  });
  h+='</div><div class="btns"><button class="btn" data-act="ppick">Done picking</button></div>';
  return h;
}
function viewWeek(){
  if(S.picking)return viewPick();
  var c=curWeek(),w=c.w,n=w.ids.length,jd=0,dd=0;
  w.ids.forEach(function(id){var x=w.done[id]||{};if(x.older)jd++;if(x.younger)dd++;});
  var d=jd+dd,total=n*2;
  var h='<h1>This week’s plan</h1><p class="sub">'+weekLabel(c.ws)+' · Do each one together — each boy gets an age-sized version. Tick when done.</p>';
  if(d===total)h+='<div class="win">🎉 Week complete! Great job, Dad.</div>';
  h+='<div class="card"><div class="ttl">'+d+' of '+total+' ticked</div><div class="bar"><i style="width:'+Math.round(d/total*100)+'%"></i></div><div class="meta">Javi '+jd+'/'+n+' · Davi '+dd+'/'+n+'</div></div>';
  h+='<div class="card"><div class="row"><div style="flex:1"><div class="ttl">Activities this week</div><div class="meta">Choose how many</div></div><button class="step" data-act="wminus" aria-label="Fewer">−</button><div class="stepn">'+n+'</div><button class="step" data-act="wplus" aria-label="More">+</button></div><div class="btns"><button class="btn ghost" data-act="ppick">✏️ Pick your own</button></div></div>';
  w.ids.forEach(function(id,i){
    var a=ACTS.filter(function(x){return x.t===id;})[0];var t=BYID[id];var x=w.done[id]||{};
    h+='<div class="card"><div class="row"><div class="emo">'+a.e+'</div><div style="flex:1"><div class="ttl">'+esc(a.title)+'</div><div class="meta"><span class="pill">'+esc(t.s==="Personal & Social Development"?"Social & Emotional":t.s)+'</span>~'+a.min+' min</div></div></div>';
    h+='<div class="ticks"><button class="tick'+(x.older?" on":"")+'" data-act="wk" data-v="'+id+'|older">'+(x.older?"✓ ":"")+'Javi</button><button class="tick'+(x.younger?" on":"")+'" data-act="wk" data-v="'+id+'|younger">'+(x.younger?"✓ ":"")+'Davi</button></div>';
    h+='<details><summary>How to do it</summary><div class="for"><b>Javi (~2½)</b>'+esc(a.big)+'</div><div class="for" style="margin-top:6px"><b>Davi (~1½)</b>'+esc(a.small)+'</div><div class="say">Try saying: '+esc(a.say)+'</div><div class="meta">You’ll need: '+esc(a.sup)+'</div></details>';
    if(!x.older&&!x.younger)h+='<div class="btns"><button class="btn ghost" data-act="wswap" data-v="'+id+'">↻ Swap this one</button><button class="btn ghost" data-act="wrm" data-v="'+id+'">✕ Remove</button></div>';
    h+='</div>';
  });
  h+='<div class="btns" style="margin-bottom:6px"><button class="btn ghost" data-act="wnew">🔀 Start a fresh plan</button></div>';
  h+='<p class="note">Ticking an activity also counts it on the Progress tab. New plans favor activities you haven’t done as much yet. A new plan appears automatically each Monday.</p>';
  return h;
}
function render(){
  var v=S.tab==="sync"?viewSync():S.tab==="today"?viewToday():S.tab==="week"?viewWeek():S.tab==="acts"?viewActs():S.tab==="explore"?viewExplore():viewProgress();
  document.getElementById("app").innerHTML=topBar()+v;

  document.getElementById("nav").innerHTML=tabs.map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'"><span>'+t[1]+'</span>'+t[2]+'</button>';}).join("");
  var q=document.getElementById("q");
  if(q){q.addEventListener("input",function(){S.q=q.value;var pos=q.selectionStart;render();var n=document.getElementById("q");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}});}
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act"),v=el.getAttribute("data-v");
  if(act==="tab"){S.tab=v;S.detail=null;S.picking=false;window.scrollTo(0,0);}
  else if(act==="child"){S.child=v;}
  else if(act==="shuffle"){S.shuffle++;}
  else if(act==="done"){bump(S.child,v,(progress[S.child][v]||0)+1);save(progress);}
  else if(act==="topic"){S.tab="explore";S.detail=v;window.scrollTo(0,0);}
  else if(act==="back"){S.detail=null;}
  else if(act==="subj"){S.subj=v;}
  else if(act==="asubj"){S.aSubj=v;}
  else if(act==="found"){S.foundOnly=!S.foundOnly;}
  else if(act==="wk"){var p=v.split("|");var c=curWeek();var dn=c.w.done[p[0]]=c.w.done[p[0]]||{};dn[p[1]]=!dn[p[1]];bump(p[1],p[0],Math.max(0,(progress[p[1]][p[0]]||0)+(dn[p[1]]?1:-1)));c.w.ts=c.w.ts||{};c.w.ts[p[0]+"|"+p[1]]=Date.now();save(progress);saveW();}
  else if(act==="wswap"){var c2=curWeek();var i2=c2.w.ids.indexOf(v);var cand=ACTS.filter(function(a){return c2.w.ids.indexOf(a.t)<0;}).sort(function(a,b){return cnt(a.t)-cnt(b.t)+(Math.random()-0.5)*1.5;});if(i2>=0&&cand.length){c2.w.ids[i2]=cand[0].t;delete c2.w.done[v];saveW();}}
  else if(act==="wnew"){var c3=curWeek();var any=Object.keys(c3.w.done).some(function(k){return c3.w.done[k].older||c3.w.done[k].younger;});if(!any||confirm("Start a fresh plan? This week’s ticks will be cleared (Progress counts stay).")){c3.w.n=(c3.w.n||0)+1;c3.w.ids=genWeek(c3.k,c3.w.n,c3.w.ids.length);c3.w.done={};saveW();}}
  else if(act==="wplus"){var c4=curWeek();if(c4.w.ids.length<12){var cd=ACTS.filter(function(a){return c4.w.ids.indexOf(a.t)<0;}).sort(function(a,b){return cnt(a.t)-cnt(b.t)+(Math.random()-0.5)*1.5;});if(cd.length){c4.w.ids.push(cd[0].t);saveW();}}}
  else if(act==="wminus"){var c5=curWeek();if(c5.w.ids.length>1){for(var qi=c5.w.ids.length-1;qi>=0;qi--){var idq=c5.w.ids[qi];var dq=c5.w.done[idq]||{};if(!dq.older&&!dq.younger){c5.w.ids.splice(qi,1);break;}}saveW();}}
  else if(act==="wrm"){var c6=curWeek();var dr=c6.w.done[v]||{};if(c6.w.ids.length>1&&!dr.older&&!dr.younger){c6.w.ids.splice(c6.w.ids.indexOf(v),1);saveW();}}
  else if(act==="ppick"){S.picking=!S.picking;window.scrollTo(0,0);}
  else if(act==="psubj"){S.pSubj=v;}
  else if(act==="padd"){var c7=curWeek();var ix=c7.w.ids.indexOf(v);var dp=c7.w.done[v]||{};if(ix>=0){if(c7.w.ids.length>1&&!dp.older&&!dp.younger)c7.w.ids.splice(ix,1);}else if(c7.w.ids.length<12){c7.w.ids.push(v);}saveW();}
  else if(act==="reset"){if(confirm("Reset progress for this child?")){Object.keys(progress[S.child]).forEach(function(id){bump(S.child,id,0);});save(progress);}}
  else if(act==="send"){doShare("send");}
  else if(act==="merge"){doMerge();}
  else if(act==="liveon"){doLiveOn();}
  else if(act==="liveoff"){PCFG=null;try{localStorage.removeItem("ll_pantry");}catch(e){}LIVE.status="off";}
  else if(act==="sharelive"){doShare("live");}
  else if(act==="syncnow"){liveSync();}
  afterAct(act);
  var y=window.scrollY;render();if(act==="done"||act==="child"||act==="subj"||act==="asubj"||act==="found"||act==="shuffle"||act==="wk"||act==="wswap"||act==="wnew"||act==="wplus"||act==="wminus"||act==="padd"||act==="wrm"||act==="psubj")window.scrollTo(0,y);
});
/* ---------- syncing two phones (no accounts) ---------- */
var TT=null,CODE="";
function toast(m){S.toast=m;render();clearTimeout(TT);TT=setTimeout(function(){S.toast="";render();},4500);}
var ACT_IDS={};ACTS.forEach(function(a){ACT_IDS[a.t]=1;});
function wkNum(k){var p=k.split("-");return (+p[0])*10000+(+p[1])*100+(+p[2]);}
function exportState(){
  var ks=Object.keys(WEEKS).sort(function(a,b){return wkNum(a)-wkNum(b);}).slice(-8);
  var w={};ks.forEach(function(k){w[k]=WEEKS[k];});
  return {v:1,progress:progress,weeks:w};
}
function sanitize(s){
  var out={progress:{older:{},younger:{},ts:{}},weeks:{}};
  if(!s||typeof s!=="object")return out;
  var p=s.progress||{};
  ["older","younger"].forEach(function(c){var o=p[c]||{};Object.keys(o).forEach(function(id){if(ACT_IDS[id]){var n=Number(o[id]);if(isFinite(n)&&n>=0&&n<10000)out.progress[c][id]=Math.floor(n);}});});
  Object.keys(p.ts||{}).forEach(function(k){var pr=k.split("|");if(pr.length===2&&ACT_IDS[pr[1]]&&(pr[0]==="older"||pr[0]==="younger")){var t=Number(p.ts[k]);if(isFinite(t))out.progress.ts[k]=t;}});
  var w=s.weeks||{};
  Object.keys(w).forEach(function(k){
    if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(k))return;
    var x=w[k]||{};var o={ids:[],n:0,pt:Number(x.pt)||0,done:{},ts:{}};
    (Array.isArray(x.ids)?x.ids:[]).forEach(function(id){if(ACT_IDS[id]&&o.ids.indexOf(id)<0&&o.ids.length<12)o.ids.push(id);});
    o.n=Math.max(0,Math.min(1000,Number(x.n)||0));
    Object.keys(x.done||{}).forEach(function(id){if(!ACT_IDS[id])return;["older","younger"].forEach(function(c){if(((x.done||{})[id]||{})[c]){(o.done[id]=o.done[id]||{})[c]=true;}});});
    Object.keys(x.ts||{}).forEach(function(kk){var pr=kk.split("|");if(pr.length===2&&ACT_IDS[pr[0]]&&(pr[1]==="older"||pr[1]==="younger")){var t=Number(x.ts[kk]);if(isFinite(t))o.ts[kk]=t;}});
    if(o.ids.length)out.weeks[k]=o;
  });
  return out;
}
function mergeProgress(a,b){
  a=a||{};b=b||{};var out={older:{},younger:{},ts:{}};
  ["older","younger"].forEach(function(c){
    var ids={};[a,b].forEach(function(x){Object.keys(x[c]||{}).forEach(function(id){ids[id]=1;});});
    Object.keys(ids).forEach(function(id){
      var k=c+"|"+id,ta=(a.ts||{})[k]||0,tb=(b.ts||{})[k]||0,va=(a[c]||{})[id]||0,vb=(b[c]||{})[id]||0,v,t;
      if(ta===tb){v=Math.max(va,vb);t=ta;}else if(ta>tb){v=va;t=ta;}else{v=vb;t=tb;}
      out[c][id]=v;if(t)out.ts[k]=t;
    });
  });
  return out;
}
function mergeWeek(a,b){
  if(!a)return b;if(!b)return a;
  var pa=a.pt||0,pb=b.pt||0,base=pb>pa?b:a;
  var out={ids:(base.ids||[]).slice(),n:base.n||0,pt:Math.max(pa,pb),done:{},ts:{}};
  var keys={};
  [a,b].forEach(function(x){Object.keys(x.ts||{}).forEach(function(k){keys[k]=1;});Object.keys(x.done||{}).forEach(function(id){Object.keys(x.done[id]||{}).forEach(function(w){keys[id+"|"+w]=1;});});});
  Object.keys(keys).forEach(function(k){
    var p=k.split("|"),id=p[0],w=p[1],ta=(a.ts||{})[k]||0,tb=(b.ts||{})[k]||0;
    var va=!!((a.done||{})[id]||{})[w],vb=!!((b.done||{})[id]||{})[w];
    var v=ta===tb?(va||vb):(ta>tb?va:vb);
    if(v){(out.done[id]=out.done[id]||{})[w]=true;}
    var t=Math.max(ta,tb);if(t)out.ts[k]=t;
  });
  return out;
}
function mergeState(a,b){
  var out={progress:mergeProgress(a.progress,b.progress),weeks:{}},ks={};
  Object.keys(a.weeks||{}).forEach(function(k){ks[k]=1;});Object.keys(b.weeks||{}).forEach(function(k){ks[k]=1;});
  Object.keys(ks).forEach(function(k){out.weeks[k]=mergeWeek((a.weeks||{})[k],(b.weeks||{})[k]);});
  return out;
}
function adopt(m){
  var before=JSON.stringify([progress,WEEKS]);
  var prevW=WEEKS;
  progress=m.progress;if(!progress.ts)progress.ts={};
  WEEKS=Object.assign({},prevW,m.weeks);
  var changed=before!==JSON.stringify([progress,WEEKS]);
  if(changed){save(progress);saveW();refreshCode();var a=document.activeElement;if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")))render();}
  return changed;
}
function afterAct(act){
  var plan=["wswap","wnew","wplus","wminus","wrm","padd"];
  if(plan.indexOf(act)>=0){var k=ymd(weekStart(new Date()));if(WEEKS[k])WEEKS[k].pt=Date.now();}
  if(plan.concat(["done","wk","reset"]).indexOf(act)>=0){save(progress);saveW();refreshCode();scheduleSync();}
}
/* encode / decode */
function b64u(bytes){var s="";for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function unb64u(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";var s=atob(str),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function encodeState(){
  var bytes=new TextEncoder().encode(JSON.stringify(exportState()));
  try{if(typeof CompressionStream!=="undefined"){var cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));return "z"+b64u(new Uint8Array(await new Response(cs).arrayBuffer()));}}catch(e){}
  return "p"+b64u(bytes);
}
async function decodeState(code){
  code=String(code).trim();var m=code.match(/#sync=([^&\s]+)/);if(m)code=m[1];
  var kind=code.charAt(0),bytes=unb64u(code.slice(1));
  if(kind==="z"){var ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));bytes=new Uint8Array(await new Response(ds).arrayBuffer());}
  else if(kind!=="p")throw new Error("bad");
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function refreshCode(){try{CODE=await encodeState();}catch(e){}}
/* sharing links */
function shareBase(){return location.href.split("#")[0];}
function doShare(kind){
  if(kind==="send"&&!CODE){toast("Getting your update ready — tap again.");refreshCode();return;}
  var url=kind==="live"?shareBase()+"#pantry="+encodeURIComponent(PCFG.id):shareBase()+"#sync="+CODE;
  var text=kind==="live"?"Tap to connect Little Learners to our shared plan 🧩":"Our latest Little Learners plan 🧩 Tap to merge it.";
  S.code=url;
  if(navigator.share){try{navigator.share({title:"Little Learners",text:text,url:url}).catch(function(){});return;}catch(e){}}
  S.showCode=true;
  try{navigator.clipboard.writeText(url).then(function(){toast("Link copied — paste it into a message.");});}catch(e){}
}
async function doMerge(){
  var el=document.getElementById("paste"),txt=el?el.value:"";
  if(!txt.trim()){toast("Paste the link or code first.");return;}
  try{var st=await decodeState(txt);var ch=adopt(mergeState(exportState(),sanitize(st)));toast(ch?"Merged ✓ Your plan is up to date.":"Already up to date ✓");}
  catch(e){toast("That didn’t look like a Little Learners code.");}
}
/* optional live sync through Pantry (free, no account for the viewer) */
function loadPantry(){try{var v=localStorage.getItem("ll_pantry");if(v)return JSON.parse(v);}catch(e){}return null;}
function savePantry(c){try{localStorage.setItem("ll_pantry",JSON.stringify(c));}catch(e){}}
var PCFG=loadPantry(),LIVE={status:PCFG?"idle":"off",last:0,err:""},syncing=false,dirty=false,stimer=null;
function pUrl(){return "https://getpantry.cloud/apiv1/pantry/"+encodeURIComponent(PCFG.id)+"/basket/"+encodeURIComponent(PCFG.basket||"littlelearners");}
async function liveSync(){
  if(!PCFG)return;
  if(syncing){dirty=true;return;}
  syncing=true;LIVE.status="syncing";paintChip();
  try{
    var remote=null,r=await fetch(pUrl(),{headers:{"Accept":"application/json"}});
    if(r.ok){remote=await r.json();}else if(r.status!==400&&r.status!==404){throw new Error("HTTP "+r.status);}
    var cur=exportState();
    adopt(remote&&remote.progress?mergeState(cur,sanitize(remote)):cur);
    var w=await fetch(pUrl(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(exportState())});
    if(!w.ok)throw new Error("HTTP "+w.status);
    LIVE.status="ok";LIVE.last=Date.now();LIVE.err="";
  }catch(e){LIVE.status="error";LIVE.err=String((e&&e.message)||e);}
  syncing=false;
  if(dirty){dirty=false;scheduleSync(800);}
  paintChip();
}
function scheduleSync(ms){if(!PCFG)return;clearTimeout(stimer);stimer=setTimeout(liveSync,ms==null?1500:ms);}
document.addEventListener("visibilitychange",function(){if(!document.hidden)scheduleSync(200);});
setInterval(function(){if(PCFG&&!document.hidden)liveSync();},45000);
function doLiveOn(){
  var el=document.getElementById("pid"),v=(el?el.value:"").trim(),m=v.match(/#pantry=([^&\s]+)/);
  if(m)v=decodeURIComponent(m[1]);
  if(!/^[A-Za-z0-9-]{8,64}$/.test(v)){toast("That doesn’t look like a Pantry ID.");return;}
  PCFG={id:v,basket:"littlelearners"};savePantry(PCFG);LIVE.status="idle";liveSync();
}
/* UI */
function agoText(t){var s=Math.round((Date.now()-t)/1000);if(s<60)return "just now";var m=Math.round(s/60);if(m<60)return m+" min ago";return Math.round(m/60)+" h ago";}
function chipText(){
  if(PCFG){if(LIVE.status==="syncing")return "🔄 Syncing…";if(LIVE.status==="error")return "⚠️ Can’t reach sync — tap for details";return LIVE.last?"☁️ Live sync · "+agoText(LIVE.last):"☁️ Live sync on";}
  return "📱 This phone only · tap to sync";
}
function liveLine(){

}
function topBar(){return (S.toast?'<div class="toast">'+esc(S.toast)+'</div>':'')+'<button class="chipbtn" id="chip" data-act="tab" data-v="sync">'+esc(chipText())+'</button>';}
function paintChip(){var el=document.getElementById("chip");if(el)el.textContent=chipText();var l=document.getElementById("lstat");if(l)l.textContent=liveLine();}
function viewSync(){
  var h='<button class="back" data-act="tab" data-v="today">← Back</button><h1>Sync two phones</h1><p class="sub">No accounts needed for the second phone. Pick the way that suits you.</p>';

  if(S.showCode&&S.code)h+='<textarea readonly onclick="this.select()">'+esc(S.code)+'</textarea>';
  h+='</div>';
  h+='<div class="card"><div class="ttl">Got an update?</div><p class="meta" style="font-size:13px;margin:4px 0 0">Tapping a link merges it automatically. Or paste a link or code here.</p><textarea id="paste" placeholder="Paste link or code"></textarea><div class="btns"><button class="btn ghost" data-act="merge">Merge it</button></div></div>';
  h+='<div class="card"><div class="ttl">2 · Live sync (optional, one-time setup)</div>';
  if(PCFG){
    h+='<p class="meta" id="lstat" style="font-size:13px;margin:4px 0 0">'+esc(liveLine())+'</p><div class="btns"><button class="btn" data-act="sharelive">📤 Send setup link to your wife</button><button class="btn ghost" data-act="syncnow">Sync now</button><button class="btn ghost" data-act="liveoff">Turn off</button></div>';
  }else{
    h+='<ol style="padding-left:20px;font-size:13px;color:var(--mute);margin:6px 0"><li>On getpantry.cloud, make a free Pantry (a name and email). Copy its Pantry ID.</li><li>Paste it below and tap Connect.</li><li>Tap “Send setup link” and message it to your wife. One tap on her phone connects it.</li></ol><input type="text" id="pid" placeholder="Pantry ID" autocapitalize="off" autocomplete="off" spellcheck="false"><div class="btns"><button class="btn" data-act="liveon">Connect</button></div>';
  }
  h+='<p class="note" style="margin-bottom:0">Live sync stores your plan and ticks (nothing else) at Pantry, a free third-party service. Anyone with the ID could read it, so keep the setup link private. Pantry may delete data after a long period of no use.</p></div>';
  h+='<div class="card"><div class="ttl">Keep it on the home screen</div><p class="meta" style="font-size:13px;margin:4px 0 0">On iPhone, open the page in Safari, tap Share, then “Add to Home Screen.” Safari erases saved data from sites you haven’t opened in about a week, but not from Home Screen apps.</p></div>';
  return h;
}
function parseHash(){
  var h=location.hash||"";if(!h)return;
  var m1=h.match(/#pantry=([^&]+)/),m2=h.match(/#sync=([^&]+)/);
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  if(m1){var id=decodeURIComponent(m1[1]);if(/^[A-Za-z0-9-]{8,64}$/.test(id)){PCFG={id:id,basket:"littlelearners"};savePantry(PCFG);LIVE.status="idle";S.toast="Live sync connected ✓";}}
  if(m2){decodeState(m2[1]).then(function(st){var ch=adopt(mergeState(exportState(),sanitize(st)));toast(ch?"Merged the update ✓":"Already up to date ✓");}).catch(function(){toast("That update link was damaged.");});}
}
parseHash();
render();
refreshCode();
if(PCFG)scheduleSync(300);
