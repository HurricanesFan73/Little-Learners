bjects or drawings to demonstrate how an addition or subtraction was solved","Respond to 'how do you know?' by pointing to objects or a drawing and describing what was done","Listen to a peer's explanation and say whether they agree or disagree"],"pre":[["mt_7XcCG43ZZW","Explaining part-part-whole decompositions exercises showing and telling","s"],["mt_e8CZ7E5qW7","Explaining how to find number bonds to 10 exercises showing thinking with objects","s"],["mt_mB7DVai-Uf","Explaining mathematical reasoning orally requires basic listening and responding skills","s"]]},{"id":"mt_uG2mjHFOlO","s":"Mathematics","d":"Mathematical Thinking","n":"Spotting mathematical patterns","desc":"Notice simple patterns and structures: spot that changing order doesn't change the total, and recognise how numbers relate to each other","a":[5,6],"ev":["Notice that 3 + 2 gives the same answer as 2 + 3 (early commutativity)","Recognise that teen numbers are 'ten and some more' (e.g. 14 is 10 and 4)","Spot a pattern in a sequence of objects or numbers and predict what comes next"],"pre":[["mt_OvyoRo47K-","Noticing commutativity of addition exercises spotting structural patterns","s"],["mt_xmmgAzxe5j","Recognising teen numbers as 'ten and some more' exercises noticing structure","s"]]},{"id":"mt_fLOkq-HfPB","s":"Mathematics","d":"Mathematical Thinking","n":"Using objects to model real problems","desc":"Use objects, drawings, or simple number sentences to represent a real-world situation (early mathematical modelling)","a":[5,6],"ev":["Draw a picture or use objects to represent a simple real-world situation involving counting or comparing","Write or dictate a number sentence to describe a real-world situation (e.g. 'I had 5 apples and ate 2')","Use the model to answer a question about the situation"],"pre":[["mt_xppl18avyY","Classifying and counting objects into categories is an early modelling activity","s"],["mt_yJmvUCCym7","Solving word problems with drawings exercises early modelling","s"]]},{"id":"mt_zkFbMLpu3U","s":"Mathematics","d":"Measurement","n":"Comparing Capacity","desc":"Compare and describe capacity and volume using language such as full, empty, more than, less than, half full","a":[4,6],"ev":["Compare two containers and say which holds more/less","Use 'half full' and 'quarter full' to describe a container","Solve practical problems like 'Which cup has more water?'"],"pre":[["mt_NtJYlJdUe9","Comparing capacity requires understanding capacity as a measurable attribute","h"]]},{"id":"mt_TcG90kS8nu","s":"Mathematics","d":"Measurement","n":"Comparing durations","desc":"Use comparative language for time: quicker, slower, earlier, later","a":[4,6],"ev":["Compare two events and say which was quicker/slower","Use 'earlier' and 'later' correctly to describe daily events","Solve practical problems like 'Who finished first?'"],"pre":[]},{"id":"mt_uhuxX8sg9f","s":"Mathematics","d":"Measurement","n":"Comparing Lengths & Heights","desc":"Compare two objects directly by length or height and describe the difference using language such as long, short, tall, longer, shorter, taller, double, half","a":[4,6],"ev":["Stand two children back-to-back and say who is taller/shorter","Directly compare the heights of two towers and describe one as taller","Use 'longer' and 'shorter' to compare two ribbons placed side by side"],"pre":[["mt_NtJYlJdUe9","Comparing lengths/heights requires first identifying length as a measurable attribute","h"]]},{"id":"mt_NtJYlJdUe9","s":"Mathematics","d":"Measurement","n":"Measurable Attributes of Objects","desc":"Describe and identify measurable attributes of objects such as length, height, weight, and capacity; use comparative language (longer, shorter, heavier, lighter, more, less)","a":[4,6],"ev":["Identify that a pencil has length and can be measured","Describe multiple attributes of one object (e.g. a bottle has height, weight, and capacity)","Use words like 'long', 'heavy', 'full' to describe objects"],"pre":[]},{"id":"mt_-P1kdZhHbL","s":"Mathematics","d":"Measurement","n":"Measuring mass and weight (age 4+)","desc":"Compare two objects directly by mass or weight and describe the difference using language such as heavy, light, heavier than, lighter than","a":[4,6],"ev":["Heft two objects and say which is heavier/lighter","Use a simple balance to compare the weight of two objects","Describe one object as 'heavier than' another"],"pre":[["mt_NtJYlJdUe9","Comparing mass/weight requires first identifying mass as a measurable attribute","h"]]},{"id":"mt_-vvVxpOHG2","s":"Mathematics","d":"Measurement","n":"Ordering Events in Time","desc":"Sequence events in chronological order using language such as before, after, next, first, today, yesterday, tomorrow, morning, afternoon, evening","a":[4,6],"ev":["Order three daily events using 'first', 'next', 'last'","Use 'yesterday', 'today', 'tomorrow' correctly","Describe an event as happening in the 'morning' or 'afternoon'"],"pre":[]},{"id":"mt_4lp_b5Pzik","s":"Mathematics","d":"Measurement","n":"Capacity and volume","desc":"Measure and begin to record capacity and volume using non-standard and standard units","a":[5,6],"ev":["Measure capacity by counting how many cups fill a container","Begin to use litres as a unit of capacity","Record capacity measurements with a number and unit"],"pre":[["mt_zkFbMLpu3U","Measuring capacity with units requires first being able to compare capacities","h"]]},{"id":"mt_cPZwlUk8Nd","s":"Mathematics","d":"Measurement","n":"Coin Values","desc":"Recognise and know the value of different coins and notes","a":[5,6],"ev":["Identify 1p, 2p, 5p, 10p, 20p, 50p, £1 and £2 coins","Know that a £2 coin is worth more than a 50p coin","Recognise £5 and £10 notes"],"pre":[["mt_fR0UtsSREU","Recognising coin values requires reading numerals (1, 2, 5, 10, 20, 50)","h"]]},{"id":"mt_bj1YCgNWUx","s":"Mathematics","d":"Measurement","n":"Days, Weeks, Months & Years","desc":"Recognise and use language relating to dates, including days of the week, weeks, months, and years","a":[5,6],"ev":["Name the seven days of the week in order","Name the twelve months of the year in order","Understand that a year is made up of months and weeks"],"pre":[["mt_-vvVxpOHG2","Understanding days/months/years builds on sequencing events chronologically","h"]]},{"id":"mt_KaF0SQvaiu","s":"Mathematics","d":"Measurement","n":"Measuring length and height (age 5+)","desc":"Measure and begin to record lengths and heights using non-standard and standard units","a":[5,6],"ev":["Measure the length of a table using cubes and record the result","Begin to use a ruler to measure in centimetres","Record a measurement as a number with a unit"],"pre":[["mt_uhuxX8sg9f","Measuring length with units requires first being able to compare lengths directly","h"]]},{"id":"mt_zd0YkB3xNj","s":"Mathematics","d":"Measurement","n":"Measuring mass and weight","desc":"Measure and begin to record mass/weight using non-standard and standard units","a":[5,6],"ev":["Use a balance to compare masses of two objects","Measure mass using non-standard units (e.g. 'this book weighs 5 cubes')","Begin to read a simple scale for mass"],"pre":[["mt_-P1kdZhHbL","Measuring mass with units requires first being able to compare masses directly","h"]]},{"id":"mt_0XxyaQLRhn","s":"Mathematics","d":"Measurement","n":"Telling Time: Hours and Half Hours","desc":"Tell the time to the hour and half past the hour, and draw clock hands to show these times","a":[5,6],"ev":["Read an analogue clock showing 3 o'clock","Read an analogue clock showing half past 7","Draw the hour and minute hands on a blank clock face to show a given o'clock or half-past time"],"pre":[["mt_fR0UtsSREU","Reading a clock requires recognising numerals 1–12","h"],["mt_-hTTat0mBR","Understanding 'half past' benefits from the concept of halves","s"],["mt__N55B7u7HD","Telling time on a clock requires understanding hours and minutes as time units","h"]]},{"id":"mt__N55B7u7HD","s":"Mathematics","d":"Measurement","n":"Telling time to the minute","desc":"Measure and begin to record time in hours, minutes, and seconds","a":[5,6],"ev":["Use a sand timer or stopwatch to time an activity","Begin to understand that 1 minute = 60 seconds","Record a duration in simple terms (e.g. 'it took about 2 minutes')"],"pre":[["mt_TcG90kS8nu","Measuring time in units requires understanding time comparison language first","h"]]},{"id":"mt_LpSuPgL31x","s":"Mathematics","d":"Multiplication & Division","n":"Division as equal sharing","desc":"Understand division as sharing equally into groups or as grouping (how many groups of a given size can be made)","a":[4,6],"ev":["Share 10 counters equally between 2 plates","Group 12 objects into sets of 3 and count 4 groups","Use concrete objects to solve 'How many groups of 2 in 8?'"],"pre":[["mt_zuKAX6lcYR","Division as equal sharing/grouping requires understanding subtraction as taking away/separating","h"]]},{"id":"mt_GRWwTDZ3wD","s":"Mathematics","d":"Multiplication & Division","n":"Arrays for multiplication","desc":"Use arrays to represent multiplication and division situations","a":[5,6],"ev":["Build an array of 3 rows of 4 objects to show 3 × 4","Read an array and state the total","Use an array to solve a simple division problem (e.g. 12 objects in rows of 4 → 3 rows)"],"pre":[["mt_LpSuPgL31x","Using arrays for division requires understanding division as grouping","h"],["mt_PZ909yPrEC","Using arrays requires understanding what multiplication means","h"]]},{"id":"mt_PZ909yPrEC","s":"Mathematics","d":"Multiplication & Division","n":"Multiplication as repeated addition","desc":"Understand multiplication as repeated addition and grouping equal sets","a":[5,6],"ev":["Explain that 3 groups of 2 is the same as 2 + 2 + 2","Use objects to make equal groups and count the total","Recognise an array as showing equal rows"],"pre":[["mt_nvdpxAJTBG","Skip counting supports understanding equal groups (2s, 5s, 10s)","s"],["mt_OvyoRo47K-","Multiplication as repeated addition requires understanding addition as combining groups","h"]]},{"id":"mt_9IzhGUZ30z","s":"Mathematics","d":"Number Representation & Place Value","n":"Number Words to Twenty","desc":"Read and write number words from one to twenty","a":[5,6],"ev":["Read the word 'twelve' and identify it as 12","Write the word form of a given number 1–20","Match numeral cards to number word cards"],"pre":[["mt_fR0UtsSREU","Reading/writing number words requires already knowing the numeral forms","h"],["mt__KHQttMde3","Reading number words (one, two, three...) requires phonics blending skills","h"],["mt_YKkCM63fSC","Many number words are irregular and must be recognised as sight words","s"]]},{"id":"mt_x8TshvbbQT","s":"Mathematics","d":"Number Representation & Place Value","n":"Reading and writing numbers to 100","desc":"Read and write numerals from 0 to 100","a":[5,6],"ev":["Read two-digit numerals up to 100 correctly","Write any number 0–100 as a numeral from dictation"],"pre":[["mt_fR0UtsSREU","Reading/writing numerals to 100 extends from reading/writing numerals to 20","h"],["mt_M5PPDJStGm","Reading/writing numerals to 100 requires fluent rote counting to 100","h"]]},{"id":"mt_fR0UtsSREU","s":"Mathematics","d":"Number Representation & Place Value","n":"Reading and writing numbers to 20","desc":"Read and write numerals from 0 to 20","a":[5,6],"ev":["Read any numeral 0–20 when shown it","Write numerals 0–20 legibly from dictation","Represent a number of objects with the correct written numeral"],"pre":[["mt_dmNvjroCPT","Reading/writing numerals 0–20 requires understanding that numerals represent quantities (cardinality)","h"],["mt_oAK9GXSfqV","Writing numerals requires the motor skill of forming digits 0-9 (taught in English handwriting)","h"]]},{"id":"mt_xmmgAzxe5j","s":"Mathematics","d":"Number Representation & Place Value","n":"The teen numbers","desc":"Understand that the teen numbers (11–19) are composed of ten ones and some further ones (early place value)","a":[5,7],"ev":["Compose 14 as a group of ten and four ones using objects","Decompose 17 into 10 + 7 and record as an equation","Explain that 13 is 'one ten and three ones'"],"pre":[["mt_dmNvjroCPT","Understanding tens-and-ones composition requires cardinality — knowing numbers represent quantities","h"],["mt_fR0UtsSREU","Composing/decomposing teen numbers requires reading and writing those numerals","h"]]},{"id":"mt_kvrvpQris4","s":"Personal & Social Development","d":"Emotional Literacy","n":"Expressing Feelings with Words","desc":"Express their own feelings appropriately using words rather than actions — saying 'I feel angry because...' instead of hitting, shouting, or withdrawing","a":[5,7],"ev":["Use an 'I feel ___ when ___' statement during a disagreement","Choose to tell an adult how they feel instead of acting out physically","Describe their feelings about a difficult situation using at least two emotion words"],"pre":[["mt_9Y5-GjF2B0","Expressing feelings in words benefits from understanding triggers","s"],["mt_Iwg2diBSyW","Expressing feelings in words benefits from calming down first","s"]]},{"id":"mt_ggcamLzXAy","s":"Personal & Social Development","d":"Emotional Literacy","n":"Feelings Change and Differ","desc":"Understand that everyone has feelings, that feelings change throughout the day, and that the same event can make different people feel different things","a":[5,7],"ev":["Give an example of a time their feelings changed during a single day","Explain why two children might feel differently about the same event","Recognise that feelings are temporary and can change"],"pre":[["mt_LhkP_KKIRS","Understanding feelings change benefits from naming basic emotions","s"]]},{"id":"mt_LhkP_KKIRS","s":"Personal & Social Development","d":"Emotional Literacy","n":"Naming Basic Emotions","desc":"Name and recognise basic emotions — happy, sad, angry, scared, excited, and surprised — in themselves and in others by looking at facial expressions and body language","a":[5,7],"ev":["Label at least five basic emotions from pictures or real situations","Match facial expressions to emotion words in a sorting activity","Say 'I feel ___' using a correct emotion word when asked about their own day"],"pre":[]},{"id":"mt_9Y5-GjF2B0","s":"Personal & Social Development","d":"Emotional Literacy","n":"Triggers and Causes of Feelings","desc":"Understand that feelings have causes — something happens (a trigger) and that makes us feel a certain way — and begin to identify what triggers their own emotions","a":[5,7],"ev":["Describe a trigger for at least three different emotions from their own experience","Complete 'I felt ___ because ___' sentences accurately","Identify what made a character in a story feel a particular way"],"pre":[["mt_ggcamLzXAy","Identifying triggers benefits from knowing feelings change","s"]]},{"id":"mt_lAvS72LOUO","s":"Personal & Social Development","d":"Empathy & Social Awareness","n":"Everyday Kindness and Care","desc":"Show kindness and care towards others in simple everyday ways — comforting a friend who is upset, helping someone who has dropped their things, sharing without being asked, and saying kind words","a":[5,7],"ev":["Spontaneously offer comfort to someone who is visibly upset","Help another person with a practical task without being asked","Use kind words to encourage or cheer up someone who is struggling"],"pre":[["mt_LhkP_KKIRS","Showing kindness benefits from recognising emotions in others","s"],["mt_wRlf0g2MbB","Showing kindness meaningfully requires vocabulary for empathy, care, and community","h"],["mt_wzUzVEBqJb","Showing kindness benefits from knowing others have feelings","s"]]},{"id":"mt_wzUzVEBqJb","s":"Personal & Social Development","d":"Empathy & Social Awareness","n":"Other People's Feelings and Thoughts","desc":"Understand that other people have their own feelings and thoughts, and that these might be different from your own — a foundational awareness that not everyone sees or feels things the same way","a":[5,7],"ev":["State that other people can feel differently about the same thing","Give an example of a time someone felt differently from them about the same situation","Accept another child's feeling as valid even when it differs from their own"],"pre":[["mt_wRlf0g2MbB","Understanding that others have perspectives and feelings requires the vocabulary of empathy and perspective","h"]]},{"id":"mt_OJVkWvIaM_","s":"Personal & Social Development","d":"Empathy & Social Awareness","n":"Similarities & Differences","desc":"Notice and appreciate ways that people are similar to and different from each other — including appearance, family structures, languages spoken, foods eaten, and celebrations observed — and understand that differences make communities interesting","a":[5,7],"ev":["Name several ways people in their class or community are different from each other","Describe at least one thing they have learned from someone who is different from them","Express a positive attitude about differences rather than judging them"],"pre":[["mt_wRlf0g2MbB","Noticing similarities and differences among people draws on vocabulary of community, fair, and care","s"]]},{"id":"mt_wRlf0g2MbB","s":"Personal & Social Development","d":"Empathy & Social Awareness","n":"Vocabulary: understanding others","desc":"Know and use the key vocabulary for understanding others — empathy, perspective, kind, fair, community, similar, different, and care — and understand that these words describe real habits of thinking and feeling","a":[5,8],"ev":["Use the word 'empathy' correctly and distinguish it from 'sympathy' — e.g. 'Empathy means I try to feel what they feel'","Explain what 'perspective' and 'point of view' mean and demonstrate by describing how two people might see the same event differently","Use words like 'community', 'belonging', and 'inclusion' accurately when talking about their school or neighbourhood"],"pre":[]},{"id":"mt_PdYlsA33jB","s":"Personal & Social Development","d":"Friendship & Cooperation","n":"Asking for Help","desc":"Ask for help when they need it — from a friend, teacher, or family member — and understand that asking for help is a sign of strength, not weakness","a":[5,7],"ev":["Approach an appropriate person and ask for help clearly","Identify who to go to for different kinds of help (academic, emotional, practical)","Explain why asking for help is sensible rather than something to be embarrassed about"],"pre":[["mt_f8n4txtLej","Asking for help benefits from curriculum questioning skills","s"],["mt_NS5t-Jzlh8","Asking for help and working with others uses the vocabulary of team and cooperation","s"],["mt_YbX3LD0Eca","Asking for help benefits from knowing how to communicate with others","s"]]},{"id":"mt_YbX3LD0Eca","s":"Personal & Social Development","d":"Friendship & Cooperation","n":"Listening to Others","desc":"Listen to others when they are speaking — looking at the speaker, waiting until they finish, and showing they have heard by responding to what was said rather than just talking about their own ideas","a":[5,7],"ev":["Face the speaker and maintain attention while someone else is talking","Wait until the other person has finished before responding","Respond to what was actually said rather than changing the subject to their own idea"],"pre":[["mt_mB7DVai-Uf","SEL listening skills build on curriculum speaking & listening foundations","s"],["mt_NS5t-Jzlh8","Active listening practice requires understanding the vocabulary of listening, agreeing, and disagreeing respectfully","h"]]},{"id":"mt_HBcvu0UxYe","s":"Personal & Social Development","d":"Friendship & Cooperation","n":"Makes someone a good friend","desc":"Understand what makes someone a good friend — being kind, honest, reliable, and including others — and recognise behaviours that are not friendly, such as being bossy, leaving people out, or saying mean things","a":[5,7],"ev":["List at least four qualities of a good friend","Identify unfriendly behaviour in a story or real situation","Reflect on a time they were a good friend and explain what they did"],"pre":[["mt_NS5t-Jzlh8","Understanding what makes a good friend draws on cooperation and inclusion vocabulary","s"]]},{"id":"mt_FwI7q7DSIx","s":"Personal & Social Development","d":"Friendship & Cooperation","n":"Taking Turns and Sharing","desc":"Take turns, share materials, and play cooperatively with others — understanding that group activities work better when everyone gets a fair go and that waiting for your turn is part of being a good friend","a":[5,7],"ev":["Take turns in a game or group activity without needing adult reminders","Share materials willingly during a shared task or playtime","Explain why taking turns makes games and group work more fun for everyone"],"pre":[["mt_NS5t-Jzlh8","Taking turns and sharing cooperatively requires vocabulary like 'cooperate', 'take turns', and 'include'","h"]]},{"id":"mt_NS5t-Jzlh8","s":"Personal & Social Development","d":"Friendship & Cooperation","n":"Vocabulary: working with others","desc":"Know and use the vocabulary of working with others — cooperate, share, take turns, team, listen, agree, disagree respectfully, and include — and understand that these words describe habits that friendships and group work depend on","a":[5,8],"ev":["Use 'cooperate' and 'compromise' correctly — e.g. 'We cooperated by taking turns choosing the game'","Explain what 'active listening' means and demonstrate it: facing the speaker, not interrupting, responding to what was said","Use 'share', 'take turns', and 'include' to describe how they work with others in a group activity"],"pre":[]},{"id":"mt_UHQfb-n-w3","s":"Personal & Social Development","d":"Responsible Decision-Making","n":"Actions and Their Consequences","desc":"Understand that actions have consequences — that what you choose to do affects both yourself and other people — and begin to think about what might happen before they act","a":[5,7],"ev":["Describe what happened as a consequence of a specific action they took","Predict what might happen if they choose a particular action before doing it","Explain that actions can have good or bad consequences for themselves and others"],"pre":[["mt_uTKgmWqSoI","Understanding that actions have consequences requires the vocabulary word 'consequence' as a named concept","h"]]},{"id":"mt_q3vRl4dddK","s":"Personal & Social Development","d":"Responsible Decision-Making","n":"Everyday Safety Awareness","desc":"Keep themselves safe in everyday situations — knowing basic safety rules about roads, strangers, water, and the internet — and understanding who their trusted adults are and when to tell them something","a":[5,7],"ev":["State at least three basic safety rules and explain why each matters","Name their trusted adults and describe when they should tell them something","Demonstrate safe behaviour in a familiar everyday situation without being reminded"],"pre":[["mt_uTKgmWqSoI","Safety awareness draws on vocabulary of 'safe', 'trusted adult', and 'choice'","s"]]},{"id":"mt_Wc6cOTQ1bA","s":"Personal & Social Development","d":"Responsible Decision-Making","n":"Right and Wrong Choices","desc":"Know the difference between right and wrong in familiar everyday situations — understanding basic rules about honesty, not hurting others, respecting others' property, and being fair — and choose to do the right thing even when it's harder","a":[5,7],"ev":["Identify the right and wrong choice in a simple moral scenario","Choose to be honest even when lying would avoid trouble","Explain why rules about not hurting others and being honest matter"],"pre":[["mt_UHQfb-n-w3","Right/wrong benefits from understanding consequences","s"],["mt_uTKgmWqSoI","Distinguishing right from wrong requires vocabulary including 'honest', 'fair', 'trust', and 'right and wrong'","h"]]},{"id":"mt_rkrG2w7WXI","s":"Personal & Social Development","d":"Responsible Decision-Making","n":"Rules and agreements exist","desc":"Understand why rules and agreements exist — that they help keep people safe, make things fair, and help groups work well together — and follow agreed rules willingly rather than only when being watched","a":[5,7],"ev":["Explain the reason behind at least two rules at home or school","Follow a rule consistently without needing to be reminded or monitored","Describe what would happen if nobody followed the rules in a specific context"],"pre":[["mt_uTKgmWqSoI","Understanding why rules exist requires vocabulary of 'rule', 'safe', and 'fair'","h"],["mt_Wc6cOTQ1bA","Understanding rules benefits from knowing right/wrong","s"]]},{"id":"mt_uTKgmWqSoI","s":"Personal & Social Development","d":"Responsible Decision-Making","n":"Vocabulary: making decisions and keeping safe","desc":"Know and use the vocabulary of making decisions and keeping safe — choice, consequence, rule, safe, fair, honest, trusted adult, and right and wrong — and understand that naming these ideas clearly helps make better choices","a":[5,8],"ev":["Explain what 'consequence' means and give an example of a positive and a negative consequence of a choice","Use 'responsible' and 'safe' correctly when talking about everyday decisions — e.g. 'The responsible choice is to tell an adult'","Define 'rule' and 'fairness' and explain why rules exist using their own examples from school or home"],"pre":[]},{"id":"mt_69hFD2NgGe","s":"Personal & Social Development","d":"Self-Awareness","n":"Naming Your Feelings","desc":"Notice what you are feeling and put a name to it — being able to label an emotion is the first step to understanding and managing it","a":[5,6],"ev":["emotional literacy research","Fostering Emotional Literacy in Young Children (HeadStart.gov)","emotion vocabulary development 4-11 years (PMC)"],"pre":[["mt_H4YZ1rSKP3","Noticing and naming feelings requires the basic vocabulary of self-awareness and reflection","h"],["mt_klyw-tdlhP","Naming what you are feeling is emotional comprehension monitoring — the universal habit of noticing what's happening inside applied to emotional experience","s"]]},{"id":"mt_H4YZ1rSKP3","s":"Personal & Social Development","d":"Self-Awareness","n":"Vocabulary: self","desc":"Know and use the vocabulary of self-reflection — self-awareness, reflect, pattern, trigger, assumption, impact, perspective, and notice — and understand that having precise words for these inner experiences makes them easier to understand and talk about","a":[5,10],"ev":["Use words like 'reflect', 'pattern', and 'trigger' accurately when describing their own behaviour — e.g. 'I notice a pattern: I get frustrated when I rush'","Explain what 'self-awareness' means in their own words and give a personal example","Use the word 'perspective' correctly — e.g. 'From my perspective it felt unfair, but I can see theirs too'"],"pre":[]},{"id":"mt_aS-Gdh-MHx","s":"Personal & Social Development","d":"Self-Regulation & Resilience","n":"Coping with Life Changes","desc":"Understand that change is a normal part of life — such as starting school, getting a new teacher, a new baby arriving, or moving house — and identify simple strategies that help them cope with changes","a":[5,7],"ev":["Name at least two changes they have experienced and how they felt","Identify a person they can talk to when a change feels hard","Describe one strategy that helps them cope with change, such as keeping a familiar routine"],"pre":[["mt_SeNxOZTHCN","Coping with change draws on vocabulary like 'cope', 'strategy', and 'settle'","s"]]},{"id":"mt_UGf6jICEhs","s":"Personal & Social Development","d":"Self-Regulation & Resilience","n":"Learning from Mistakes","desc":"Understand that making mistakes is a normal part of learning and that everyone — including adults — makes mistakes, and begin to see mistakes as opportunities to learn rather than reasons to give up","a":[5,7],"ev":["Describe a time they made a mistake and what they learned from it","Respond to a mistake by trying again rather than giving up","Explain why mistakes help people learn"],"pre":[["mt_SeNxOZTHCN","Framing mistakes as learning uses the vocabulary of feelings management and coping with setback","s"]]},{"id":"mt_nNDX_jZ-cb","s":"Personal & Social Development","d":"Self-Regulation & Resilience","n":"Patience and Delayed Gratification","desc":"Wait for things they want without becoming very distressed — practising patience and delayed gratification in everyday situations like waiting their turn, waiting for a treat, or waiting for help","a":[5,7],"ev":["Wait for their turn in a game or activity without constant complaints","Describe what they do to help themselves wait, such as thinking about something else","Explain why sometimes we have to wait and that it is a skill they can practise"],"pre":[["mt_Iwg2diBSyW","Patience benefits from calming strategies when waiting is hard","s"],["mt_SeNxOZTHCN","Patience and waiting practice requires understanding the vocabulary of coping and managing big feelings","h"]]},{"id":"mt_Iwg2diBSyW","s":"Personal & Social Development","d":"Self-Regulation & Resilience","n":"Simple Calming Strategies","desc":"Use simple calming strategies when feeling upset or overwhelmed — such as taking deep breaths, counting to ten, or going to a quiet space — and understand that these help the body and mind settle down","a":[5,7],"ev":["Demonstrate at least two calming strategies when prompted","Choose to use a calming strategy independently during a real upset","Explain in simple terms why calming down helps them think better"],"pre":[["mt_LhkP_KKIRS","Calming strategies benefit from naming the emotion you're trying to manage","s"],["mt_SeNxOZTHCN","Calming strategies (calm, breathe, settle) rely on knowing this vocabulary to name and apply the techniques","h"]]},{"id":"mt_SeNxOZTHCN","s":"Personal & Social Development","d":"Self-Regulation & Resilience","n":"Words for Big Feelings","desc":"Know and use the key words for managing big feelings — calm, strategy, cope, settle, patience, overwhelmed, and breathe — and understand that having words for these ideas is the first step to using them","a":[5,8],"ev":["Use words like 'frustrated', 'anxious', 'overwhelmed', and 'disappointed' accurately to describe how they feel in difficult moments","Explain what 'calm down' strategies are in their own words and name at least two they have tried (e.g. deep breaths, counting, walking away)","Distinguish between similar feelings — e.g. explain the difference between being angry and being disappointed"],"pre":[]},{"id":"mt_pwo81ls_J-","s":"Science","d":"Animals of the World","n":"Animal Camouflage","desc":"Know that many animals use camouflage — colours and patterns that help them blend into their surroundings — to hide from predators or to sneak up on prey, like a leaf insect that looks like a leaf or an Arctic hare that turns white in winter","a":[5,7],"ev":["Explains that camouflage means blending in with surroundings","Gives at least 3 examples of camouflaged animals","Explains that camouflage helps animals hide from predators or sneak up on food"],"pre":[["mt_v3Vz_Pgjjv","Camouflage builds on awareness that animals live in different environments","h"],["mt_V_wIdRZLsG","Camouflage and nocturnal behaviour are related survival strategies","s"]]},{"id":"mt_oLHXfLujmh","s":"Science","d":"Animals of the World","n":"Animal Homes","desc":"Know that animals make or find many different kinds of homes — birds build nests, rabbits dig burrows, bees live in hives, hermit crabs use empty shells, spiders spin webs — and that these shelters protect them and their young","a":[5,7],"ev":["Names at least 4 different types of animal homes (nest, burrow, hive, web, shell, den, lodge)","Explains that animals need homes for shelter and to keep their babies safe","Matches common animals to their homes"],"pre":[["mt_v3Vz_Pgjjv","Animal homes builds on knowing animals live everywhere","h"]]},{"id":"mt_goZW_hQUa4","s":"Science","d":"Animals of the World","n":"Animal Record-Holders","desc":"Know some of the world's animal record-holders — the blue whale is the largest animal ever, the cheetah is the fastest land animal, the bee hummingbird is the smallest bird, the giraffe is the tallest — and compare their sizes to familiar objects","a":[5,7],"ev":["Names at least 4 animal record-holders with their record (fastest, biggest, tallest, smallest, etc.)","Compares an animal's size or ability to a familiar reference","Shows enthusiasm for superlative animal facts"],"pre":[["mt_v3Vz_Pgjjv","Record-holders builds on knowing animal diversity across the world","h"]]},{"id":"mt_v3Vz_Pgjjv","s":"Science","d":"Animals of the World","n":"Animals Everywhere","desc":"Know that animals live all over the world — on land, in water, and in the air — and that every continent, even icy Antarctica, is home to animals, each suited to the conditions where they live","a":[5,7],"ev":["Names at least 3 animals from different environments (e.g., forest, ocean, desert)","States that animals live on land, in water, and some can fly","Recognises that animals live on every continent"],"pre":[]},{"id":"mt_-vsLvsxp0L","s":"Science","d":"Animals of the World","n":"How Animals Have Babies","desc":"Know that different animals have their babies in different ways — some lay eggs (birds, reptiles, fish, insects), some give birth to live young (most mammals) — and that babies may look like miniature adults or look very different from their parents","a":[5,7],"ev":["Gives examples of animals that lay eggs and animals that give birth to live young","Describes at least one example of a baby that looks different from its parent (e.g., tadpole/frog, caterpillar/butterfly)","Shows curiosity about how different animals have their babies"],"pre":[["mt_v3Vz_Pgjjv","Animal babies builds on knowing animals live in diverse environments","h"]]},{"id":"mt_V_wIdRZLsG","s":"Science","d":"Animals of the World","n":"Nocturnal Animals","desc":"Know that some animals are nocturnal — active at night and sleeping during the day — and that nocturnal animals often have special features like big eyes (owls, tarsiers), large ears (bats, fennec foxes), or sensitive whiskers to help them find food in the dark","a":[5,7],"ev":["Explains what 'nocturnal' means","Names at least 3 nocturnal animals (e.g., owl, bat, fox, hedgehog, moth)","Describes one feature that helps a nocturnal animal (e.g., big eyes, echolocation, whiskers)"],"pre":[["mt_oLHXfLujmh","Nocturnal animals often use homes (burrows, dens) as daytime shelters","s"],["mt_v3Vz_Pgjjv","Nocturnal animals builds on knowing animals exist in diverse environments","h"]]},{"id":"mt_muxjw0fxxN","s":"Science","d":"Animals of the World","n":"Wild, Farm & Pet Animals","desc":"Understand the difference between wild animals, farm animals, and pets — wild animals find their own food and shelter in nature; farm animals are kept by people for food, wool, or eggs; pets are animals people keep for companionship — and know that wild animals should be observed from a distance","a":[5,7],"ev":["Sorts animals into wild, farm, and pet categories with examples","Explains one key difference between each category","Understands that wild animals should be observed, not approached"],"pre":[["mt_v3Vz_Pgjjv","Wild/farm/pet distinction builds on knowing animals exist everywhere","h"],["mt_zVLOm6U7bh","Wild/farm/pet distinction enriched by curriculum animal group identification","s"]]},{"id":"mt_u0TeRwRII_","s":"Science","d":"Dinosaurs & Paleontology","n":"Dinosaur Sizes","desc":"Compare dinosaur sizes to familiar things — some dinosaurs were as tall as a house, others were as small as a chicken — and understand that dinosaurs came in a huge range of sizes","a":[5,7],"ev":["Compare the size of a large dinosaur to a familiar object like a bus or house","Name a very large dinosaur (e.g. Brachiosaurus) and a small one (e.g. Compsognathus)","Use words like 'taller than', 'longer than', 'heavier than' when comparing"],"pre":[["mt_BnabTHkNIp","Must know some dinosaur species before comparing their sizes","h"]]},{"id":"mt_dpM1l5IOk6","s":"Science","d":"Dinosaurs & Paleontology","n":"Dinosaurs Were Real","desc":"Understand that dinosaurs were real animals that lived on Earth a very long time ago and are now extinct — none are alive today","a":[5,7],"ev":["State that dinosaurs were real animals, not made up","Explain that 'extinct' means no living ones are left anywhere","Distinguish between 'a long time ago' and recent events like last year"],"pre":[]},{"id":"mt_BnabTHkNIp","s":"Science","d":"Dinosaurs & Paleontology","n":"Famous Dinosaur Species","desc":"Recognise and name common well-known dinosaur species: Tyrannosaurus rex, Triceratops, Stegosaurus, and Brachiosaurus/Diplodocus, describing a basic feature of each","a":[5,7],"ev":["Name at least four common dinosaur species from pictures or models","Describe one visible feature of each (e.g. T. rex has tiny arms, Triceratops has three horns)","Match a dinosaur name to a picture or model without help"],"pre":[["mt_dpM1l5IOk6","Must understand dinosaurs existed before learning to name species","h"]]},{"id":"mt_bKlnc7dyVK","s":"Science","d":"Dinosaurs & Paleontology","n":"Fossils & Palaeontologists","desc":"Understand that fossils are the remains of ancient living things preserved in rock, and that scientists called palaeontologists study fossils to learn about dinosaurs","a":[5,7],"ev":["Describe a fossil as the remains of a living thing preserved in rock","Name the job of a palaeontologist as someone who studies fossils","Identify examples of fossils: bones, teeth, footprints in rock"],"pre":[["mt_dpM1l5IOk6","Must understand dinosaurs are extinct before learning fossils are how we know about them","h"]]},{"id":"mt_DJh2JPwTf6","s":"Science","d":"Dinosaurs & Paleontology","n":"Plant-Eaters vs Meat-Eaters","desc":"Sort dinosaurs into plant-eaters (herbivores) and meat-eaters (carnivores) by looking at clues like tooth shape — flat teeth for plants, sharp teeth for meat","a":[5,7],"ev":["Sort a set of dinosaur pictures or models into herbivore and carnivore groups","Explain that sharp pointed teeth are for tearing meat and flat teeth are for grinding plants","Give an example of one herbivore and one carnivore dinosaur"],"pre":[["mt_13CtLTcWUB","Curriculum herbivore/carnivore/omnivore classification provides foundation for dinosaur diet sorting","s"],["mt_BnabTHkNIp","Knowing common species helps when sorting them by diet","s"],["mt_dpM1l5IOk6","Must understand dinosaurs existed before classifying their diets","h"]]},{"id":"mt_JednrdYqpt","s":"Science","d":"Dinosaurs & Paleontology","n":"Real Dinosaurs vs Fiction","desc":"Distinguish real dinosaurs from fictional or commonly confused creatures — pterosaurs (flying reptiles) and plesiosaurs (marine reptiles) were not dinosaurs, and movie dinosaurs are not always accurate","a":[5,7],"ev":["State that pterosaurs could fly but were not dinosaurs","State that plesiosaurs lived in the sea but were not dinosaurs","Identify at least one way a movie or cartoon dinosaur differs from the real animal"],"pre":[["mt_BnabTHkNIp","Must know some dinosaurs before distinguishing them from non-dinosaurs","h"]]},{"id":"mt_qixeaiswFP","s":"Science","d":"Earth's Systems","n":"How Organisms Shape Habitats","desc":"Construct an argument supported by evidence for how plants and animals can change the environment to meet their needs","a":[5,6],"ev":["Give at least three examples of organisms changing their environment (beaver dams, bird nests, plant roots breaking rock)","Explain why organisms change their environment (to meet needs for shelter, food, water)","Construct an argument with evidence showing how a specific organism changes its environment"],"pre":[["mt_L1469gt34A","Must understand what organisms need before explaining how they change environments to meet those needs","h"]]},{"id":"mt_HZvTriQWTh","s":"Science","d":"Earth's Systems","n":"Local weather patterns","desc":"Use and share observations of local weather conditions to describe patterns over time, recording temperature, rainfall, and other conditions","a":[5,6],"ev":["Observe and record daily weather conditions (temperature, cloud cover, precipitation, wind)","Identify patterns in weather data over days or weeks","Use observations to make simple predictions about upcoming weather"],"pre":[["mt_bj1YCgNWUx","Recording local weather conditions over time requires vocabulary for days, weeks, and months","s"],["mt_go5i87u2b9","Must observe seasonal changes before recording weather patterns systematically","h"]]},{"id":"mt_go5i87u2b9","s":"Science","d":"Earth's Systems","n":"Seasonal changes","desc":"Observe changes across the four seasons and describe weather associated with each season, including how day length varies","a":[5,6],"ev":["Name the four seasons and describe typical weather for each","Describe how day length changes through the year (longer in summer, shorter in winter)","Give examples of changes in the natural world associated with each season (e.g. leaves, flowers, animal behaviour)"],"pre":[["mt_bj1YCgNWUx","Observing and describing seasonal changes requires basic date and time vocabulary (months, seasons, year)","s"]]},{"id":"mt_e6PP4ip39V","s":"Science","d":"Ecosystems & Habitats","n":"Plants and animals in their habitats","desc":"Use a model to represent the relationship between the needs of different plants and animals and the places they live, connecting organism needs to habitat features","a":[5,6],"ev":["Use a simple model (drawing, diagram) to show how a habitat provides what an organism needs","Match at least three organisms to their habitats and explain why each needs that specific place","Describe what would happen if an organism were placed in a habitat that doesn't meet its needs"],"pre":[["mt_L1469gt34A","Must understand organism needs before modelling needs-habitat relationships","h"]]},{"id":"mt_deexfCHU9m","s":"Science","d":"Ecosystems & Habitats","n":"Reducing Human Impact","desc":"Communicate solutions that will reduce the impact of humans on the land, water, air, and other living things in the local environment","a":[5,6],"ev":["Identify at least three ways humans negatively impact the local environment (litter, pollution, habitat destruction)","Propose at least three solutions to reduce human impact (recycling, reducing waste, conserving water, planting trees)","Explain how each solution helps protect land, water, air, or living things"],"pre":[["mt_e6PP4ip39V","Understanding organism-habitat relationships supports understanding human impact on environments","s"]]},{"id":"mt_2agkUcdah9","s":"Science","d":"Energy","n":"Building shade from the sun","desc":"Use tools and materials to design and build a structure that will reduce the warming effect of sunlight on an area, such as a shade or shelter","a":[5,6],"ev":["Design a structure intended to reduce the warming effect of sunlight on an area","Build the structure using available materials and test whether it reduces temperature","Compare the temperature in the shaded area vs an unshaded area as evidence of effectiveness"],"pre":[["mt_hi8cVycbwn","Modelling/sketching skills support designing a shade structure","s"],["mt_iGSfQg3g5c","Must observe sunlight warming before designing a structure to reduce it","h"]]},{"id":"mt_iGSfQg3g5c","s":"Science","d":"Energy","n":"Sunlight warms things up","desc":"Make observations to determine the effect of sunlight on Earth's surface, noticing that sunlight warms the ground, water, and objects","a":[5,6],"ev":["Observe that surfaces in sunlight feel warmer than those in shade","Describe that sunlight provides warmth (heat energy) to Earth's surface","Compare temperatures of surfaces in sun vs shade using touch or a thermometer"],"pre":[["mt_go5i87u2b9","Seasonal observation supports understanding sunlight warming effects","s"]]},{"id":"mt_GBY8enpzO0","s":"Science","d":"Forces & Motion","n":"Forces Vocabulary","desc":"Name and describe forces using precise vocabulary — force, push, pull, twist, stretch, squash, contact force, non-contact force, gravity, weight, friction, air resistance, upthrust — and distinguish between forces that require physical contact and forces that act at a distance","a":[5,8],"ev":["Correctly name the force acting in at least five given scenarios (e.g. 'friction slows the sledge', 'gravity pulls the apple')","Distinguish between contact forces (friction, upthrust) and non-contact forces (gravity, magnetism) using the correct terms","Use 'weight' correctly as a force — distinct from 'mass' — in descriptions"],"pre":[]},{"id":"mt_B3W5EfimJw","s":"Science","d":"Forces & Motion","n":"Pushes & Pulls","desc":"Understand that pushes and pulls are forces that can change the speed or direction of an object's motion, and compare the effects of different strengths and directions","a":[5,6],"ev":["Describe a push and a pull as types of force that make objects move, speed up, slow down, or change direction","Compare the effects of a gentle push versus a strong push on the same object","Predict the direction an object will move based on the direction of the applied force"],"pre":[["mt_k7GOtslF-x","Understanding pushes and pulls as forces is supported by the arrow representation of magnitude and direction","s"]]},{"id":"mt_RlILL2sccX","s":"Science","d":"Forces & Motion","n":"Testing Push & Pull Designs","desc":"Analyse data to determine if a design solution works as intended to change the speed or direction of an object with a push or pull","a":[5,6],"ev":["Test a simple design (e.g. ramp, launcher) and collect data on whether it meets the goal","Analyse results to determine if the design works as intended","Suggest modifications based on the data to improve the design's performance"],"pre":[["mt_B3W5EfimJw","Must understand pushes/pulls before analysing design solutions using them","h"]]},{"id":"mt_LTb0ZReMR2","s":"Science","d":"Insects & Minibeasts","n":"Caring for minibeasts","desc":"Caring for minibeasts: observing minibeasts gently, handling them carefully, putting them back where you found them. Why minibeasts matter — they help gardens grow, break down dead leaves, and feed other animals.","a":[5,7],"ev":["Demonstrate careful handling of a minibeast such as letting a woodlouse walk onto a hand rather than grabbing it","Explain one reason why minibeasts are important, such as bees helping flowers grow or worms helping soil","State that minibeasts should be returned to where they were found after observing them"],"pre":[["mt_BI6oGIO-xM","Must know what minibeasts are before learning to care for them","h"],["mt_QH-Fs97twT","Understanding food chains motivates why minibeasts matter","s"]]},{"id":"mt_Wr6DDgr_kH","s":"Science","d":"Insects & Minibeasts","n":"Caterpillar to butterfly","desc":"Caterpillar to butterfly: the life cycle of a butterfly as an observable transformation. Egg → caterpillar → chrysalis → butterfly. The idea that one creature can change its whole form. Classroom butterfly kits, The Very Hungry Caterpillar.","a":[5,7],"ev":["Describe the four stages of a butterfly's life in order: egg, caterpillar, chrysalis, butterfly","Explain that the caterpillar and the butterfly are the same creature at different stages of life","Retell or draw the transformation from caterpillar to butterfly after reading a story or watching it happen"],"pre":[["mt_BI6oGIO-xM","Must know what minibeasts are before studying a specific life cycle","h"]]},{"id":"mt_yR1moI5kX1","s":"Science","d":"Insects & Minibeasts","n":"Common minibeasts: naming and recognising","desc":"Recognising and naming common minibeasts: ladybird, ant, bee, butterfly, spider, snail, worm, woodlouse, caterpillar, beetle. Building positive attitudes toward all minibeasts, not just the 'pretty' ones.","a":[5,7],"ev":["Name and identify at least six common minibeasts from pictures or real encounters","Describe one visible feature that helps tell a ladybird from a beetle or a spider from an ant","Show interest or curiosity toward less popular minibeasts like woodlice, worms, or spiders rather than only butterflies"],"pre":[["mt_BI6oGIO-xM","Must understand what minibeasts are before learning to name specific ones","h"]]},{"id":"mt__7hXSTbu9s","s":"Science","d":"Insects & Minibeasts","n":"How minibeasts move","desc":"How minibeasts move: crawling (ants, beetles), flying (butterflies, bees), slithering (worms, slugs), jumping (grasshoppers, fleas), burrowing (earthworms). Counting legs as a first step toward grouping creatures.","a":[5,7],"ev":["Describe at least three different ways minibeasts move such as crawling, flying, and slithering","Match a minibeast to its way of moving, for example grasshoppers jump and worms slither","Count legs on a minibeast and notice that ants have six while spiders have eight"],"pre":[["mt_yR1moI5kX1","Must recognise common minibeasts before comparing how they move","h"]]},{"id":"mt_zir5yyAzUB","s":"Science","d":"Insects & Minibeasts","n":"Minibeast Habitats","desc":"Where minibeasts live: micro-habitats. Different minibeasts prefer different conditions — under logs (damp, dark), in soil (underground), on leaves (sunny), in pond water (wet). The idea that you find different creatures in different places.","a":[5,7],"ev":["Name at least two micro-habitats where minibeasts live such as under logs, in soil, or on leaves","Predict what type of minibeast might be found in a damp dark place versus a sunny leaf","Explain that different minibeasts prefer different conditions like wet, dry, dark, or light"],"pre":[["mt_yR1moI5kX1","Must recognise common minibeasts before exploring where each type lives","h"]]},{"id":"mt_QH-Fs97twT","s":"Science","d":"Insects & Minibeasts","n":"Minibeasts in the food chain","desc":"Minibeasts in the food chain: simple garden food chains. A caterpillar eats a leaf, a bird eats the caterpillar. The idea that minibeasts are food for other animals, and that minibeasts eat things too.","a":[5,7],"ev":["Describe a simple food chain such as leaf → caterpillar → bird","Explain that minibeasts eat plants or other tiny creatures and are eaten by bigger animals","Give an example of what a specific minibeast eats, such as caterpillars eating leaves or ladybirds eating aphids"],"pre":[["mt_yR1moI5kX1","Must know common minibeasts before placing them in food chains","h"]]},{"id":"mt_BI6oGIO-xM","s":"Science","d":"Insects & Minibeasts","n":"What is a minibeast?","desc":"What is a minibeast? Small creatures without backbones, found in gardens, parks, and woodland. Bug hunts — searching under logs, stones, and leaves using magnifying glasses to observe minibeasts up close.","a":[5,7],"ev":["Explain that minibeasts are small animals without a backbone found in gardens and parks","Find at least three different minibeasts during a garden bug hunt under logs, stones, or leaves","Use a magnifying glass to observe and describe one minibeast's appearance in detail"],"pre":[]},{"id":"mt_auVZZEuXjs","s":"Science","d":"Matter & Materials","n":"Describing Material Properties","desc":"Describe simple physical properties of everyday materials such as hard/soft, stretchy/stiff, shiny/dull, rough/smooth, waterproof/absorbent, transparent/opaque","a":[5,6],"ev":["Use at least five property words correctly: hard, soft, stretchy, shiny, rough, smooth, transparent, waterproof","Describe the properties of three different materials using at least two property words each","Explain why a property matters (e.g. 'waterproof means water doesn't soak through')"],"pre":[["mt_1JFUNQDwAJ","Describing physical properties of materials uses solid/liquid/gas vocabulary introduced in the states of matter LANGUAGE node","s"],["mt_ZAJvTcroFO","Must name materials before describing their properties","h"]]},{"id":"mt_SwaNNdm_Ks","s":"Science","d":"Matter & Materials","n":"Grouping Materials","desc":"Compare and group everyday materials based on their simple physical properties","a":[5,6],"ev":["Sort a set of materials into groups based on a chosen property (e.g. transparent vs opaque)","Compare two materials and state which properties they share and which differ","Explain the reasoning behind a grouping decision using property vocabulary"],"pre":[["mt_auVZZEuXjs","Must describe properties before using them to group materials","h"]]},{"id":"mt_ZAJvTcroFO","s":"Science","d":"Matter & Materials","n":"Naming Everyday Materials","desc":"Identify and name a variety of everyday materials including wood, plastic, glass, metal, water, and rock","a":[5,6],"ev":["Name at least six everyday materials: wood, plastic, glass, metal, water, rock","Identify the material of at least ten different objects around the home or classroom","Recognise that some objects are made from more than one material"],"pre":[["mt_5r47Pvstyn","Must distinguish objects from materials before naming specific materials","h"]]},{"id":"mt_5r47Pvstyn","s":"Science","d":"Matter & Materials","n":"Objects vs Materials","desc":"Distinguish between an object and the material from which it is made, understanding that objects can be made from different materials","a":[5,6],"ev":["Explain the difference between an object (e.g. a chair) and the material it is made from (e.g. wood)","Give examples of the same object made from different materials (e.g. plastic cup, glass cup)","Identify what material a given object is made from by looking at and touching it"],"pre":[]},{"id":"mt_1JFUNQDwAJ","s":"Science","d":"Matter & Materials","n":"States of Matter Vocabulary","desc":"Name and distinguish the three states of matter — solid, liquid, and gas — using properties vocabulary: hard, rigid, runny, flows, keeps its shape, fills its container; use 'change of state' to describe what happens when materials are heated or cooled","a":[5,7],"ev":["Correctly sort a set of everyday materials as solid, liquid, or gas and give a reason for each","Use the terms solid, liquid, and gas accurately when describing everyday substances","Use 'change of state' to describe what happens when ice melts or water boils"],"pre":[]},{"id":"mt_4bJiGiMPmy","s":"Science","d":"Ocean Life","n":"Coasts & Beaches","desc":"Know what a coast or beach is — the place where land meets the ocean — and that different coasts can be sandy, rocky, or muddy, each with different plants and animals","a":[5,7],"ev":["Define a coast as where land meets the ocean","Describe at least two types of coast: sandy, rocky, or muddy","Name an animal likely found at each type of coast"],"pre":[]},{"id":"mt_ytUG3yjCYt","s":"Science","d":"Ocean Life","n":"Ocean Animal Variety","desc":"Recognise that the ocean is home to an amazing variety of animals — from tiny seahorses and colourful clownfish to enormous whales and sharks — and that ocean animals come in many shapes and sizes","a":[5,7],"ev":["Name at least five different ocean animals","Describe differences in size between small and large ocean creatures","Express curiosity or wonder about the variety of life in the ocean"],"pre":[]},{"id":"mt_l6OpmOKMuT","s":"Science","d":"Ocean Life","n":"Ocean Food Chains","desc":"Describe a simple ocean food chain: tiny plants (phytoplankton) are eaten by small animals, which are eaten by bigger fish, which are eaten by top predators like sharks — showing that all ocean life depends on others for food","a":[5,7],"ev":["Describe a food chain with at least three levels","Identify that ocean food chains start with tiny plants or algae","Explain that bigger animals eat smaller ones in a chain of dependence"],"pre":[["mt_m31_gPS8F1","Food chains explain how animals meet their need for food","s"],["mt_ytUG3yjCYt","Food chains benefit from knowing the variety of animals that eat each other","s"]]},{"id":"mt_w2u9bXP9n7","s":"Science","d":"Ocean Life","n":"Rock Pool Habitats","desc":"Explore rock pools (tide pools) as small ocean habitats where crabs, anemones, starfish, and small fish can be found, and understand that these creatures are adapted to survive crashing waves and changing water levels","a":[5,7],"ev":["Name at least three creatures found in rock pools","Describe a rock pool as a small ocean habitat on the shore","Explain one way rock pool animals cope with waves or changing water levels"],"pre":[["mt_4bJiGiMPmy","Rock pools are a coastal habitat; benefits from knowing about coasts","s"],["mt_ytUG3yjCYt","Rock pool exploration benefits from knowing ocean animals are diverse","s"]]},{"id":"mt_mRCPP_Ab2W","s":"Science","d":"Ocean Life","n":"Whales & Dolphins Are Mammals","desc":"Know that whales and dolphins are mammals, not fish — they breathe air, are warm-blooded, and feed their babies milk — even though they live in the ocean","a":[5,7],"ev":["State that whales and dolphins are mammals, not fish","Give at least two reasons why: they breathe air and feed babies milk","Explain that living in water does not make an animal a fish"],"pre":[["mt_ytUG3yjCYt","Mammals vs fish distinction benefits from knowing ocean animal variety","s"]]},{"id":"mt_oAg79ju344","s":"Science","d":"Ocean Life","n":"What Is the Ocean?","desc":"Know that oceans are huge bodies of salt water that cover most of Earth's surface, and that the ocean is home to an enormous number of living things","a":[5,7],"ev":["State that oceans cover more of Earth than land does","Explain that ocean water is salty, unlike the fresh water in rivers and lakes","Describe the ocean as home to a huge variety of living things"],"pre":[]},{"id":"mt_m31_gPS8F1","s":"Science","d":"Ocean Life","n":"What Ocean Animals Need","desc":"Understand that ocean animals need food, shelter, and the right conditions to survive — just like land animals — and that different parts of the ocean provide for different animals' needs","a":[5,7],"ev":["List basic needs of ocean animals: food, shelter, suitable water conditions","Give an example of how a specific ocean animal meets its needs","Compare an ocean animal's needs to a familiar land animal's needs"],"pre":[["mt_oAg79ju344","Ocean animal needs are contextualised by knowing what the ocean is","s"]]},{"id":"mt_fDoE-pL6Jv","s":"Science","d":"Organisms & Life Processes","n":"Animal Body Groups","desc":"Describe and compare the external body structure of common animals across groups (fish, amphibians, reptiles, birds, mammals)","a":[5,7],"ev":["Describe key structural features of at least three animal groups (e.g. scales, feathers, fur)","Compare two animals from different groups, noting at least two differences","Use words like 'wings', 'fins', 'legs', 'tail' correctly when describing an animal"],"pre":[["mt_zVLOm6U7bh","Must know animal groups before comparing body structures","h"]]},{"id":"mt_83gRQ9OPkc","s":"Science","d":"Organisms & Life Processes","n":"Body Parts & Senses","desc":"Identify, name, and locate basic parts of the human body and associate each body part with its sense","a":[5,6],"ev":["Label eyes, ears, nose, mouth, and skin on a body outline","Match each sense organ to its sense: sight, hearing, smell, taste, touch","Describe a simple scenario for each sense (e.g. 'I use my nose to smell cookies baking')"],"pre":[["mt_fDoE-pL6Jv","Comparing animal structures supports understanding own body parts","s"]]},{"id":"mt_j7cer_Nmor","s":"Science","d":"Organisms & Life Processes","n":"Common Plants & Trees","desc":"Identify and name common wild and garden plants, including deciduous and evergreen trees","a":[5,6],"ev":["Name at least five common wild or garden plants from direct observation","Sort trees into deciduous (loses leaves) and evergreen (keeps leaves) with examples","Match a plant to its name when shown a picture or real specimen"],"pre":[]},{"id":"mt_13CtLTcWUB","s":"Science","d":"Organisms & Life Processes","n":"Herbivores, Carnivores & Omnivores","desc":"Classify common animals as carnivores (eat meat), herbivores (eat plants), or omnivores (eat both)","a":[5,6],"ev":["Define carnivore, herbivore, and omnivore in own words","Sort at least six common animals into the three diet groups","Give a reason for each sorting decision based on what the animal eats"],"pre":[["mt_zVLOm6U7bh","Must identify animal groups before classifying by diet","h"]]},{"id":"mt_zexbopQjG0","s":"Science","d":"Organisms & Life Processes","n":"Living Things Vocabulary","desc":"Name and use vocabulary for what makes something living — alive, dead, never been alive, movement, nutrition, growth, reproduction, sensitivity, excretion — and apply these terms when classifying objects and explaining why plants and animals count as living things","a":[5,7],"ev":["Correctly classify objects as living, dead, or never been alive and give a reason using one of the life process terms","Name at least five life processes using the correct vocabulary","Explain why a plant is alive using at least two life process words"],"pre":[]},{"id":"mt_zVLOm6U7bh","s":"Science","d":"Organisms & Life Processes","n":"Naming Common Animals","desc":"Identify and name common animals from major groups: fish, amphibians, reptiles, birds, and mammals","a":[5,6],"ev":["Name at least two animals from each group: fish, amphibians, reptiles, birds, mammals","Sort a set of animal pictures into the five groups","Explain one feature of each group (e.g. 'birds have feathers', 'fish have gills')"],"pre":[]},{"id":"mt_xT6jPzyj92","s":"Science","d":"Organisms & Life Processes","n":"Parts of a Plant","desc":"Identify and describe the basic structure of common flowering plants (roots, stem, leaves, flowers) and trees (roots, trunk, branches, leaves)","a":[5,6],"ev":["Label roots, stem, leaves, and flowers on a diagram of a flowering plant","Name the main parts of a tree: roots, trunk, branches, leaves","Explain that roots take in water and leaves catch sunlight"],"pre":[["mt_j7cer_Nmor","Must know plant names before learning about their parts","h"]]},{"id":"mt_L1469gt34A","s":"Science","d":"Organisms & Life Processes","n":"What Living Things Need","desc":"Understand what plants and animals (including humans) need to survive: water, food, air, and suitable conditions","a":[5,7],"ev":["List the basic needs of animals: water, food, air, shelter","List the basic needs of plants: water, light, air, suitable temperature","Explain what happens if one basic need is missing (e.g. 'the plant wilts without water')"],"pre":[["mt_j7cer_Nmor","Knowing plants helps understand what they need","s"],["mt_zexbopQjG0","Describing what plants and animals need to survive uses life processes vocabulary: nutrition, growth, sensitivity","s"],["mt_zVLOm6U7bh","Knowing animals helps understand what they need","s"]]},{"id":"mt_aO018DkCun","s":"Science","d":"Polar Regions","n":"Arctic vs Antarctic","desc":"Know that the Arctic (North Pole) and Antarctic (South Pole) are very different — the Arctic is a frozen ocean surrounded by land where people and polar bears live, while the Antarctic is a huge ice-covered continent surrounded by ocean where penguins live but no people live permanently","a":[5,7],"ev":["State that the Arctic is a frozen ocean surrounded by land, while the Antarctic is a continent covered in ice surrounded by ocean","Explain that polar bears live in the Arctic and penguins live in the Antarctic, not the other way around","Know that people (like the Inuit) live in the Arctic but nobody lives permanently in Antarctica"],"pre":[["mt_4uPnLieBPN","Must know where the poles are before comparing Arctic vs Antarctic","h"]]},{"id":"mt_22XbXTRq50","s":"Science","d":"Polar Regions","n":"Brave Polar Explorers","desc":"Know simple stories of brave polar explorers — Robert Falcon Scott and Roald Amundsen who raced to the South Pole, and Ernest Shackleton whose ship Endurance was crushed by ice but who brought all his men home safely — and understand that polar exploration required incredible courage and endurance","a":[5,7],"ev":["Name at least two polar explorers: Scott, Amundsen, or Shackleton","Tell the basic story of Scott and Amundsen's race to the South Pole in simple terms","Describe what happened to Shackleton's ship Endurance and how he brought his crew home safely"],"pre":[["mt_4uPnLieBPN","Must know where the poles are before learning about explorers who went there","h"]]},{"id":"mt_SrmHaJXKrX","s":"Science","d":"Polar Regions","n":"Ice & Snow","desc":"Know that water can be solid (ice and snow) or liquid, that snow is made of tiny frozen ice crystals, that icebergs are huge chunks of ice floating in the ocean with most of their bulk hidden underwater, and that ice floats because it is lighter than liquid water","a":[5,7],"ev":["Explain that ice and snow are frozen water (solid) and that water can change between solid and liquid","Describe an iceberg as a huge piece of ice floating in the ocean with most of it hidden below the surface","State that ice floats because frozen water is lighter than liquid water"],"pre":[["mt_4uPnLieBPN","Must know about polar regions before learning about ice and snow there","h"]]},{"id":"mt_3duNkf6Qmr","s":"Science","d":"Polar Regions","n":"Midnight Sun & Polar Night","desc":"Know that at the poles, daylight and darkness are extreme — in summer the Sun never fully sets (midnight sun) and in winter the Sun never rises (polar night lasting months) — and that this is very different from what we experience at home, where every day has both daylight and darkness","a":[5,7],"ev":["Describe midnight sun: in polar summer, the Sun stays above the horizon all day and night","Describe polar night: in polar winter, the Sun stays below the horizon for weeks or months","Compare this to normal day-night patterns at home, noting the dramatic difference"],"pre":[["mt_4uPnLieBPN","Must know about the poles before understanding extreme day/night cycles there","h"]]},{"id":"mt_CK2orHetl3","s":"Science","d":"Polar Regions","n":"Penguins","desc":"Know key facts about penguins — they live in the Antarctic and Southern Hemisphere, they cannot fly but are excellent swimmers, Emperor penguins are the largest and huddle together in winter to keep warm, and penguin parents take turns keeping their egg warm on their feet in freezing temperatures","a":[5,7],"ev":["State at least three facts about penguins: they can't fly, they're excellent swimmers, and Emperor penguins are the biggest","Describe how Emperor penguins huddle together in winter to keep warm","Explain that penguin parents take turns keeping their egg warm on their feet in freezing temperatures"],"pre":[["mt_aO018DkCun","Must know penguins live in Antarctic (not Arctic) from the comparison topic","h"]]},{"id":"mt_7OJjLOl0fz","s":"Science","d":"Polar Regions","n":"Polar Animals","desc":"Know about other polar animals besides penguins and polar bears — seals that swim under ice, walruses with long tusks, Arctic foxes that turn white in winter, snowy owls, narwhals with their unicorn-like tusk, and whales that migrate to polar waters to feed — and that all these animals have special features to survive extreme cold","a":[5,7],"ev":["Name at least four polar animals beyond penguins and polar bears, such as seals, walruses, Arctic foxes, snowy owls, or narwhals","Describe one way each named animal survives the cold (e.g. walrus blubber, Arctic fox white winter coat)","State that narwhals have a long spiral tusk and live in Arctic waters"],"pre":[["mt_aO018DkCun","Must know Arctic vs Antarctic before learning which animals live where","h"],["mt_CK2orHetl3","Penguins and polar bears are the anchor species; other animals build on these","s"],["mt_O9dH94NFae","Polar bears are the anchor species; other animals build on these","s"]]},{"id":"mt_O9dH94NFae","s":"Science","d":"Polar Regions","n":"Polar Bears","desc":"Know key facts about polar bears — they live only in the Arctic (not the Antarctic), they have thick white fur and a layer of fat (blubber) to keep warm, they are excellent swimmers, and they hunt seals by waiting at holes in the sea ice","a":[5,7],"ev":["State that polar bears live in the Arctic, not the Antarctic","Describe at least two ways polar bears stay warm: thick white fur and a layer of blubber (fat)","Explain how polar bears hunt seals by waiting at breathing holes in the sea ice"],"pre":[["mt_aO018DkCun","Must know polar bears live in Arctic (not Antarctic) from the comparison topic","h"]]},{"id":"mt_4uPnLieBPN","s":"Science","d":"Polar Regions","n":"Where Are the Poles?","desc":"Know that Earth has a North Pole and a South Pole — the two coldest places on the planet — and be able to find them on a globe, understanding that they are at the very top and very bottom of the Earth, as far from the Equator as possible","a":[5,7],"ev":["Point to the North Pole and South Pole on a globe or world map","Explain that the poles are the coldest places on Earth because they are farthest from the Equator","State that the North Pole is at the top and the South Pole is at the bottom of the Earth"],"pre":[]},{"id":"mt_s08-QxASd2","s":"Science","d":"Rainforests","n":"Everyday Foods from Rainforests","desc":"Know that many everyday foods come from rainforests — chocolate is made from cacao beans, bananas grow in tropical forests, coffee berries ripen in forest shade, and Brazil nuts fall from giant trees — connecting our daily lives to faraway forests","a":[5,7],"ev":["Name at least three foods that come from rainforests, such as chocolate (cacao), bananas, and Brazil nuts","Explain that cacao beans grow on trees in the rainforest and are made into chocolate","Connect their own food choices to rainforest origins by identifying a product they eat that comes from the forest"],"pre":[["mt_FZ_ixwU1p1","Must know what a rainforest is before learning about products from it","h"]]},{"id":"mt_2zJ1NrGgYm","s":"Science","d":"Rainforests","n":"Indigenous Rainforest Peoples","desc":"Know that indigenous peoples such as the Yanomami have lived in rainforests for thousands of years, building homes from forest materials, finding food by hunting, fishing, and gathering, and knowing the forest and its plants and animals deeply","a":[5,7],"ev":["Explain that indigenous peoples like the Yanomami have lived in rainforests for thousands of years","Describe how they use the forest for shelter, food, and medicine","Show respect for indigenous knowledge by explaining that these communities understand the forest very deeply"],"pre":[["mt_FZ_ixwU1p1","Must understand what a rainforest is before learning about the people who live there","h"]]},{"id":"mt_ntxlccnYzB","s":"Science","d":"Rainforests","n":"Inside a Rainforest","desc":"Describe what it feels like inside a rainforest — hot and sticky (humid), dark on the ground because the treetops block the light, loud with animal calls and insect buzzing, and dripping with water from rain and condensation","a":[5,7],"ev":["Describe the air inside a rainforest as hot and sticky (humid)","Explain that the forest floor is dark because tall trees block most of the sunlight","Name at least two sounds you would hear in a rainforest, such as bird calls, insect buzzing, or rain dripping"],"pre":[["mt_FZ_ixwU1p1","Must know what a rainforest is before describing sensory experience","h"]]},{"id":"mt_xVW5U41tbp","s":"Science","d":"Rainforests","n":"Rainforest Animals","desc":"Name and recognise iconic rainforest animals — jaguars, toucans, sloths, poison dart frogs, howler monkeys, macaws, and butterflies — and know which layer of the rainforest each lives in","a":[5,7],"ev":["Name at least five iconic rainforest animals such as jaguars, toucans, sloths, poison dart frogs, and howler monkeys","Match at least three animals to the rainforest layer where they live (e.g. monkeys in the canopy, jaguars on the forest floor)","Describe one distinctive feature of each named animal"],"pre":[["mt_-0cjwyYhce","Animals are taught in context of which layer they inhabit","h"]]},{"id":"mt_XL2gqdKJfu","s":"Science","d":"Rainforests","n":"Rainforest Insects","desc":"Know that rainforests are home to millions of insects — leaf-cutter ants that farm fungus, giant beetles, jewel-coloured butterflies, enormous spiders, and stick insects — and that insects are the most numerous animals in the rainforest","a":[5,7],"ev":["Name at least three types of insect or minibeast found in the rainforest, such as leaf-cutter ants, morpho butterflies, and giant beetles","Explain that insects are the most numerous animals in the rainforest","Describe one interesting behaviour, such as leaf-cutter ants carrying leaf pieces back to grow fungus"],"pre":[["mt_-0cjwyYhce","Minibeasts live at specific layers (leaf-cutter ants on forest floor)","h"],["mt_BI6oGIO-xM","Understanding what a minibeast is helps learn about rainforest minibeasts (Insects 5-7 -> Rainforests 5-7)","s"],["mt_xVW5U41tbp","Minibeasts are a subset of rainforest animals; knowing the broader animal diversity helps","s"]]},{"id":"mt_-0cjwyYhce","s":"Science","d":"Rainforests","n":"Rainforest Layers","desc":"Know that a rainforest has four layers from ground to sky — the forest floor (dark, damp, full of decomposing leaves), the understory (small trees and shrubs in the shade), the canopy (a thick roof of treetops where most animals live), and the emergent layer (the tallest trees poking above the canopy into bright sunlight)","a":[5,7],"ev":["Name the four rainforest layers in order from ground to sky: forest floor, understory, canopy, emergent","Describe one key feature of each layer, such as the canopy being a thick roof of leaves or the forest floor being dark and damp","Explain that most rainforest animals live in the canopy because that is where there is food and light"],"pre":[["mt_FZ_ixwU1p1","Must know what a rainforest is before learning its four layers","h"]]},{"id":"mt_x5ZrQMAZ5v","s":"Science","d":"Rainforests","n":"Rainforest Plants","desc":"Know that rainforests contain an enormous variety of plants — towering kapok and Brazil nut trees, climbing vines called lianas, colourful orchids that grow on tree branches, giant water lilies, and huge leaves that funnel rainwater","a":[5,7],"ev":["Name at least three types of rainforest plant, such as kapok trees, lianas (climbing vines), and orchids","Explain that rainforest plants grow very tall because they compete for sunlight","Describe one unusual feature, such as orchids growing on tree branches or lianas climbing up trunks"],"pre":[["mt_-0cjwyYhce","Plants taught in context of layers (epiphytes in canopy, lianas climbing trunks)","h"]]},{"id":"mt_FZ_ixwU1p1","s":"Science","d":"Rainforests","n":"What Is a Rainforest?","desc":"Know that a rainforest is a thick, tall forest found in hot, wet places near the Equator where it rains almost every day, creating a warm, damp environment where plants and animals thrive","a":[5,7],"ev":["Describe a rainforest as a forest that is hot and wet, located near the Equator","Explain that it rains very often in a rainforest, which is why the plants grow so tall and thick","Point to the Equator on a globe and say that rainforests are found in the hot belt near it"],"pre":[]},{"id":"mt_0u3QNroZ34","s":"Science","d":"Rainforests","n":"Where Rainforests Are","desc":"Know that rainforests are found in a belt around the middle of the Earth — in South America (the Amazon), Central Africa (the Congo), and Southeast Asia — and that they appear on every continent except Antarctica and Europe","a":[5,7],"ev":["Point to the Amazon, Congo, and Southeast Asian rainforest regions on a world map","Explain that rainforests grow near the Equator where it is hot and wet all year","Name at least two continents that have large rainforests"],"pre":[["mt_FZ_ixwU1p1","Must know what a rainforest is before learning where they are located","h"]]},{"id":"mt_XirhnAB6Ye","s":"Science","d":"Scientific Inquiry","n":"Asking scientific questions","desc":"Ask simple scientific questions and recognise that they can be answered in different ways including observation, testing, and research","a":[5,8],"ev":["Ask at least three 'how' or 'why' questions about the natural world","Suggest different ways to answer a question: observing, testing, asking an expert, reading a book","Choose an appropriate method to investigate a specific question"],"pre":[["mt_f8n4txtLej","Formulating scientific questions builds on the general skill of asking relevant questions to extend understanding, developed in English speaking and listening","s"],["mt_Hw70LI5xza","Asking good scientific questions requires noticing the distinction between observation and interpretation — a question like 'why did this happen?' only makes sense once you've separated what you saw from what you inferred","s"],["mt_klyw-tdlhP","Asking scientific questions is the science-domain expression of the universal comprehension-monitoring habit: noticing what you don't yet understand","s"],["mt_S4G6GLKr1-","Scientific enquiry requires persistence through uncertainty — the universal persistence habit underpins willingness to keep investigating","s"]]},{"id":"mt_nNYo5A-7Bl","s":"Science","d":"Scientific Inquiry","n":"Comparing Design Solutions","desc":"Analyse data from tests of two objects designed to solve the same problem to compare the strengths and weaknesses of each design","a":[5,8],"ev":["Test two designs that address the same problem and collect data on their performance","Compare the results, identifying strengths and weaknesses of each design","Use data as evidence to recommend which design works better and suggest improvements"],"pre":[["mt_hi8cVycbwn","Must create models before comparing test results of two designs","h"],["mt_ZFwPZaDJ0_","Must gather/record data before analysing data from design tests","h"]]},{"id":"mt_hi8cVycbwn","s":"Science","d":"Scientific Inquiry","n":"Modelling with Sketches","desc":"Develop a simple sketch, drawing, or physical model to illustrate how the shape of an object helps it function as needed to solve a given problem","a":[5,8],"ev":["Create a sketch, drawing, or physical model of a design solution","Explain how the shape or structure of the design helps solve the problem","Relate the model to the real-world problem it addresses"],"pre":[["mt_XirhnAB6Ye","Must ask questions about problems before modelling design solutions","h"]]},{"id":"mt_vJO5Bxk4z-","s":"Science","d":"Scientific Inquiry","n":"Observing with simple equipment","desc":"Observe closely using simple equipment such as hand lenses, and use observations to describe, compare, and identify things","a":[5,7],"ev":["Use a hand lens or other simple equipment to make detailed observations","Describe observations using specific vocabulary (colour, shape, size, texture, pattern)","Compare two objects based on careful observation, noting similarities and differences"],"pre":[["mt_XirhnAB6Ye","Must ask questions before learning to observe closely","h"]]},{"id":"mt_ZFwPZaDJ0_","s":"Science","d":"Scientific Inquiry","n":"Recording Data","desc":"Gather and record data using simple methods such as tables, tally charts, and drawings to help answer questions","a":[5,7],"ev":["Record observations and measurements in a simple table or tally chart","Use drawings or labelled diagrams to record what was observed","Explain how the recorded data helps answer the original question"],"pre":[["mt_Wa44s-f8Ws","Must perform tests before learning to gather and record data","h"]]},{"id":"mt_Wa44s-f8Ws","s":"Science","d":"Scientific Inquiry","n":"Simple tests and experiments","desc":"Perform simple tests and use observations and ideas to suggest answers to questions","a":[5,7],"ev":["Carry out a simple test with one thing changing at a time","Observe what happens and describe the result","Use the result to suggest an answer to the original question"],"pre":[["mt_vJO5Bxk4z-","Must observe closely before performing simple tests","h"]]},{"id":"mt_ByXgbTld6R","s":"Science","d":"Space Exploration","n":"Moon Phases","desc":"Observe and describe the Moon's changing shape over about a month, recognising that it goes through a repeating cycle of phases from new moon (invisible) to full moon (complete circle) and back again","a":[5,7],"ev":["Describe that the Moon appears to change shape over
