<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Learners</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Learners">
<meta name="theme-color" content="#faf7f2">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf7f2;--card:#ffffff;--ink:#2b2a33;--mute:#6d6b78;--line:#e9e3d8;--accent:#e8743b;--accent-ink:#ffffff;--soft:#fdeee4;--ok:#2f8f5b;--okbg:#e4f4ea;--blue:#e8f0fb;--blueink:#27508a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16151b;--card:#201f27;--ink:#f1eee8;--mute:#a09dab;--line:#34323d;--accent:#f08a54;--accent-ink:#1a1008;--soft:#33251d;--ok:#6fd09a;--okbg:#1d3328;--blue:#1e2a3f;--blueink:#a9c6f2}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16151b;--card:#201f27;--ink:#f1eee8;--mute:#a09dab;--line:#34323d;--accent:#f08a54;--accent-ink:#1a1008;--soft:#33251d;--ok:#6fd09a;--okbg:#1d3328;--blue:#1e2a3f;--blueink:#a9c6f2}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:14px 16px 96px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.seg{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:14px;margin:8px 0 14px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px 6px;border-radius:11px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px}
.emo{font-size:30px;line-height:1;width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.ttl{font-weight:700;font-size:16px}
.meta{font-size:12px;color:var(--mute)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--blue);color:var(--blueink);margin-right:4px}
.for{background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0 6px;font-size:15px}
.for b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:2px}
details{margin:6px 0}
summary{cursor:pointer;color:var(--mute);font-size:13px}
details p{margin:6px 0 0;font-size:14px}
.say{font-style:italic;color:var(--mute);font-size:14px;margin:6px 0}
.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.done{background:var(--okbg);color:var(--ok)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-size:11px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.tl{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tl:last-child{border-bottom:0}
.tl .n{font-weight:600}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
ul{padding-left:20px;margin:6px 0}
li{margin:3px 0;font-size:14px}
.note{font-size:12px;color:var(--mute);margin:14px 0}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.hl{font-size:13px;color:var(--mute);margin:0 0 8px}
.tick{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:11px 8px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.tick.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.ticks{display:flex;gap:8px;margin-top:10px}
.step{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:22px;line-height:1;cursor:pointer}
.stepn{min-width:30px;text-align:center;font-weight:700;font-size:20px}
.pk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pk:last-child{border-bottom:0}
.chipbtn{display:inline-block;font:inherit;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--mute);margin:0 0 8px;cursor:pointer}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;margin:0 0 8px;font-size:14px}
input[type=text],textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;margin:8px 0 0}
textarea{min-height:84px;resize:vertical;word-break:break-all}
.win{background:var(--okbg);color:var(--ok);font-weight:600;text-align:center;border-radius:14px;padding:12px;margin:0 0 12px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
var DATA = {"topics":[{"id":"mt_AzTrT5ySCx","s":"Computing","d":"Artificial Intelligence","n":"AI in Daily Life","desc":"Spotting AI in daily life: face unlock on a phone, video recommendations, spelling auto-correct, automatic doors that detect people; technology that seems to 'know' things","a":[5,7],"ev":["Identify at least five examples of AI in their daily life","Explain that these technologies use patterns and data, not magic or real thinking","Describe one way AI makes their life easier and one time it might not work perfectly"],"pre":[["mt_u6SYiVx7FX","Voice assistants are one example of AI in daily life","s"],["mt_WRRv1ABECC","Must understand smart things before spotting AI all around daily life","h"]]},{"id":"mt_XbGfVhfiUz","s":"Computing","d":"Artificial Intelligence","n":"Computers in Everyday Life","desc":"Identifying computers in everyday life — not just laptops but phones, tablets, smart speakers, traffic lights, washing machines; what makes something a computer","a":[5,7],"ev":["Point out at least five everyday objects that contain computers","Explain what all computers have in common (they follow instructions and process information)","Sort a set of objects into 'contains a computer' and 'does not contain a computer'"],"pre":[]},{"id":"mt_jvJ35MmCvK","s":"Computing","d":"Artificial Intelligence","n":"Real-World Robots","desc":"What a robot really is — not the sci-fi version; robots in factories, robot vacuum cleaners, robot arms in surgery; that robots follow instructions given by people","a":[5,7],"ev":["Describe what a robot is (a machine that follows instructions to do a task)","Name at least three real robots and what they do","Explain that robots are not alive and do not have feelings — they follow instructions people wrote"],"pre":[["mt_XbGfVhfiUz","Must know what computers are before understanding robots as programmable machines","h"]]},{"id":"mt_WRRv1ABECC","s":"Computing","d":"Artificial Intelligence","n":"Smart Versus Not-Smart Devices","desc":"Sorting objects into 'smart' (can sense and respond) and 'not smart' (just sits there); a toaster vs a smart speaker; introduction to the idea that some machines can sense and respond to the world","a":[5,7],"ev":["Sort a set of objects into 'smart' (responds to input) and 'not smart' (does the same thing every time)","Explain what makes a smart speaker different from a regular radio","Give an example of a machine that senses something and responds (automatic door, motion-sensor light)"],"pre":[["mt_XbGfVhfiUz","Must know what computers are before sorting smart vs not-smart things","h"]]},{"id":"mt__p5n8z5soJ","s":"Computing","d":"Artificial Intelligence","n":"Step-by-Step Instructions","desc":"Step-by-step instructions for everyday tasks (making a sandwich, brushing teeth); that if instructions are wrong or missing, things go wrong; computers follow instructions exactly","a":[5,7],"ev":["Write or describe step-by-step instructions for a simple everyday task","Predict what goes wrong if a step is missing or in the wrong order","Explain that a computer follows instructions exactly — it cannot guess what you meant"],"pre":[["mt_XbGfVhfiUz","Must know computers exist before understanding they follow exact instructions","h"]]},{"id":"mt_u6SYiVx7FX","s":"Computing","d":"Artificial Intelligence","n":"Voice Assistants and How They Work","desc":"What happens when you talk to Alexa, Siri, or Google Assistant; they listen, try to understand, look up answers; sometimes they get it wrong; they are tools, not alive","a":[5,7],"ev":["Describe the steps that happen when you ask a voice assistant a question (it listens, processes words, finds an answer, speaks back)","Give an example of a time a voice assistant might get something wrong","Explain that a voice assistant is a computer program, not a person — it doesn't understand or feel"],"pre":[["mt__p5n8z5soJ","Understanding algorithms helps grasp how voice assistants process commands","s"],["mt_WRRv1ABECC","Must understand smart devices before exploring voice assistants as a specific smart device","h"]]},{"id":"mt_scBgiMKhG_","s":"English","d":"English Thinking","n":"Reading for Meaning","desc":"Understand that reading is about making meaning, not just saying words correctly — a text that can be decoded but not understood has not been read","a":[5,6],"ev":["Simple View of Reading (Gough & Tunmer)","reading comprehension research on comprehension-decoding separation"],"pre":[["mt_klyw-tdlhP","Understanding that reading means making meaning is the English-domain grounding of the universal habit of noticing when you don't understand","s"]]},{"id":"mt_N8CpN1EJrP","s":"English","d":"Grammar & Punctuation","n":"Building sentences","desc":"Understand that words combine to make sentences — a sentence expresses a complete thought; produce and expand complete sentences in speech and writing","a":[4,6],"ev":["Distinguish between complete sentences and fragments","Compose a complete sentence with a subject and verb","Expand a simple sentence by adding detail"],"pre":[]},{"id":"mt_of2GggtxFl","s":"English","d":"Grammar & Punctuation","n":"Spaces Between Words","desc":"Separate words with spaces in writing; understand that spaces mark word boundaries in print","a":[4,6],"ev":["Leave clear finger-spaces between words when writing","Count the number of words in a written sentence by identifying spaces","Correct writing that has missing spaces between words"],"pre":[["mt_1KCwbGvm1F","Need to understand words in print","s"],["mt_N8CpN1EJrP","Must understand sentences before spacing words","h"]]},{"id":"mt_yBJyCfhtem","s":"English","d":"Grammar & Punctuation","n":"Basic Nouns & Verbs","desc":"Use frequently occurring nouns (people, places, things) and verbs (action words) appropriately in speech and writing","a":[5,6],"ev":["Use common nouns accurately in sentences (e.g. 'dog', 'school', 'book')","Use action verbs appropriately (e.g. 'run', 'eat', 'play')","Identify nouns and verbs in simple sentences when prompted"],"pre":[]},{"id":"mt_uM6q_KBWKy","s":"English","d":"Grammar & Punctuation","n":"Capitals for Names, Days and I","desc":"Use capital letters for proper nouns (names of people, places) the days of the week, and the personal pronoun 'I'","a":[5,7],"ev":["Capitalise names of people and places consistently in writing","Write the pronoun 'I' as a capital letter","Capitalise days of the week (e.g. 'Monday')"],"pre":[["mt_QEr24lqzvH","Capitalisation is related punctuation skill","s"]]},{"id":"mt_TfOiog-ALs","s":"English","d":"Grammar & Punctuation","n":"Grammar words: letter, word, sentence","desc":"Use basic grammatical terminology when discussing reading and writing: letter, capital letter, word, singular, plural, sentence, punctuation, full stop, question mark, exclamation mark","a":[5,6],"ev":["Name punctuation marks correctly when pointed out in text","Use terms like 'capital letter' and 'full stop' when editing writing","Explain what a 'sentence' is using the correct term"],"pre":[["mt_N8CpN1EJrP","Sentence concept foundational to grammar terminology","h"],["mt_QEr24lqzvH","Punctuation terms part of grammar terminology","s"]]},{"id":"mt_YXVQaufkKO","s":"English","d":"Grammar & Punctuation","n":"Joining Words with 'And'","desc":"Join words and clauses using the conjunction 'and' to create longer sentences","a":[5,7],"ev":["Combine two simple sentences using 'and' (e.g. 'I like cats and dogs')","Join two related clauses with 'and' (e.g. 'We went to the park and we played')","Use 'and' in lists of items within a sentence"],"pre":[["mt_N8CpN1EJrP","Must understand sentences before joining them","h"]]},{"id":"mt_VY3rBq8RyP","s":"English","d":"Grammar & Punctuation","n":"Prepositions","desc":"Understand and use the most frequently occurring prepositions of location and direction (e.g. to, from, in, out, on, off, for, by, with)","a":[5,7],"ev":["Use prepositions correctly in sentences (e.g. 'on the table', 'under the bed')","Follow instructions involving prepositions (e.g. 'Put the book on the shelf')","Describe positions using prepositional phrases"],"pre":[["mt_mB7DVai-Uf","Listening and responding supports learning prepositions","s"]]},{"id":"mt_6lHBTwQPrS","s":"English","d":"Grammar & Punctuation","n":"Question Words","desc":"Understand and use question words (who, what, where, when, why, how) to form and answer questions","a":[5,6],"ev":["Ask questions using appropriate question words","Answer who, what, where, when questions about familiar topics","Recognise that question words signal a question is being asked"],"pre":[["mt_mB7DVai-Uf","Listening and responding supports learning question words","s"]]},{"id":"mt_18qkgxr_-T","s":"English","d":"Grammar & Punctuation","n":"Regular Plural Nouns","desc":"Form and use regular plural nouns orally and in writing by adding -s or -es; understand that plural means more than one","a":[5,6],"ev":["Say and write correct plural forms (e.g. 'one cat, two cats'; 'one wish, two wishes')","Choose -s or -es correctly based on the ending sound","Explain that plural nouns name more than one"],"pre":[["mt_yBJyCfhtem","Need noun concept before plural forms","s"]]},{"id":"mt_QEr24lqzvH","s":"English","d":"Grammar & Punctuation","n":"Starting and Ending Sentences","desc":"Begin sentences with a capital letter and end them with the appropriate mark (full stop, question mark, or exclamation mark); recognise and name end punctuation","a":[5,8],"ev":["Write sentences beginning with a capital letter","Choose and use the correct end punctuation for statements, questions, and exclamations","Identify and name full stops, question marks, and exclamation marks when reading"],"pre":[["mt_N8CpN1EJrP","Must understand sentences before punctuating them","h"]]},{"id":"mt_WBfj79OqXz","s":"English","d":"Handwriting & Transcription","n":"Sitting and holding a pencil","desc":"Sit correctly at a table holding a pencil comfortably and correctly; form lower-case letters in the correct direction starting and finishing in the right place","a":[4,6],"ev":["Hold a pencil with a comfortable tripod or near-tripod grip","Write all 26 lowercase letters with correct starting points and direction","Maintain consistent letter size on lined paper"],"pre":[]},{"id":"mt_H7DquwQi_F","s":"English","d":"Handwriting & Transcription","n":"Forming Capital Letters","desc":"Form capital letters correctly; print many upper- and lowercase letters legibly","a":[5,6],"ev":["Write all 26 capital letters with correct formation","Distinguish between uppercase and lowercase forms in own writing","Use appropriate sizing so capitals are taller than lowercase letters"],"pre":[["mt_WBfj79OqXz","Master lowercase formation before capitals","h"]]},{"id":"mt_DMvKfP4uGC","s":"English","d":"Handwriting & Transcription","n":"Letter Formation Families","desc":"Understand which letters belong to which handwriting families based on similar formation patterns and practise letters in groups","a":[5,6],"ev":["Group letters by similar strokes (e.g. c, a, d, g, o family — all start with a curve)","Explain why certain letters are practised together","Form letters within the same family consistently using the shared movement pattern"],"pre":[["mt_WBfj79OqXz","Need to form letters before grouping into families","h"]]},{"id":"mt_oAK9GXSfqV","s":"English","d":"Handwriting & Transcription","n":"Writing digits 0-9","desc":"Form digits 0-9 correctly and legibly","a":[5,6],"ev":["Write all digits 0-9 clearly with correct starting points","Form digits the appropriate size relative to letter height","Write numbers legibly so they can be read by others"],"pre":[["mt_WBfj79OqXz","Same motor skills for digit formation","s"]]},{"id":"mt__KHQttMde3","s":"English","d":"Phonics & Word Reading","n":"Blending Sounds to Read Words","desc":"Apply phonic knowledge to blend sounds in unfamiliar words containing taught grapheme-phoneme correspondences; respond speedily to graphemes for all 40+ phonemes","a":[4,7],"ev":["Sound out and blend unfamiliar phonically regular words (e.g. /sh/-/o/-/p/ → 'shop')","Read words containing taught GPCs without excessive sounding out","Distinguish between similarly spelled words by identifying differing letter sounds (e.g. 'big' vs 'bag')"],"pre":[["mt_F978c32kDr","Need GPC knowledge to blend","h"],["mt_PvU3eoikev","Phoneme awareness needed for blending","h"]]},{"id":"mt_9-OHslmt1g","s":"English","d":"Phonics & Word Reading","n":"Consonant Digraphs","desc":"Read and spell words containing consonant digraphs and less common consonant spellings (ch, sh, th, ck, tch, ng, ph, wh, k for /k/)","a":[4,7],"ev":["Read words with consonant digraphs (e.g. 'shop', 'chip', 'that')","Identify the sound made by ph (/f/) and wh (/w/) in words","Spell words ending in -ck (e.g. 'duck') and -tch (e.g. 'match')"],"pre":[["mt_F978c32kDr","Must know single letters before digraphs","h"]]},{"id":"mt_frDIaXzWbx","s":"English","d":"Phonics & Word Reading","n":"Knowing all letters","desc":"Recognise and name all uppercase and lowercase letters of the alphabet; name the letters in order and use letter names to distinguish between alternative spellings","a":[4,6],"ev":["Name all 26 letters in both cases when shown in random order","Recite the alphabet from A to Z","Use letter names to explain spelling choices (e.g. 'Is it c or k in cat?')"],"pre":[["mt_1KCwbGvm1F","Must understand print direction before letter identification matters","h"]]},{"id":"mt_PvU3eoikev","s":"English","d":"Phonics & Word Reading","n":"Onsets & Rimes","desc":"Blend and segment onsets and rimes in single-syllable words; isolate and pronounce individual phonemes (initial, medial, final) in CVC words; add or substitute phonemes to make new words","a":[4,7],"ev":["Blend onset and rime to say a word (e.g. /c/ + /at/ → 'cat')","Identify the first, middle, or last sound in a CVC word","Change one sound to make a new word (e.g. change /c/ in 'cat' to /b/ → 'bat')"],"pre":[["mt_4GiE83rJF_","Rhyme awareness supports finer phoneme skills","s"],["mt_UvNrOXny1i","Syllable awareness builds toward phoneme level","s"]]},{"id":"mt_4GiE83rJF_","s":"English","d":"Phonics & Word Reading","n":"Rhyming words","desc":"Recognise and produce rhyming words; join in with predictable phrases and rhymes in stories and poems; learn to appreciate and recite poems by heart","a":[4,6],"ev":["Identify which words rhyme from a set (e.g. cat, bat, dog)","Generate a word that rhymes with a given target","Join in with repeated refrains and rhyming patterns during shared reading"],"pre":[]},{"id":"mt_F978c32kDr","s":"English","d":"Phonics & Word Reading","n":"Single Letter Sounds","desc":"Know the primary sound for each consonant and the short and long sounds for the five major vowels; respond speedily to single-letter graphemes","a":[4,6],"ev":["Say the most common sound for each consonant when shown the letter","Distinguish short vowel sounds in CVC words (e.g. /a/ in 'cat' vs /e/ in 'bed')","Associate long and short vowel sounds with common single-letter spellings"],"pre":[["mt_frDIaXzWbx","Must recognise letters before learning their sounds","h"]]},{"id":"mt_1KCwbGvm1F","s":"English","d":"Phonics & Word Reading","n":"Understanding print","desc":"Demonstrate understanding that print carries meaning, follows left-to-right top-to-bottom directionality, and is organised page by page in books","a":[4,6],"ev":["Track words with a finger moving left to right across the page","Turn pages in the correct sequence when handling a book","Point to where reading starts on a page"],"pre":[]},{"id":"mt_BtMbZibZUj","s":"English","d":"Phonics & Word Reading","n":"Vowel Digraphs","desc":"Read and spell words containing common vowel digraphs (ai, ay, ee, ea, oa, oe, oo, oi, oy) including where a digraph can represent more than one sound","a":[4,7],"ev":["Read words with vowel digraphs (e.g. 'tree', 'boat', 'rain', 'coin')","Distinguish between different sounds for the same digraph (e.g. 'oo' in 'book' vs 'moon')","Spell words using common vowel digraph patterns"],"pre":[["mt_F978c32kDr","Must know single letter sounds before vowel digraphs","h"]]},{"id":"mt_70Ys4i1AB1","s":"English","d":"Phonics & Word Reading","n":"Compound Words","desc":"Recognise and spell compound words by identifying the two component words that combine to form a single word","a":[5,8],"ev":["Identify the two words in a compound (e.g. 'sunshine' = 'sun' + 'shine')","Spell compound words by combining known words","Create compound words from given word pairs"],"pre":[["mt__KHQttMde3","Blending supports reading compound words","s"],["mt_UvNrOXny1i","Syllable awareness helps with compound words","s"]]},{"id":"mt_fMd7v87IiI","s":"English","d":"Phonics & Word Reading","n":"Diphthongs and complex vowels","desc":"Read and spell words containing diphthongs and complex vowel patterns (ow, ou, ew, ue, ie, aw, au) and words ending in -y as a vowel sound","a":[5,6],"ev":["Read words with variable vowel sounds (e.g. 'ow' in 'cow' vs 'snow')","Decode words with diphthongs (e.g. 'cloud', 'blue', 'pie')","Read words ending in -y pronounced as /ee/ or /igh/ (e.g. 'happy', 'my')"],"pre":[["mt_BtMbZibZUj","Related vowel knowledge supports diphthongs","s"]]},{"id":"mt_a6m7PqTuJN","s":"English","d":"Phonics & Word Reading","n":"R-Controlled Vowel Sounds","desc":"Read and spell words containing r-controlled vowels (ar, er, ir, ur, or, ore) and vowel-r patterns where 'r' modifies the vowel sound","a":[5,6],"ev":["Read words with r-controlled vowels (e.g. 'car', 'bird', 'fork', 'her')","Recognise that 'r' changes the vowel sound (e.g. 'cat' vs 'cart')","Spell words with common r-controlled patterns"],"pre":[["mt_F978c32kDr","Must know single letter sounds before r-controlled vowels","h"]]},{"id":"mt_t1JXeNgKcu","s":"English","d":"Phonics & Word Reading","n":"Reading Contractions","desc":"Read and understand contractions with apostrophes, knowing the apostrophe represents omitted letters","a":[5,6],"ev":["Read common contractions in text (e.g. 'I'm', 'we'll n","s"]]},{"id":"mt_XeMZdf2Y9W","s":"English","d":"Reading Comprehension","n":"Book Features and Author's Reasons","desc":"Identify front cover, back cover, and title page of a book; identify the reasons an author gives to support points in informational text","a":[5,8],"ev":["Point to and name parts of a book (front cover, back cover, title page)","Use the title page to find the title, author, and illustrator","Identify a reason the author gives for a claim in a simple non-fiction text"],"pre":[["mt_1KCwbGvm1F","Print concepts needed to understand book features","h"]]},{"id":"mt_sSQlLOnAow","s":"English","d":"Reading Comprehension","n":"Characters, settings, and events","desc":"Identify characters, settings, and major events in stories; become familiar with key stories, fairy tales, and traditional tales and retell them with key details in sequence","a":[5,8],"ev":["Name the main characters in a story","Describe where and when a story takes place","Retell a familiar story including beginning, middle, and end events"],"pre":[["mt_mLPEMpYb_R","Need to engage with stories before identifying elements","h"]]},{"id":"mt_GLY3R3YSlf","s":"English","d":"Reading Comprehension","n":"Comparing Characters Across Stories","desc":"Compare and contrast the adventures and experiences of characters in familiar stories; identify similarities and differences between two texts on the same topic","a":[5,9],"ev":["Identify what two stories have in common (e.g. 'Both have a bear character')","Compare information from two books about the same topic","Discuss how characters' experiences are similar or different across stories"],"pre":[["mt_32B7xjUPwF","Comparing and contrasting characters or texts draws on the universal habit of connecting new ideas to existing knowledge","s"],["mt_aFvsj35QzC","Informational text knowledge supports comparison","s"],["mt_ggcamLzXAy","Comparing characters' adventures and reactions in stories is enriched by the foundational SEL understanding that the same event can make different people feel differently","s"],["mt_sSQlLOnAow","Need story elements to compare texts","h"],["mt_wvcFlwOrDl","Identifying patterns and similarities across texts is the reading form of the universal pattern-recognition habit","s"]]},{"id":"mt_5n-O41lUgn","s":"English","d":"Reading Comprehension","n":"Connecting reading to experience","desc":"Link what is read or heard to own experiences; draw on background knowledge and vocabulary to support understanding of texts","a":[5,7],"ev":["Make text-to-self connections (e.g. 'This reminds me of when I...')","Use personal experience to understand a character's feelings","Relate events in a story to own life to deepen comprehension"],"pre":[["mt_LE7nFEwS12","Linking reading to own experiences is the English-domain application of the universal prior-knowledge activation habit","s"],["mt_mLPEMpYb_R","Personal connection emerges from comprehension","s"],["mt_scBgiMKhG_","Linking reading to personal experience depends on approaching reading as a meaning-making activity","s"]]},{"id":"mt_gZIo5oiBMt","s":"English","d":"Reading Comprehension","n":"Different Types of Texts","desc":"Recognise common types of texts (storybooks, poems, non-fiction); name the author and illustrator and define the role of each in telling or presenting a text","a":[5,7],"ev":["Distinguish between a story, a poem, and a non-fiction book","Point to and name the author and illustrator on the cover","Explain that the author writes the words and the illustrator makes the pictures"],"pre":[["mt_mLPEMpYb_R","Listening comprehension supports text type awareness","s"]]},{"id":"mt_thsY1ZesaU","s":"English","d":"Reading Comprehension","n":"Discussing Texts as a Group","desc":"Participate in discussions about what is read, taking turns and listening to others; explain understanding clearly; actively engage in group reading activities","a":[5,10],"ev":["Share ideas about a book in a group discussion","Listen to and respond to others' opinions about a BhYJZUsErp","s":"English","d":"Spelling & Word Study","n":"Segmenting words into sounds","desc":"Segment spoken words into phonemes and spell CVC and simple phonetically regular words by writing a letter or letters for each sound","a":[4,7],"ev":["Write CVC words from dictation (e.g. 'cat', 'bed', 'hot')","Segment words into individual sounds before choosing letters to write","Spell simple words phonetically drawing on sound-letter knowledge"],"pre":[["mt_EqXlZfB4jp","Segmenting words into phonemes and spelling CVC words requires knowing 'phoneme', 'segment', and 'CVC' as defined terms","h"],["mt_F978c32kDr","Need GPC knowledge to encode phonemes","h"],["mt_PvU3eoikev","Need segmenting skill for spelling","h"],["mt_WBfj79OqXz","Handwriting needed for spelling practice","s"]]},{"id":"mt_AhfyJoTQtY","s":"English","d":"Spelling & Word Study","n":"Spelling from Dictation","desc":"Write simple sentences from memory when dictated by the teacher, applying taught GPCs, spelling rules, and common exception words","a":[5,8],"ev":["Write a dictated sentence using phonically plausible spellings","Include correct spelling of taught exception words in dictation","Apply sentence punctuation in dictated writing"],"pre":[["mt_BhYJZUsErp","Dictation requires spelling ability","h"],["mt_EqXlZfB4jp","Applying taught GPCs in dictation requires understanding what a GPC is","h"],["mt_Jq0MjURrRC","Exception words appear in dictation","s"],["mt_QEr24lqzvH","Dictation requires punctuation knowledge","h"]]},{"id":"mt_QdMMLRYWhn","s":"English","d":"Spelling & Word Study","n":"Spelling Verb Endings","desc":"Spell words with common suffixes (-s/-es for plurals and third person verbs, -ing, -ed, -er, -est) where no change to the root word is needed","a":[5,6],"ev":["Add -s or -es correctly to make plurals (e.g. 'cats', 'boxes')","Spell words with -ing and -ed endings (e.g. 'jumping', 'helped')","Add -er and -est to adjectives (e.g. 'quicker', 'quickest')"],"pre":[["mt_BhYJZUsErp","Must spell root words before adding suffixes","h"],["mt_EqXlZfB4jp","Spelling with suffixes requires knowing 'suffix', 'root word', and understanding how suffixes attach","h"]]},{"id":"mt_zBUcAPDRPM","s":"English","d":"Spelling & Word Study","n":"The Prefix un-","desc":"Spell words using the prefix un- to change meaning; understand that un- creates opposites or reverses actions","a":[5,6],"ev":["Spell words with un- prefix correctly (e.g. 'unhappy', 'unfair', 'undo')","Explain how un- changes the meaning of a word","Create new words by adding un- to known words"],"pre":[["mt_BhYJZUsErp","Must spell root words before adding prefixes","h"],["mt_EqXlZfB4jp","Spelling with prefixes requires knowing 'prefix' and 'root word' as distinct, named concepts","h"]]},{"id":"mt_Jq0MjURrRC","s":"English","d":"Spelling & Word Study","n":"Tricky words","desc":"Spell common exception words from memory that do not follow regular phonic patterns, including the days of the week","a":[5,8],"ev":["Correctly spell high-frequency irregular words (e.g. 'said', 'the', 'was')","Write all seven days of the week correctly","Recall and write exception words in dictated sentences"],"pre":[["mt_BhYJZUsErp","Phonemic spelling helps as starting strategy","s"],["mt_frDIaXzWbx","Need letter recognition for exception word spelling","h"]]},{"id":"mt_6-MYToNZ39","s":"English","d":"Vocabulary","n":"Discussing and Questioning New Words","desc":"Ask and answer questions about unknown words in texts; discuss word meanings and link new vocabulary to words already known","a":[5,11],"ev":["Ask 'What does ___ mean?' when meeting unfamiliar words during reading","Use context and pictures to work out what a new word might mean","Explain a new word by connecting it to a known word (e.g. 'enormous means really really big')"],"pre":[]},{"id":"mt_VLu59hpQ4T","s":"English","d":"Vocabulary","n":"Shades of Meaning","desc":"Distinguish shades of meaning among verbs describing similar actions and among adjectives differing in intensity; make real-life connections between words and their use","a":[5,9],"ev":["Compare similar verbs by acting them out (e.g. 'walk', 'march', 'strut', 'prance')","Order adjectives by intensity (e.g. big, huge, gigantic)","Connect vocabulary to personal experiences (e.g. note things at school that are 'colourful')"],"pre":[["mt_oL9s_bufDp","Categorisation supports understanding shades of meaning","s"]]},{"id":"mt_oL9s_bufDp","s":"English","d":"Vocabulary","n":"Sorting & Categorising Words","desc":"Sort common objects and words into categories to understand how concepts relate; demonstrate understanding of opposites (antonyms) for common verbs and adjectives","a":[5,8],"ev":["Group words or objects by category (e.g. animals, foods, colours)","Identify and produce opposite pairs (e.g. 'big/small', 'hot/cold', 'go/stop')","Explain why items belong together in a category"],"pre":[["mt_dmNvjroCPT","Sorting and categorising objects uses the same counting/cardinality skills from maths","s"]]},{"id":"mt_NP101Zl-4g","s":"English","d":"Vocabulary","n":"Using New Vocabulary","desc":"Use words and phrases acquired through conversations, being read to, and responding to texts in own speech and writing","a":[5,9],"ev":["Incorporate new vocabulary from read-alouds into conversations","Attempt to use interesting or topic-specific words in own writing","Use newly learned words appropriately in different contexts"],"pre":[["mt_6-MYToNZ39","Need to understand words before using them","s"]]},{"id":"mt_aw0PldeT_L","s":"English","d":"Vocabulary","n":"Word Parts as Clues","desc":"Use knowledge of common inflections and affixes (-ed, -s, un-, -er) as clues to the meaning of unknown words; understand how the prefix un- changes meaning","a":[5,8],"ev":["Recognise that -ed signals past tense (e.g. 'jumped' = already happened)","Explain how un- makes a word mean the opposite (e.g. 'unhappy' = not happy)","Use word parts to figure out the meaning of an unfamiliar word"],"pre":[["mt_6-MYToNZ39","Context clues support morphological analysis","s"]]},{"id":"mt_OyOYHlZ2_T","s":"English","d":"Writing Composition","n":"Responding to Writing Feedback","desc":"With teacher guidance, re-read own writing aloud to check it sounds right; listen and respond to questions and suggestions from teacher or peers to add detail, clarify meaning, and strengthen writing — this is the scaffolded beginning of writing self-evaluation, not an independent skill","a":[5,7],"ev":["Reread own writing and spot a missing word or unclear sentence","Add a detail in response to a question (e.g. 'Can you tell me more about...?')","Make at least one improvement to a piece based on feedback"],"pre":[["mt_8dstvf-KKb","Re-reading own writing to check it makes sense is the writing-domain form of the universal self-checking habit","s"],["mt_klyw-tdlhP","Noticing when your own writing doesn't make sense requires the universal comprehension-monitoring habit applied to one's own text","s"],["mt_nDAcXoPa0c","Need writing to revise","s"],["mt_o8ciHks8t2","Re-reading and responding to feedback is more effective when pupils know terms like 'revise', 'edit', and 'meaning'","s"],["mt_U_8iVFZuHH","Re-reading your own writing to check it makes sense and has the intended effect is the practical application of the writing self-evaluation habit","s"]]},{"id":"mt_PJyCGJz5Hv","s":"English","d":"Writing Composition","n":"Saying Sentences Before Writing Them","desc":"Say out loud what is going to be written; compose sentences orally before writing them down as preparation for independent writing","a":[5,6],"ev":["Say a complete sentence aloud before attempting to write it","Rehearse a sentence orally more than once to hold it in memory","Practise sentences with a partner before writing independently"],"pre":[["mt_4A7FYmvVhA","Oral description supports oral rehearsal","s"],["mt_N8CpN1EJrP","Need to understand sentences for oral rehearsal","h"],["mt_o8ciHks8t2","Oral composition requires vocabulary like 'compose', 'sentence', and 'sequence' to participate meaningfully in the exercise","h"]]},{"id":"mt_4A4RpX-Go9","s":"English","d":"Writing Composition","n":"Shared Research Projects","desc":"Participate in shared research and writing projects; recall information from experiences or gather information from sources to answer a question","a":[5,9],"ev":["Contribute ideas and information to a class writing project","Draw or write facts learned from personal experience about a topic","Help gather information from books or adults for a group research task"],"pre":[["mt_mLPEMpYb_R","Listening comprehension supports shared research","s"],["mt_o8ciHks8t2","Shared research and writing uses 'genre', 'purpose', 'audience', 'plan', and 'draft' vocabulary","s"]]},{"id":"mt_nYU6x2E2T8","s":"English","d":"Writing Composition","n":"Sharing and Publishing Your Writing","desc":"Read own writing aloud clearly enough to be heard by peers and the teacher; use digital tools to produce and publish writing","a":[5,11],"ev":["Read own sentences aloud with clear voice and appropriate expression","Share a piece of writing by reading it to the class","Type simple words or sentences using a computer or tablet"],"pre":[["mt_ZhvwM6LMBL","Reading fluency supports reading aloud own writing","s"]]},{"id":"mt_nDAcXoPa0c","s":"English","d":"Writing Composition","n":"Simple Stories with Beginning and Ending","desc":"Write simple narratives by sequencing sentences to describe events in order; narrate a single event or linked events with a beginning, middle, and ending or reaction","a":[5,7],"ev":["Write a short story with at least three sequenced sentences","Use time words like 'first', 'then', 'next' to order events","Include a reaction or ending to a narrative (e.g. 'I felt happy')"],"pre":[["mt_M5PPDJStGm","Sequencing events in narrative writing draws on the ordinal/sequential thinking developed through counting","s"],["mt_o8ciHks8t2","Writing simple narratives requires 'narrative', 'sequence', 'beginning', 'middle', 'ending' as shared vocabulary","h"],["mt_PJyCGJz5Hv","Oral rehearsal precedes written narrative","h"],["mt_sSQlLOnAow","Story elements from reading inform writing","s"],["mt_WBfj79OqXz","Handwriting needed for written narrative","s"]]},{"id":"mt_91f1XFvGZq","s":"English","d":"Writing Composition","n":"Writing opinions","desc":"Compose opinion pieces using drawing, dictating, or writing that name a topic or book and state a preference or opinion about it","a":[5,7],"ev":["State an opinion clearly (e.g. 'My favourite animal is a dog because...')","Give at least one reason for an opinion","Draw, dictate, or write to express a preference about a book or topic"],"pre":[["mt_o8ciHks8t2","Opinion writing requires knowing the genre term 'opinion' and understanding audience and purpose","h"],["mt_PJyCGJz5Hv","Oral rehearsal precedes opinion writing","h"]]},{"id":"mt_o8ciHks8t2","s":"English","d":"Writing Composition","n":"Writing Process Vocabulary","desc":"Know and use the vocabulary of the writing process — compose, plan, draft, revise, edit, proofread, genre, audience, purpose, narrative, recount, instruction, paragraph, sequence, and detail — and understand that these words describe distinct steps and decisions that all writers make, not just tasks to tick off","a":[5,8],"ev":["Use 'compose', 'revise', and 'edit' correctly when describing the stages of writing","Explain who the 'audience' is for a piece of writing and how that changes what they write","Describe the purpose of a piece of writing (to persuade, inform, entertain, or instruct) and match their language to it"],"pre":[]},{"id":"mt__MDiDU9Vck","s":"English","d":"Writing Composition","n":"Writing to inform","desc":"Compose informative or explanatory texts using drawing, dictating, or writing that name a topic and supply some information about it","a":[5,7],"ev":["Write or dictate two or three facts about a familiar topic","Label diagrams or drawings with informative details","Name a topic and provide relevant details about it"],"pre":[["mt_o8ciHks8t2","Informative writing requires knowing 'genre', 'audience', 'purpose', and 'detail' as concepts","h"],["mt_PJyCGJz5Hv","Oral rehearsal precedes informative writing","h"]]},{"id":"mt_IR8kIjZn_V","s":"History","d":"Ancient Egypt","n":"Discovering Tutankhamun's Tomb","desc":"Understand that we know about ancient Egypt because archaeologists have dug up and studied objects buried in the sand for thousands of years — and that one of the most exciting discoveries ever was when Howard Carter found the hidden tomb of Tutankhamun in 1922, filled with golden treasures","a":[5,7],"ev":["Explain that archaeologists find and study old objects to learn about people who lived long ago","Retell the story of Howard Carter discovering Tutankhamun's tomb","Understand that discoveries like this help us learn about how ancient Egyptians lived and what they believed"],"pre":[["mt_bKlnc7dyVK","Archaeologists studying Egypt parallels palaeontologists studying fossils — both are scientists uncovering the past","s"],["mt_bvxkT1nepy","Carter's discovery of tomb treasures benefits from knowing about afterlife beliefs","s"],["mt_mmudyxf7bT","Howard Carter's discovery is about finding a tomb inside a pyramid/valley context","s"],["mt_szw1Ln490b","Understanding how we know about Egypt requires 'archaeologist' and 'artefact' vocabulary","h"]]},{"id":"mt_bvxkT1nepy","s":"History","d":"Ancient Egypt","n":"Egyptian Gods and the Afterlife","desc":"Understand that the ancient Egyptians believed in many gods and goddesses and believed that life continued after death in a wonderful afterlife — which is why they took great care to prepare bodies and fill tombs with food, jewellery, and precious objects for the dead person to use","a":[5,7],"ev":["Explain that ancient Egyptians worshipped many different gods and goddesses","Describe the basic belief that Egyptians thought life continued after death","Give a reason why tombs were filled with treasures and everyday objects"],"pre":[["mt_mmudyxf7bT","Gods and afterlife connect to pyramids as burial places","s"],["mt_szw1Ln490b","Describing the afterlife and burial beliefs requires 'mummy', 'sarcophagus', 'tomb' vocabulary","h"]]},{"id":"mt_8UL1opbJEt","s":"History","d":"Ancient Egypt","n":"Egypt, the Nile, and the Desert","desc":"Locate Egypt on a map of Africa and understand that it is a country in a very hot, dry desert, but the River Nile — the longest river in the world — flows through it, bringing water and rich soil that allowed people to grow food and build one of the earliest great civilisations","a":[5,7],"ev":["Point to Egypt on a map and identify the River Nile running through it","Explain why the Nile was so important to the ancient Egyptians (water, food, transport)","Describe how the desert and the river created two very different environments side by side"],"pre":[]},{"id":"mt_P0HBNfp46z","s":"History","d":"Ancient Egypt","n":"Everyday Life in Ancient Egypt","desc":"Describe what everyday life was like for ordinary people in ancient Egypt: farmers grew wheat and barley near the Nile, families lived in mud-brick houses, children played games and had pets, and people ate bread, fish, fruit, and vegetables","a":[5,7],"ev":["Describe at least two things ordinary Egyptian families did in their daily lives","Name foods that ancient Egyptians ate or crops they grew","Identify at least one similarity and one difference between life in ancient Egypt and life today"],"pre":[["mt_8UL1opbJEt","Daily life context benefits from knowing Egypt is on the Nile in a desert","s"]]},{"id":"mt_iFkd0CTwlA","s":"History","d":"Ancient Egypt","n":"Hieroglyphs and Papyrus","desc":"Know that the ancient Egyptians used a special writing system called hieroglyphs — pictures and symbols that stood for sounds and words — and that they wrote on a paper-like material called papyrus, which was made from a plant that grew along the Nile","a":[5,7],"ev":["Describe hieroglyphs as a writing system that uses pictures and symbols","Explain that papyrus was a material like paper made from a river plant","Understand that only specially trained people called scribes could read and write hieroglyphs"],"pre":[["mt_frDIaXzWbx","Understanding that letters are symbols representing sounds provides a framework for grasping how hieroglyphs encode language differently","s"],["mt_P0HBNfp46z","Scribes are a special job — helps to know about daily life first","s"],["mt_szw1Ln490b","Understanding hieroglyphs and papyrus requires these exact terms","h"]]},{"id":"mt_E7avIa-tcE","s":"History","d":"Ancient Egypt","n":"Pharaohs and Tutankhamun","desc":"Know that ancient Egypt was ruled by powerful kings and queens called pharaohs, who lived in grand palaces and made the laws — and that one of the most famous pharaohs is Tutankhamun, a boy who became pharaoh as a child and whose golden tomb was discovered thousands of years later","a":[5,7],"ev":["Explain that a pharaoh was the ruler of ancient Egypt, like a king or queen","Name Tutankhamun as a famous pharaoh and describe at least one fact about him","Understand that pharaohs were very powerful and made important decisions for everyone in Egypt"],"pre":[["mt_szw1Ln490b","Knowing about pharaohs requires the term 'pharaoh' and associated vocabulary","h"]]},{"id":"mt_mmudyxf7bT","s":"History","d":"Ancient Egypt","n":"Pyramids and the Great Sphinx","desc":"Know that the ancient Egyptians built enormous stone pyramids as tombs for the pharaohs, that the Great Pyramid at Giza was one of the Seven Wonders of the Ancient World and is still standing today, and that the Great Sphinx — a statue with a lion's body and a human head — guards the pyramids","a":[5,7],"ev":["Explain that pyramids were built as tombs to protect the pharaoh's body for the afterlife","Describe the Great Pyramid as very large, very old, and still standing at Giza","Describe the Sphinx as a stone statue with a lion's body and a human head"],"pre":[["mt_E7avIa-tcE","Pyramids as tombs benefit from knowing pharaohs were powerful rulers","s"],["mt_Qcp2d_kuta","Recognising pyramids as a named 3D geometric shape makes study of the Great Pyramid's physical structure more concrete","s"],["mt_szw1Ln490b","Describing the pyramids and Sphinx requires 'pyramid', 'sphinx', and related vocabulary","h"]]},{"id":"mt_szw1Ln490b","s":"History","d":"Ancient Egypt","n":"Vocabulary: ancient egypt","desc":"Know and use the key vocabulary of ancient Egypt — pharaoh, pyramid, tomb, mummy/mummification, hieroglyphs, papyrus, sarcophagus, canopic jar, natron, archaeologist, artefact, Nile, delta, irrigation, shaduf, scribe, vizier, obelisk, sphinx, cartouche — and apply these terms accurately when describing Egyptian society, religion, and material culture","a":[5,9],"ev":["Use 'pharaoh', 'pyramid', and 'hieroglyphs' correctly and naturally in a spoken or written account of ancient Egypt","Explain what mummification is and why the Egyptians did it, using 'sarcophagus', 'canopic jar', and 'natron'","Use 'archaeologist' and 'artefact' correctly when discussing how we know about ancient Egypt"],"pre":[]},{"id":"mt_mMMXD4v9Sh","s":"History","d":"Ancient Greece & Rome","n":"Ancient Greece and Rome on the Map","desc":"Locate Greece and Italy on a map and know they are countries around the Mediterranean Sea where two great ancient civilisations — Ancient Greece and Ancient Rome — grew up thousands of years ago, long after the ancient Egyptians but long before our time","a":[5,7],"ev":["Point to Greece and Italy on a world map or globe","Say that Ancient Greece and Ancient Rome were around the Mediterranean Sea","Place Greece and Rome on a simple timeline after Ancient Egypt and before today"],"pre":[["mt_8UL1opbJEt","Greece & Rome geography builds on Ancient Egypt geography — both Mediterranean civilisations, Egypt came first chronologically","s"]]},{"id":"mt_19qy2uuaKp","s":"History","d":"Ancient Greece & Rome","n":"Ancient life vs today","desc":"Compare how children in ancient Greece or Rome lived with how children live today — including differences in school (writing on wax tablets, learning to fight in Sparta), food (olives, bread, grapes), games, and clothing (tunics and sandals) — and understand these civilisations existed thousands of years ago","a":[5,7],"ev":["Name two ways a child's life in ancient Greece or Rome was different from today","Describe what ancient Greek or Roman children might have eaten or worn","Say that these civilisations existed thousands of years ago — long before grandparents were born"],"pre":[["mt_mMMXD4v9Sh","Comparing ancient life needs knowing where/when these civilisations were","h"],["mt_P0HBNfp46z","Comparing ancient lives benefits from prior exposure to Egyptian daily life comparison","s"]]},{"id":"mt_H1pAi4F_Oh","s":"History","d":"Ancient Greece & Rome","n":"Greek gods & Mount Olympus","desc":"Know that the ancient Greeks believed in many gods and goddesses who lived on Mount Olympus — including Zeus (king of the gods, thunder), Athena (wisdom), Poseidon (the sea), Hermes (messages), and Aphrodite (love) — and that each god had special powers and a role in the world","a":[5,7],"ev":["Name at least three Greek gods and say what each one was god of","Say that the Greek gods were believed to live on Mount Olympus","Explain that the ancient Greeks prayed to different gods for different things"],"pre":[["mt_bvxkT1nepy","Greek gods build on prior understanding that ancient civilisations believed in many gods (Egyptian polytheism)","s"],["mt_mMMXD4v9Sh","Knowing where Greece is grounds understanding of Greek gods","h"]]},{"id":"mt_PhIZNl2230","s":"History","d":"Ancient Greece & Rome","n":"Greek Myths and Heroes","desc":"Retell at least one Greek myth involving a hero and a monster — such as Theseus and the Minotaur in the labyrinth, Heracles (Hercules) and the lion, or Perseus and Medusa — and understand that these were stories ancient Greeks told to explain the world and teach lessons","a":[5,7],"ev":["Retell a Greek myth naming the hero, the monster, and what happened","Explain that myths were stories the ancient Greeks told to make sense of the world","Describe what made a Greek hero brave or clever in the story"],"pre":[["mt_H1pAi4F_Oh","Hero myths reference the gods (Heracles is Zeus's son, Athena helps Perseus)","h"]]},{"id":"mt_VjxyJLtIbT","s":"History","d":"Ancient Greece & Rome","n":"Roman soldiers & builders","desc":"Know that Roman soldiers marched across a huge empire building straight roads and strong walls, and that some Roman roads, walls, and buildings can still be seen today — showing that the Romans were powerful builders whose work has lasted thousands of years","a":[5,7],"ev":["Describe Roman soldiers as part of a powerful army that marched across an empire","Name something the Romans built that we can still see today such as roads or walls","Explain that Roman buildings and roads lasted because the Romans were skilled builders"],"pre":[["mt_mMMXD4v9Sh","Roman builders need geographic context","h"],["mt_zh_RyesCgZ","Roman soldiers build on knowing Rome exists as a civilisation","s"]]},{"id":"mt_zh_RyesCgZ","s":"History","d":"Ancient Greece & Rome","n":"Romulus & Remus","desc":"Know the Roman founding myth of Romulus and Remus — twin brothers abandoned as babies, raised by a she-wolf, who grew up to found the city of Rome — and understand that this is a legend the Romans told about how their city began","a":[5,7],"ev":["Retell the story of Romulus and Remus being raised by a wolf","Say that Romulus founded the city of Rome","Explain that this is a legend — a story people told, not necessarily true"],"pre":[["mt_mMMXD4v9Sh","Romulus & Remus needs geographic context of Italy/Rome","h"]]},{"id":"mt_bKV2JYNwf7","s":"History","d":"Ancient Greece & Rome","n":"The first Olympics","desc":"Know that the Olympic Games began in ancient Greece at a place called Olympia as athletic competitions held in honour of Zeus, and that the modern Olympic Games we watch today were inspired by those ancient games","a":[5,7],"ev":["Say that the Olympic Games started in ancient Greece at Olympia","Name at least one sport or event from the ancient Olympics such as running or wrestling","Explain that today's Olympic Games got the idea from the ancient Greek ones"],"pre":[["mt_H1pAi4F_Oh","Olympics were held in honour of Zeus","s"],["mt_mMMXD4v9Sh","Olympics need geographic context of ancient Greece","h"]]},{"id":"mt_2DBPJ38iWl","s":"History","d":"Medieval Times","n":"Kings & Queens","desc":"What medieval kings and queens did: ruling the land, making laws, collecting taxes; the crown and throne as symbols of power; the Tower of London","a":[5,7],"ev":["Explain what a medieval king or queen did (ruled, made laws, led armies, collected taxes)","Describe at least one symbol of royal power (crown, throne, sceptre)","Name one famous medieval monarch or describe the Tower of London's role"],"pre":[["mt_M_xcaRcvSo","Knights served kings — understanding knights helps grasp royal power","s"],["mt_oN7fI4d_kU","Castles as royal residences provide context for understanding kings and queens","h"]]},{"id":"mt_M_xcaRcvSo","s":"History","d":"Medieval Times","n":"Knights & Armour","desc":"What knights were: trained warriors who served a lord; armour, shields, swords, and lances; the code of chivalry as rules for how knights should behave","a":[5,7],"ev":["Describe what a knight wore and carried (armour, helmet, shield, sword, lance)","Explain that knights trained from a young age and served a lord","Name one rule of the code of chivalry (be brave, be honest, protect the weak)"],"pre":[["mt_oN7fI4d_kU","Castles provide the physical context for understanding knights who lived and served in them","h"]]},{"id":"mt_R1xLS1c2Pg","s":"History","d":"Medieval Times","n":"Medieval Clothing","desc":"What people wore in medieval times: peasant clothes (wool, linen) vs noble clothes (silk, fur, bright colours); no zippers or buttons; how clothes showed your place in society","a":[5,7],"ev":["Describe what a medieval peasant would typically wear","Explain how noble clothing was different from peasant clothing","Give one way that what you wore showed your place in society"],"pre":[["mt_PThM5P7Umd","Must understand medieval daily life before examining clothing as social marker","h"]]},{"id":"mt_2NKzPeLzIm","s":"History","d":"Medieval Times","n":"Medieval Food & Feasts","desc":"What people ate in medieval times: bread and pottage for ordinary people, grand feasts for the rich; no forks, eating with hands; the great hall as the centre of castle life","a":[5,7],"ev":["Describe what ordinary people ate most days (bread, pottage, vegetables, ale)","Explain how a feast in a great hall was different from everyday meals","Name one surprising table manner from medieval times (no forks, shared cups, food thrown on the floor)"],"pre":[["mt_PThM5P7Umd","Must understand daily village life before exploring food and feasting customs","h"]]},{"id":"mt_0FYFiLTqx4","s":"History","d":"Medieval Times","n":"Robin Hood & King Arthur","desc":"The legends of Robin Hood (Sherwood Forest, stealing from the rich, Merry Men) and King Arthur (Round Table, Excalibur, Camelot); that these are stories, not proven history, but reflect medieval values","a":[5,7],"ev":["Retell the basic story of Robin Hood or King Arthur","Name at least two characters from one of these legends","Explain that these are legends (stories) rather than proven facts"],"pre":[["mt_2DBPJ38iWl","Knowing about kings enriches Robin Hood and King Arthur stories","s"],["mt_M_xcaRcvSo","Knight knowledge enriches understanding of King Arthur legends","s"]]},{"id":"mt_X5fdB4haHf","s":"History","d":"Medieval Times","n":"The Vikings","desc":"Who the Vikings were: seafaring warriors and traders from Scandinavia; longships; Viking raids on Britain; that Vikings also settled and farmed","a":[5,7],"ev":["Describe who the Vikings were and where they came from","Explain what made longships special (fast, could sail in shallow water, dragon prows)","State that Vikings were not just raiders but also farmers, traders, and settlers"],"pre":[]},{"id":"mt_PThM5P7Umd","s":"History","d":"Medieval Times","n":"Village Life","desc":"Daily life for ordinary people in a medieval village: thatched houses, farming, baking bread, fetching water; how different life was from today","a":[5,7],"ev":["Describe what a typical medieval village looked like (thatched cottages, fields, church)","Name at least three daily tasks a medieval villager would do","Give two differences between life in a medieval village and life today"],"pre":[["mt_oN7fI4d_kU","Castle knowledge provides contrast with village life","s"]]},{"id":"mt_oN7fI4d_kU","s":"History","d":"Medieval Times","n":"What Is a Castle?","desc":"What a castle is: a fortified building used as both a home and a defence; key parts including towers, moat, drawbridge, and thick walls; why castles were built","a":[5,7],"ev":["Name at least four parts of a castle (tower, moat, drawbridge, walls, gatehouse)","Explain that castles were both homes and defences","Describe why someone in medieval times would need a castle"],"pre":[]},{"id":"mt_mvXufozy2s","s":"Learning to Learn","d":"Learning to Learn","n":"Asking for Help","desc":"Ask for help when you've had a go yourself and are still stuck — knowing when to ask is a skill in itself","a":[5,6],"ev":["Hattie visible learning","self-regulated learning research"],"pre":[]},{"id":"mt_8dstvf-KKb","s":"Learning to Learn","d":"Learning to Learn","n":"Checking Your Own Work","desc":"After finishing a task, look back at what you did and ask yourself: does this seem right?","a":[5,6],"ev":["After finishing a piece of work, re-read or review it without being asked to","Spot and correct at least one error in their own work by checking back through it","Describe what they checked for — e.g. 'I re-read each line to make sure my answers matched the question'"],"pre":[]},{"id":"mt_S4G6GLKr1-","s":"Learning to Learn","d":"Learning to Learn","n":"Persisting When It's Hard","desc":"Keep trying when something feels hard — making mistakes and trying again is how learning happens","a":[5,6],"ev":["Keep working on a difficult task for a sustained period without giving up or asking someone else to do it","After making a mistake, try again with a different approach rather than saying 'I can't do it'","Talk about difficulty positively — e.g. 'This is hard but I'm getting better' rather than 'I'm no good at this'"],"pre":[]},{"id":"mt_SbEaQnMQoD","s":"Life Skills","d":"Entrepreneurship","n":"Buyers & Sellers","desc":"When someone makes or has something, they can sell it; when someone wants something, they can buy it; introduction to the concept of exchange and transactions","a":[5,7],"ev":["Explain what a buyer does and what a seller does","Act out a simple buying and selling transaction with a partner","Describe a time they or a family member bought something from a person (market stall, car boot sale, bake sale)"],"pre":[["mt_RgQxPddV8v","Must understand goods and services before grasping buying and selling","h"],["mt_SsS7GptD_o","Cross-domain: understanding what money is (Money & Finance) supports grasping exchange","s"]]},{"id":"mt_RgQxPddV8v","s":"Life Skills","d":"Entrepreneurship","n":"Goods & Services","desc":"Some people make things (goods) and some people do things for others (services); recognising both in everyday life and understanding that both have value","a":[5,7],"ev":["Sort a set of pictures into goods (things you can touch) and services (things people do for you)","Give three examples of goods and three examples of services from their everyday life","Explain that both making things and helping people are valuable kinds of work"],"pre":[]},{"id":"mt_CrGnpVjnk8","s":"Life Skills","d":"Entrepreneurship","n":"Making Something to Sell","desc":"The experience of creating a product to sell — a craft, a drawing, baked goods; what makes something worth buying; pride in making something others want","a":[5,7],"ev":["Create a simple product (craft, drawing, baked item) that could be sold","Explain what makes their product good enough for someone to want to buy it","Suggest a fair price for their product and give a reason"],"pre":[["mt__ab4knIaSL","Cross-domain: needs vs wants (Money & Finance) helps understand what makes a product desirable","s"],["mt_RgQxPddV8v","Must know what goods are before creating a product to sell","h"],["mt_SbEaQnMQoD","Must understand exchange before making something to sell","h"]]},{"id":"mt_vpMDMbx4pc","s":"Life Skills","d":"Entrepreneurship","n":"Who Is a Customer?","desc":"Understanding that a customer is someone who buys what you make or do; thinking about what customers want and need; the idea that businesses serve people","a":[5,7],"ev":["Define what a customer is in their own words","Suggest what a customer might look for when deciding whether to buy something (quality, price, looks nice)","Explain why it matters to think about what the customer wants, not just what you want to make"],"pre":[["mt_CrGnpVjnk8","Making a product helps understand what customers want","s"],["mt_SbEaQnMQoD","Must understand buyers and sellers before exploring customer concept in depth","h"]]},{"id":"mt_RNRymbz5SO","s":"Life Skills","d":"Money & Finance","n":"Buying Things","desc":"How buying and selling works: prices, paying for items, receiving change; the basic transaction process in shops and markets","a":[5,7],"ev":["Explain what happens when you buy something in a shop (choose, pay, get change)","Read a price label and say whether they have enough money to buy the item","Act out a simple buying scenario using real or play coins"],"pre":[["mt_FIkqA0qhnj","Must recognise coins/notes and their values before practising buying transactions","h"],["mt_SsS7GptD_o","Must understand money as exchange medium before practising transactions","h"]]},{"id":"mt_FIkqA0qhnj","s":"Life Skills","d":"Money & Finance","n":"Coins & Notes","desc":"Recognising common coins and notes, knowing their values, and understanding that different combinations can make the same amount","a":[5,7],"ev":["Sort a handful of mixed coins into groups by value","State the value of common coins and notes when shown them","Find two different ways to make the same amount using different coins"],"pre":[["mt_cPZwlUk8Nd","Curriculum coins/notes recognition (Maths Y1) underpins exploratory coin knowledge","s"],["mt_SsS7GptD_o","Must understand what money is before learning to recognise specific coins and notes","h"]]},{"id":"mt_asRwlPZXC3","s":"Life Skills","d":"Money & Finance","n":"Jobs People Do","desc":"Different kinds of work people do; that people earn money by working; how jobs help the community; linking personal interests to possible jobs","a":[5,7],"ev":["Name at least five different jobs and describe what each person does","Explain that people get paid money for the work they do","Connect a personal interest to a job (e.g. 'I like animals so I could be a vet')"],"pre":[["mt_SsS7GptD_o","Understanding money as exchange helps connect jobs to earning","s"]]},{"id":"mt_FNSeo9_T2Z","s":"Life Skills","d":"Money & Finance","n":"Looking After Money","desc":"Keeping money safe; not losing coins or notes; understanding that money has real value and should be treated carefully; basic money responsibility","a":[5,7],"ev":["Describe at least two ways to keep money safe (purse, wallet, money box, giving to a grown-up)","Explain why it matters if you lose money","Show that they treat real coins and notes carefully rather than leaving them lying around"],"pre":[["mt_FIkqA0qhnj","Must know what coins and notes are before learning to look after them","h"]]},{"id":"mt__ab4knIaSL","s":"Life Skills","d":"Money & Finance","n":"Needs & Wants","desc":"The difference between things we need (food, shelter, clothing) and things we want (toys, treats); that we sometimes have to choose because money is limited","a":[5,7],"ev":["Sort a set esenting subtraction with objects/drawings requires understanding what subtraction means","h"]]},{"id":"mt_zuKAX6lcYR","s":"Mathematics","d":"Addition & Subtraction","n":"Subtraction as taking away or separating","desc":"Understand subtraction as taking away or separating from a group to find how many remain","a":[4,6],"ev":["Model 'taking away' with physical objects and say how many remain","Act out a 'take from' situation (e.g. 5 biscuits, eat 2, how many left?)","Explain that subtraction means finding how many are left"],"pre":[["mt_dmNvjroCPT","Understanding subtraction as taking away requires knowing numbers represent quantities (cardinality)","h"]]},{"id":"mt_mr_Vk7FGzK","s":"Mathematics","d":"Addition & Subtraction","n":"Adding and subtracting","desc":"Add and subtract one-digit and two-digit numbers to 20, including zero","a":[5,6],"ev":["Calculate 14 + 5 = 19","Calculate 17 – 3 = 14","Add or subtract 0 and explain the result stays the same"],"pre":[["mt_s2mfRBoTal","Adding/subtracting to 20 procedurally requires knowing the number bonds","h"]]},{"id":"mt_VAWV_l7J0D","s":"Mathematics","d":"Addition & Subtraction","n":"Early Word Problems","desc":"Solve one-step word problems involving addition and subtraction to 20, including missing-number problems","a":[5,7],"ev":["Solve 'I have 12 sweets and eat 4, how many left?'","Solve missing number: 7 = [ ] – 9","Solve problems using concrete objects and pictorial representations"],"pre":[["mt_mr_Vk7FGzK","Word problems to 20 require the procedural ability to add/subtract to 20","h"],["mt_yJmvUCCym7","Word problems to 20 extend from word problems within 10 — same problem structures at a higher range","s"]]},{"id":"mt_ghF3Vv6taM","s":"Mathematics","d":"Addition & Subtraction","n":"Fluent adding and subtracting within 5","desc":"Fluently add and subtract within 5","a":[5,6],"ev":["Answer 2 + 3 quickly without counting on fingers","Answer 5 – 2 from recall or with minimal counting","Complete a set of within-5 addition/subtraction facts accurately and quickly"],"pre":[["mt_OvyoRo47K-","Fluency with addition within 5 requires understanding addition as combining","h"],["mt_zuKAX6lcYR","Fluency with subtraction within 5 requires understanding subtraction as taking away","h"]]},{"id":"mt_s2mfRBoTal","s":"Mathematics","d":"Addition & Subtraction","n":"Number bonds","desc":"Recall number bonds (addition and related subtraction facts) within 20","a":[5,6],"ev":["Quickly recall that 8 + 5 = 13","Given 13 – 5, respond 8 using knowledge of related addition fact","Know all pairs of single-digit numbers that sum to numbers up to 20"],"pre":[["mt_e8CZ7E5qW7","Number bonds within 20 builds on knowing bonds to 10","h"],["mt_ghF3Vv6taM","Recalling bonds within 20 builds on fluency within 5","h"]]},{"id":"mt_8RmpkDxT9L","s":"Mathematics","d":"Addition & Subtraction","n":"Reading +, −, and = symbols","desc":"Read, write, and interpret the symbols +, −, and = in number sentences","a":[5,6],"ev":["Read 3 + 2 = 5 aloud as 'three plus two equals five'","Write a number sentence to match a concrete addition situation","Interpret the = sign as 'is the same as' rather than just 'the answer is'"],"pre":[["mt_fR0UtsSREU","Writing number sentences requires reading and writing numerals","h"],["mt_OvyoRo47K-","Reading/writing the + symbol requires understanding what addition means","h"],["mt_zuKAX6lcYR","Reading/writing the − symbol requires understanding what subtraction means","h"]]},{"id":"mt__h7hvT4tEb","s":"Mathematics","d":"Counting & Cardinality","n":"Comparing groups: more or fewer","desc":"Compare two groups of objects to determine which has more, fewer, or whether they are equal, using matching and counting strategies","a":[4,6],"ev":["Use one-to-one matching to compare two groups","State which group has more/fewer after counting both","Use the language 'equal to', 'more than', 'less than', 'fewer', 'most', 'least'"],"pre":[["mt_yqAL6O5i_v","Counting a set helps when comparing groups, but younger children (GB age 4) can compare using matching without formal counting to 20","s"]]},{"id":"mt_dmNvjroCPT","s":"Mathematics","d":"Counting & Cardinality","n":"How Many in Total?","desc":"Cardinality principle: the last number said when counting a set tells how many objects are in the set, regardless of arrangement or order counted","a":[4,6],"ev":["After counting a set, answer 'how many?' with the last number stated","Understand that rearranging objects does not change the count","Understand that counting in a different order gives the same total"],"pre":[["mt_WcfaSfVT33","Cardinality principle builds on one-to-one correspondence — you must count correctly to know the last number tells 'how many'","h"]]},{"id":"mt_sYpKWbq5ra","s":"Mathematics","d":"Counting & Cardinality","n":"One More Each Time","desc":"Each successive counting number represents a quantity that is one larger than the previous number","a":[4,6],"ev":["Given a set of 5, know that adding one object makes 6","Explain that 8 is one more than 7","Given a number, identify one more and one less"],"pre":[["mt_dmNvjroCPT","Understanding 'one more/one less' requires understanding that each number represents a quantity (cardinality)","h"]]},{"id":"mt_WcfaSfVT33","s":"Mathematics","d":"Counting & Cardinality","n":"One-to-one counting","desc":"One-to-one correspondence when counting objects: each object is paired with exactly one number name","a":[4,6],"ev":["Point to or touch each object exactly once while saying number names","Do not skip objects or double-count when counting a set","Recognise an error when someone counts an object twice"],"pre":[]},{"id":"mt_pAcaehday5","s":"Mathematics","d":"Counting & Cardinality","n":"Representing numbers with objects","desc":"Represent numbers using objects, pictorial representations, and the number line","a":[4,6],"ev":["Show a given number using counters, cubes, or fingers","Draw a pictorial representation of a quantity (e.g. tally marks, dots)","Locate a number on a number rals"],"pre":[["mt__h7hvT4tEb","Comparing written numerals is the symbolic form of comparing quantities — conceptual comparison helps but isn't strictly required","s"]]},{"id":"mt_xppl18avyY","s":"Mathematics","d":"Data & Statistics","n":"Sorting into categories","desc":"Classify objects into given categories, count the number in each category, and sort the categories by count","a":[5,6],"ev":["Sort a set of shapes by colour and count how many in each group","Sort objects by size (big/small) and state how many in each category","Identify which category has the most/fewest after sorting and counting"],"pre":[["mt__h7hvT4tEb","Sorting categories by count benefits from ability to compare quantities","s"],["mt_yqAL6O5i_v","Counting objects in each category requires being able to count sets of objects","h"]]},{"id":"mt_g3W0mdADVu","s":"Mathematics","d":"Fractions","n":"Finding halves and quarters (age 5+)","desc":"Recognise, find, and name a quarter as one of four equal parts of an object, shape, or quantity","a":[5,6],"ev":["Fold a shape into four equal parts and identify each as 'a quarter'","Find a quarter of 12 objects by sharing into 4 equal groups","Identify whether a shape has been divided into quarters (four equal parts)"],"pre":[["mt_-hTTat0mBR","Understanding quarters extends from understanding halves — both are equal parts but quarters requires dividing into 4","h"]]},{"id":"mt_-hTTat0mBR","s":"Mathematics","d":"Fractions","n":"What Is a Half?","desc":"Recognise, find, and name a half as one of two equal parts of an object, shape, or quantity","a":[5,6],"ev":["Fold a shape into two equal parts and identify each as 'a half'","Find half of 8 objects by sharing into 2 equal groups","Identify whether a shape has been divided into halves or not (equal vs unequal parts)"],"pre":[["mt_LpSuPgL31x","Finding a half requires equal sharing into 2 groups — a division concept","h"]]},{"id":"mt_KJeEeTutJI","s":"Mathematics","d":"Geometry","n":"2-D shapes","desc":"Recognise and name common 2-D shapes (circles, triangles, rectangles including squares)","a":[4,6],"ev":["Name a triangle, circle, rectangle, and square when shown them","Identify a shape correctly regardless of its size or orientation","Pick out all the triangles from a mixed set of shapes"],"pre":[]},{"id":"mt_Qcp2d_kuta","s":"Mathematics","d":"Geometry","n":"3-D shapes","desc":"Recognise and name common 3-D shapes (cubes, cuboids, pyramids, spheres, cylinders, cones)","a":[4,6],"ev":["Name a cube, sphere, cylinder, and cone when shown them","Identify 3-D shapes in the environment (e.g. a tin is a cylinder)","Recognise a cuboid and a pyramid among a set of solid shapes"],"pre":[]},{"id":"mt_qeZYF6HZ4o","s":"Mathematics","d":"Geometry","n":"Positional Language","desc":"Describe the position of objects using terms such as above, below, beside, in front of, behind, next to","a":[4,6],"ev":["Describe a toy as being 'on top of' the table","Follow instructions like 'put the cube behind the box'","Use 'left' and 'right' in simple contexts"],"pre":[]},{"id":"mt_yGv8doDAmp","s":"Mathematics","d":"Geometry","n":"3-D shapes (age 5+)","desc":"Analyse and compare 2-D and 3-D shapes using informal language to describe sides, vertices, and other attributes","a":[5,6],"ev":["Count the sides and corners of a shape","Compare a triangle and a rectangle by number of sides","Describe a cube as having 'square faces' and 'corners'"],"pre":[["mt_KJeEeTutJI","Analysing and comparing shapes requires being able to name them first","h"],["mt_Qcp2d_kuta","Analysing 3-D shapes requires recognising and naming them","h"]]},{"id":"mt_2VR963szuk","s":"Mathematics","d":"Geometry","n":"Building & Drawing Shapes","desc":"Model shapes by building from components (e.g. sticks and clay balls) and by drawing","a":[5,6],"ev":["Build a triangle from three sticks and three clay balls","Draw a recognisable rectangle","Construct a cube from straws and connectors"],"pre":[["mt_yGv8doDAmp","Modelling shapes by building/drawing requires knowing their attributes (sides, vertices)","h"]]},{"id":"mt_XjwUlmxdCT","s":"Mathematics","d":"Geometry","n":"Combining Simple Shapes","desc":"Compose simple shapes to form larger shapes (e.g. two triangles make a rectangle)","a":[5,6],"ev":["Join two triangles to make a rectangle or larger triangle","Use pattern blocks to fill a hexagon outline","Create a picture or design by combining basic shapes"],"pre":[["mt_KJeEeTutJI","Composing shapes requires recognising the component shapes","h"],["mt_yGv8doDAmp","Composing shapes benefits from understanding shape attributes to know how pieces fit together","s"]]},{"id":"mt_mnEVZNkX3p","s":"Mathematics","d":"Geometry","n":"Flat vs Solid Shapes","desc":"Distinguish two-dimensional (flat) shapes from three-dimensional (solid) shapes","a":[5,6],"ev":["Sort shapes into 'flat' and 'solid' groups","Explain that a circle is flat but a sphere is solid","Identify whether a given shape is 2-D or 3-D"],"pre":[["mt_KJeEeTutJI","Distinguishing 2-D from 3-D requires knowing what 2-D shapes are","h"],["mt_Qcp2d_kuta","Distinguishing 2-D from 3-D requires knowing what 3-D shapes are","h"]]},{"id":"mt_Y9XKzLrUAZ","s":"Mathematics","d":"Geometry","n":"Turns & Directions","desc":"Describe movement and direction, including whole, half, quarter, and three-quarter turns","a":[5,6],"ev":["Follow instructions to move forward, backward, turn left/right","Demonstrate a whole turn, half turn, and quarter turn with their body","Describe a route using directional language"],"pre":[["mt_-hTTat0mBR","Understanding half and quarter turns benefits from the concept of halves and quarters","s"],["mt_qeZYF6HZ4o","Describing movement and turns builds on positional language","h"]]},{"id":"mt_lMz9nAs7VO","s":"Mathematics","d":"Mathematical Thinking","n":"Early Maths Vocabulary","desc":"Use mathematical words carefully when counting, comparing, and describing shapes and positions","a":[5,6],"ev":["Use 'more than', 'fewer than', and 'the same as'  or pictures to represent the situation, and explaining a pathway to the solution","a":[5,6],"ev":["When given a word problem within 10, explain what the problem is asking before attempting to solve","Choose objects, fingers, or drawings to represent a problem situation","After finding an answer, check it makes sense (e.g. re-count objects to verify a total)"],"pre":[["mt_8dstvf-KKb","Checking whether a maths answer makes sense applies the universal self-checking habit to a mathematical context","s"],["mt_dmNvjroCPT","Problem sense-making at 5-6 requires cardinality understanding to make sense of 'how many' problems","s"],["mt_mLPEMpYb_R","Making sense of word problems requires listening comprehension skills","s"],["mt_OvyoRo47K-","Making sense of addition problems requires understanding addition as combining","s"],["mt_S4G6GLKr1-","Mathematical perseverance with problems is the domain-specific application of the universal persistence habit","s"]]},{"id":"mt_IM1G_7QzTa","s":"Mathematics","d":"Mathematical Thinking","n":"Real-World to Maths Connections","desc":"Move between a real-world situation and a mathematical representation using concrete objects, drawings, diagrams, tables, number sentences, or bar models","a":[5,6],"ev":["Given a story about combining groups, represent it with counters or cubes and find the total","Given a set of objects, tell a simple addition or subtraction story to match","Connect a physical action (putting together, taking away) to the matching operation"],"pre":[["mt_PgsHGYJMH-","Representing addition/subtraction with objects and drawings is the core exercise of early quantitative reasoning","s"],["mt_yJmvUCCym7","Solving word problems within 10 with objects requires translating between situation and representation","s"]]},{"id":"mt_nyK25mNOeR","s":"Mathematics","d":"Mathematical Thinking","n":"Showing Your Working","desc":"Show and tell how a mathematical answer was found using objects, drawings, and spoken words","a":[5,6],"ev":["Use o
